/* =========================================================
   ESKİ VERİ → YENİ VERİ
   ========================================================= */

function normalizeData(
  input
){

  const base =
    defaultData();


  if(
    !input ||
    typeof input !== "object"
  ){

    return base;

  }


  /*
   * Yeni sistemde stores varsa
   * onları kullan.
   */

  if(
    input.stores &&
    input.stores.premium &&
    input.stores.outlet
  ){

    const result = {
      ...base,
      ...input
    };


    result.logo = {
      ...base.logo,
      ...(input.logo || {})
    };


    result.theme = {
      ...base.theme,
      ...(input.theme || {})
    };


    result.stores =
      normalizeStores(
        input.stores
      );


    return result;

  }


  /*
   * ESKİ SİSTEM:
   * Mevcut katalog otomatik olarak
   * Premium mağazasına aktarılır.
   */

  const result = {
    ...base,
    ...input
  };


  result.logo = {
    ...base.logo,
    ...(input.logo || {})
  };


  result.theme = {
    ...base.theme,
    ...(input.theme || {})
  };


  const premium =
    createStore("Premium");


  if(
    Array.isArray(
      input.categories
    )
  ){

    premium.categories =
      input.categories.map(
        oldCategory => {

          return {

            id:
              oldCategory.id ||
              uid(),

            name:
              getOldText(
                oldCategory.name
              ) ||
              "Kategori",

            items:
              Array.isArray(
                oldCategory.items
              )
                ?
                oldCategory.items.map(
                  oldItem => {

                    const oldPrice =
                      oldItem.price || {};


                    let prices = [];


                    if(
                      Array.isArray(
                        oldItem.prices
                      )
                    ){

                      prices =
                        oldItem.prices;

                    }

                    else if(
                      oldPrice.amount !==
                        null &&
                      oldPrice.amount !==
                        undefined &&
                      oldPrice.amount !==
                        ""
                    ){

                      prices = [
                        {
                          id:uid(),
                          name:"Ürün Fiyatı",
                          amount:
                            oldPrice.amount,
                          contactOnly:
                            !!oldPrice.contactOnly
                        }
                      ];

                    }

                    else {

                      prices = [
                        {
                          id:uid(),
                          name:"Ürün Fiyatı",
                          amount:"",
                          contactOnly:true
                        }
                      ];

                    }


                    return {

                      id:
                        oldItem.id ||
                        uid(),

                      name:
                        getOldText(
                          oldItem.name
                        ) ||
                        "Yeni Ürün",

                      desc:
                        getOldText(
                          oldItem.desc
                        ) ||
                        "",

                      dims:
                        oldItem.dims ||
                        "",

                      image:
                        oldItem.image ||
                        null,

                      prices:
                        normalizePrices(
                          prices
                        )

                    };

                  }
                )
                :
                []

          };

        }
      );

  }


  result.stores = {

    premium:
      premium,

    outlet:
      createStore("Outlet")

  };


  delete result.categories;


  return result;

}


/* =========================================================
   ESKİ ÇOK DİLLİ TEXT
   ========================================================= */

function getOldText(
  value
){

  if(
    typeof value === "string"
  ){

    return value;

  }


  if(
    value &&
    typeof value === "object"
  ){

    return (
      value.tr ||
      value.en ||
      value.ar ||
      ""
    );

  }


  return "";

}


/* =========================================================
   FİYATLARI DÜZELT
   ========================================================= */

function normalizePrices(
  prices
){

  if(
    !Array.isArray(prices) ||
    prices.length === 0
  ){

    return [
      createPriceItem(
        "Ürün Fiyatı",
        ""
      )
    ];

  }


  return prices.map(
    price => {

      return {

        id:
          price.id ||
          uid(),

        name:
          price.name ||
          "Ürün Fiyatı",

        amount:
          price.amount ??
          "",

        contactOnly:
          !!price.contactOnly

      };

    }
  );

}


/* =========================================================
   MAĞAZALARI DÜZELT
   ========================================================= */

function normalizeStores(
  stores
){

  const output =
    defaultData().stores;


  ["premium","outlet"]
    .forEach(
      storeKey => {

        const inputStore =
          stores?.[storeKey];


        if(!inputStore){
          return;
        }


        output[storeKey] = {

          ...output[storeKey],

          ...inputStore,

          categories:
            Array.isArray(
              inputStore.categories
            )
              ?
              inputStore.categories.map(
                category => {

                  return {

                    ...category,

                    id:
                      category.id ||
                      uid(),

                    name:
                      category.name ||
                      "Kategori",

                    items:
                      Array.isArray(
                        category.items
                      )
                        ?
                        category.items.map(
                          item => {

                            return {

                              ...item,

                              id:
                                item.id ||
                                uid(),

                              name:
                                item.name ||
                                "Yeni Ürün",

                              desc:
                                item.desc ||
                                "",

                              dims:
                                item.dims ||
                                "",

                              image:
                                item.image ||
                                null,

                              prices:
                                normalizePrices(
                                  item.prices
                                )

                            };

                          }
                        )
                        :
                        []

                  };

                }
              )
              :
              []

        };

      }
    );


  return output;

}


/* =========================================================
   RESİM SIKIŞTIR
   ========================================================= */

function resizeImg(
  file,
  maxWidth=1000,
  quality=.78
){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();


      reader.onload =
        event => {

          const img =
            new Image();


          img.onload =
            ()=>{

              let width =
                img.width;

              let height =
                img.height;


              if(
                width >
                maxWidth
              ){

                height =
                  Math.round(
                    height *
                    (
                      maxWidth /
                      width
                    )
                  );

                width =
                  maxWidth;

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  quality
                )
              );

            };


          img.onerror =
            reject;


          img.src =
            event.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   DATA URL
   ========================================================= */

function dataUrlToBlob(
  dataUrl
){

  const parts =
    dataUrl.split(",");


  const mime =
    (
      parts[0].match(
        /data:([^;]+)/
      ) || []
    )[1] ||
    "image/jpeg";


  const binary =
    atob(
      parts[1]
    );


  const bytes =
    new Uint8Array(
      binary.length
    );


  for(
    let i=0;
    i<binary.length;
    i++
  ){

    bytes[i] =
      binary.charCodeAt(i);

  }


  return new Blob(
    [bytes],
    {
      type:mime
    }
  );

}


/* =========================================================
   STORAGE
   ========================================================= */

async function uploadImage(
  file,
  folder,
  id,
  maxWidth=1000,
  quality=.78
){

  const compressed =
    await resizeImg(
      file,
      maxWidth,
      quality
    );


  const blob =
    dataUrlToBlob(
      compressed
    );


  const path =
    SITE_ID +
    "/" +
    folder +
    "/" +
    id +
    "-" +
    Date.now() +
    ".jpg";


  const result =
    await supabase.storage
      .from(
        STORAGE_BUCKET
      )
      .upload(
        path,
        blob,
        {
          contentType:
            "image/jpeg",

          cacheControl:
            "31536000",

          upsert:false
        }
      );


  if(
    result.error
  ){

    throw result.error;

  }


  return supabase.storage
    .from(
      STORAGE_BUCKET
    )
    .getPublicUrl(
      path
    )
    .data
    .publicUrl;

}

function App(){

  const [data,setData] =
    useState(null);

  const [loading,setLoading] =
    useState(true);

  const [store,setStore] =
    useState("premium");

  const [activeCat,setActiveCat] =
    useState(null);

  const [search,setSearch] =
    useState("");

  const [detail,setDetail] =
    useState(null);

  const [panelOpen,setPanelOpen] =
    useState(false);

  const [unlocked,setUnlocked] =
    useState(false);

  const [pinModal,setPinModal] =
    useState(false);

  const [pinInput,setPinInput] =
    useState("");

  const [pinError,setPinError] =
    useState(false);

  const [tab,setTab] =
    useState("magaza");

  const [adminStore,setAdminStore] =
    useState("premium");

  const [openCat,setOpenCat] =
    useState(null);

  const [saving,setSaving] =
    useState(false);

  const [toast,setToast] =
    useState("");

  const [busy,setBusy] =
    useState(false);

  const [saved,setSaved] =
    useState(false);

  const logoRef =
    useRef(null);

  const bgRef =
    useRef(null);

  const itemRefs =
    useRef({});


  /* =======================================================
     TOAST
     ======================================================= */

  function showToast(
    message
  ){

    setToast(message);

    setTimeout(
      ()=>{
        setToast("");
      },
      3000
    );

  }


  /* =======================================================
     VERİYİ YÜKLE
     ======================================================= */

  useEffect(
    ()=>{

      let cancelled=false;


      async function load(){

        try{

          const result =
            await supabase
              .from("site_data")
              .select("data")
              .eq("id",SITE_ID)
              .maybeSingle();


          if(
            result.error
          ){

            throw result.error;

          }


          let loaded;


          if(
            result.data?.data
          ){

            loaded =
              normalizeData(
                result.data.data
              );

          }

          else{

            loaded =
              defaultData();

            await supabase
              .from("site_data")
              .upsert({
                id:SITE_ID,
                data:loaded,
                updated_at:
                  new Date().toISOString()
              });

          }


          if(cancelled){
            return;
          }


          setData(
            loaded
          );


          const firstCategory =
            loaded.stores
              .premium
              .categories?.[0];


          setActiveCat(
            firstCategory?.id ||
            null
          );


        }

        catch(error){

          console.error(
            "Veri yükleme hatası:",
            error
          );


          if(!cancelled){

            const fallback =
              defaultData();


            setData(
              fallback
            );


            setActiveCat(
              fallback.stores
                .premium
                .categories?.[0]?.id ||
              null
            );


            showToast(
              "Veritabanı okunamadı. Varsayılan yapı açıldı."
            );

          }

        }

        finally{

          if(!cancelled){

            setLoading(
              false
            );

          }

        }

      }


      load();


      return()=>{
        cancelled=true;
      };

    },
    []
  );


  /* =======================================================
     MAĞAZA DEĞİŞTİR
     ======================================================= */

  function changeStore(
    newStore
  ){

    setStore(
      newStore
    );

    setSearch("");

    const first =
      data?.stores?.[newStore]
        ?.categories?.[0];


    setActiveCat(
      first?.id ||
      null
    );

  }


  /* =======================================================
     VERİ DEĞİŞTİR
     ======================================================= */

  function updateData(
    callback
  ){

    setData(
      previous=>{

        if(!previous){
          return previous;
        }


        const copy =
          JSON.parse(
            JSON.stringify(
              previous
            )
          );


        callback(
          copy
        );


        return copy;

      }
    );

  }


  /* =======================================================
     KAYDET
     ======================================================= */

  async function save(){

    if(
      !data ||
      saving
    ){

      return;

    }


    setSaving(
      true
    );


    try{

      const clean =
        normalizeData(
          data
        );


      const result =
        await supabase
          .from("site_data")
          .upsert(
            {
              id:SITE_ID,
              data:clean,
              updated_at:
                new Date().toISOString()
            },
            {
              onConflict:"id"
            }
          );


      if(result.error){

        throw result.error;

      }


      setData(
        clean
      );

        ()=>{

        },
        900
      );

    }

      console.error(
        error
      );


      showToast(
        "Kaydetme hatası: " +
        (
          error?.message ||
          "Bilinmeyen hata"
        )
      );

    }

    finally{

      setSaving(
        false
      );

    }

  }

    itemId,
    event

    const file =
      event.target.files?.[0];


    if(!file){
      return;
    }


    setBusy(true);


    try{

      const url =
        await uploadImage(
          file,
          "products",
          itemId,
          1000,
          .76

      updateItem(
        categoryId,
        itemId,
        "image",
        url
      );


      showToast(
        "Ürün görseli yüklendi. Kaydedin."

    }

    catch(error){

      console.error(
        error
      );


      showToast(
        "Görsel yüklenemedi."
      );

    }

    finally{

      setBusy(false);


      event.target.value="";

    }

  }

                    <input
                      type="range"
                      min="100"
                      max="320"
                      value={
                        data.cardImgSize
                      }
                      onChange={
                        event=>{
                          updateData(
                            copy=>{
                              copy.cardImgSize =
                                Number(
                                  event.target.value
                                );
                            }
                          );
                        }
                      }
                      className="w-full"
                    />

                  </label>


                  <label
                    className="block"
                  >

                    <AdminLabel>
                      Yönetim PIN
                    </AdminLabel>

                    <input
                      className="admin-input"
                      inputMode="numeric"
                      maxLength={8}
                      value={
                        data.pin
                      }
                      onChange={
                        event=>{
                          updateData(
                            copy=>{
                              copy.pin =
                                event.target.value.replace(
                                  /\D/g,
                                  ""
                                );
                            }
                          );
                        }
                      }
                    />

                  </label>

                </div>

              )}

            </div>


            {/* KAYDET */}

            <div
              className="sticky bottom-0 bg-neutral-950 border-t border-neutral-800 p-4"
            >

              <button
                onClick={save}
                disabled={
                  saving ||
                  busy
                }
                className="w-full py-3.5 rounded-xl font-bold text-white flex items-center justify-center gap-2"
                style={{
                  background:
                    saved
                      ?
                      "#12B76A"
                      :
                      data.theme.accent,
                  animation:
                    saving
                      ?
                      "none"
                      :
                      "pulse 2.2s infinite"
                }}
              >

                {saved
                  ?
                  <Icon
                    type="check"
                    size={17}
                  />
                  :
                  <Icon
                    type="save"
                    size={17}
                  />
                }

                {saved
                  ?
                  "Kaydedildi!"
                  :
                  saving
                    ?
                    "Kaydediliyor..."
                    :
                    "Kaydet ve Kapat"
                }

              </button>

            </div>

          </aside>

        </div>

      )}

    </div>

  );

}


/* =========================================================
   ITEM BUL
   ========================================================= */

function findItem(
  data,
  store,
  categoryId,
  itemId
){

  const category =
    data.stores[
      store
    ]?.categories?.find(
      x =>
        x.id ===
        categoryId
    );


  return category?.items?.find(
    x =>
      x.id ===
      itemId
  );

}


/* =========================================================
   ADMIN LABEL
   ========================================================= */

function AdminLabel({
  children
}){

  return(

    <div
      style={{
        color:"#737373",
        fontSize:10,
        fontWeight:700,
        letterSpacing:".08em",
        textTransform:"uppercase",
        marginBottom:6
      }}
    >
      {children}
    </div>

  );

}


/* =========================================================
   COLOR
   ========================================================= */

function ColorInput({
  label,
  value,
  onChange
}){

  return(

    <label
      className="flex items-center justify-between mb-3"
    >

      <span
        className="text-xs text-neutral-400"
      >
        {label}
      </span>


      <input
        type="color"
        value={
          value ||
          "#000000"
        }
        onChange={
          event =>
            onChange(
              event.target.value
            )
        }
        className="w-10 h-10 rounded-lg border border-neutral-700 bg-transparent"
      />

    </label>

  );

}


/* =========================================================
   BAŞLAT
   ========================================================= */

ReactDOM
  .createRoot(
    document.getElementById(
      "root"
    )
  )
  .render(
    <App />
  );

</script>

</body>
