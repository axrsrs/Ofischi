/* =========================================================

function normalizeData(input){

  const base=defaultData();

  if(
    !input ||
    typeof input!=="object"
  ){
    return base;
  }


  const result={
    ...base,
    ...input
  };


  result.rates={
    ...base.rates,
    ...(input.rates||{})
  };


  result.logo={
    ...base.logo,
    ...(input.logo||{})
  };


  result.theme={
    ...base.theme,
    ...(input.theme||{})
  };


  result.siteName=
    input.siteName ||
    base.siteName;


  result.subtitle=
    input.subtitle ||
    base.subtitle;


  result.eyebrow=
    input.eyebrow ||
    base.eyebrow;


  result.phone=
    input.phone ||
    "";


  result.pin=
    input.pin ||
    "1234";


  result.cardImgSize=
    Number(input.cardImgSize) ||
    170;


  if(
    !Array.isArray(input.categories) ||
    input.categories.length===0
  ){

    result.categories=
      createDefaultCategories();

  }else{

    result.categories=
      input.categories.map(category=>({

        ...category,

        id:
          category.id ||
          uid(),

        name:
          typeof category.name==="string"
            ? category.name
            : (
              category.name?.tr ||
              "Kategori"
            ),

        items:
          Array.isArray(category.items)

              dims:

              price:{

                /*

                 * price.parts kullanılabilir.
                 */

                parts:

              image:

/* =========================================================
   BASE64 → BLOB
   ========================================================= */

function dataUrlToBlob(dataUrl){

  const parts=dataUrl.split(",");

  const meta=parts[0]||"";

  const data=parts[1]||"";

  const mimeMatch=
    meta.match(/data:([^;]+)/);

  const mime=
    mimeMatch
      ? mimeMatch[1]
      : "image/jpeg";

  const binary=atob(data);

  const bytes=
    new Uint8Array(binary.length);

  for(
    let i=0;
    i<binary.length;
    i++
  ){

    bytes[i]=
      binary.charCodeAt(i);

  }

  return new Blob(
    [bytes],
    {
      type:mime
    }
  );

}


/* =========================================================
   GÖRSEL SIKIŞTIRME
   ========================================================= */

function resizeImg(
  file,
  maxWidth=1000,
  quality=.78
){

  return new Promise(
    (resolve,reject)=>{

      const reader=
        new FileReader();

      reader.onload=
        event=>{

          const img=
            new Image();

          img.onload=()=>{

            let width=img.width;

            let height=img.height;


            if(
              width>maxWidth
            ){

              height=
                Math.round(
                  height*
                  (
                    maxWidth/
                    width
                  )
                );

              width=maxWidth;

            }


            const canvas=
              document.createElement(
                "canvas"
              );

            canvas.width=width;

            canvas.height=height;


            const ctx=
              canvas.getContext(
                "2d",
                {
                  alpha:false
                }
              );


            ctx.drawImage(
              img,
              0,
              0,
              width,
              height
            );


            resolve(
              canvas.toDataURL(
                "image/jpeg",
                quality
              )
            );

          };


          img.onerror=reject;

          img.src=
            event.target.result;

        };


      reader.onerror=reject;

      reader.readAsDataURL(file);

    }
  );

}

/* =========================================================
   STORAGE UPLOAD
   ========================================================= */

async function uploadBlobToStorage(
  blob,
  path
){

  const result=
    await supabase.storage
      .from(STORAGE_BUCKET)
      .upload(
        path,
        blob,
        {
          contentType:"image/jpeg",
          cacheControl:"31536000",
          upsert:false
        }
      );


  if(result.error){
    throw result.error;
  }


  const publicResult=
    supabase.storage
      .from(STORAGE_BUCKET)
      .getPublicUrl(path);


  return(
    publicResult
      ?.data
      ?.publicUrl ||
    null
  );

}


/* =========================================================
   ESKİ FOTOĞRAF TAŞIMA
   ========================================================= */

async function migrateOldImages(
  originalData,
  onProgress
){

  const copy=
    normalizeData(originalData);

  const tasks=[];


  if(
    typeof copy.logo?.src==="string" &&
    copy.logo.src.startsWith("data:image/")
  ){

    tasks.push({
      type:"logo",
      id:"logo",
      value:copy.logo.src
    });

  }


  if(
    typeof copy.theme?.bgImage==="string" &&
    copy.theme.bgImage.startsWith("data:image/")
  ){

    tasks.push({
      type:"background",
      id:"background",
      value:copy.theme.bgImage
    });

  }


  copy.categories.forEach(category=>{

    category.items.forEach(item=>{

      if(
        typeof item.image==="string" &&
        item.image.startsWith("data:image/")
      ){

        tasks.push({
          type:"product",
          id:item.id,
          value:item.image,
          categoryId:category.id
        });

      }

    });

  });


  if(tasks.length===0){

    return{
      data:copy,
      migrated:0
    };

  }


  let completed=0;

  const concurrency=3;


  async function worker(){

    while(true){

      const task=tasks.shift();

      if(!task){
        break;
      }


      try{

        const blob=
          dataUrlToBlob(task.value);

        const path=
          storagePath(
            task.type,
            task.id
          );

        const url=
          await uploadBlobToStorage(
            blob,
            path
          );


        if(task.type==="logo"){

          copy.logo.src=url;

        }else if(
          task.type==="background"
        ){

          copy.theme.bgImage=url;

        }else{

          const category=
            copy.categories.find(
              x=>x.id===task.categoryId
            );

          const item=
            category?.items.find(
              x=>x.id===task.id
            );

          if(item){
            item.image=url;
          }

        }


        completed++;


        if(onProgress){

          onProgress(
            completed,
            completed+
            tasks.length
          );

        }

      }catch(error){

        console.error(
          "Fotoğraf taşıma hatası:",
          error
        );

      }

    }

  }


  await Promise.all(
    Array.from(
      {
        length:
          Math.min(
            concurrency,
            tasks.length
          )
      },
      worker
    )
  );


  return{
    data:copy,
    migrated:completed
  };

}


/* =========================================================
   FİYAT FORMAT
   ========================================================= */

function numberTR(value){

  return Number(value).toLocaleString(
    "tr-TR",
    {
      minimumFractionDigits:0,
      maximumFractionDigits:2
    }
  );

}


function numberUSD(value){

  return Number(value).toLocaleString(
    "en-US",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


function numberEUR(value){

  return Number(value).toLocaleString(
    "de-DE",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}

function PriceDisplay({
  price,
  rates,
  compact=false
}){

  if(
    !price ||
    price.contactOnly
  ){

    return(
      <div
        style={{
          color:"inherit",
          fontWeight:700
        }}
      >
        Fiyat için iletişime geçin
      </div>
    );

  }


  const amount=
    Number(price.amount);


  if(
    !Number.isFinite(amount)
  ){

    return(
      <div>
        Fiyat için iletişime geçin
      </div>
    );

  }


  const usdRate=
    Number(rates?.USD)||1;

  const eurRate=
    Number(rates?.EUR)||1;


  const usd=
    amount/usdRate;

  const eur=
    amount/eurRate;


  return(

    <div
      style={{
        display:"flex",
        flexDirection:"column",
        gap:compact?"1px":"3px"
      }}
    >

      <div
        style={{
          fontWeight:800,
          fontSize:
            compact
              ? "12px"
              : "15px"
        }}
      >
        {numberTR(amount)} ₺
      </div>


      <div
        style={{
          fontSize:
            compact
              ? "10px"
              : "12px",
          opacity:.68
        }}
      >
        ${numberUSD(usd)}
      </div>


      <div
        style={{
          fontSize:
            compact
              ? "10px"
              : "12px",
          opacity:.68
        }}
      >
        €{numberEUR(eur)}
      </div>

    </div>

  );

}

          loadedData=
            defaultData();


          const insert=
            await supabase
              .from("site_data")
              .insert({
                id:SITE_ID,
                data:loadedData,
                updated_at:
                  new Date().toISOString()
              });


          if(
            insert.error &&
            insert.error.code!=="23505"
          ){

            console.error(
              "İlk veri oluşturulamadı:",
              insert.error
            );

          }

        }


        if(cancelled){
          return;
        }


        setData(loadedData);


        setActiveCat(
          loadedData
            .categories?.[0]?.id ||
          null
        );


        const total=
          countBase64Images(
            loadedData
          );


        if(total>0){

          setMigration({
            active:true,
            current:0,
            total
          });


          try{

            const migrated=
              await migrateOldImages(
                loadedData,
                (current,totalCount)=>{

                  if(cancelled){
                    return;
                  }

                  setMigration({
                    active:true,
                    current,
                    total:totalCount
                  });

                }
              );


            if(cancelled){
              return;
            }


            setData(migrated.data);


            if(migrated.migrated>0){

              const saveResult=
                await supabase
                  .from("site_data")
                  .upsert(
                    {
                      id:SITE_ID,
                      data:migrated.data,
                      updated_at:
                        new Date().toISOString()
                    },
                    {
                      onConflict:"id"
                    }
                  );


              if(saveResult.error){

                console.error(
                  "Fotoğraf kaydı:",
                  saveResult.error
                );

              }else{

                showToast(
                  migrated.migrated+
                  " fotoğraf optimize edildi"
                );

              }

            }

          }catch(error){

            console.error(
              "Migrasyon hatası:",
              error
            );

          }finally{

            if(!cancelled){

              setMigration({
                active:false,
                current:0,
                total:0
              });

            }

          }

        }

      }catch(error){

        console.error(
          "SUPABASE OKUMA HATASI:",
          error
        );


        if(cancelled){
          return;
        }


        const fallback=
          defaultData();


        setData(fallback);


        setActiveCat(
          fallback.categories[0]?.id ||
          null
        );


        showToast(
          "Veritabanı bağlantısı kontrol edilmeli"
        );

      }finally{

        if(!cancelled){

          setLoading(false);

        }

      }

    }


    loadData();


    return()=>{

      cancelled=true;

    };

  },[]);


  /* =======================================================
     BASE64 SAY
     ======================================================= */

  function countBase64Images(source){

    let count=0;


    if(
      source?.logo?.src
        ?.startsWith("data:image/")
    ){
      count++;
    }


    if(
      source?.theme?.bgImage
        ?.startsWith("data:image/")
    ){
      count++;
    }


    source?.categories?.forEach(category=>{

      category.items?.forEach(item=>{

        if(
          item.image
            ?.startsWith("data:image/")
        ){
          count++;
        }

      });

    });


    return count;

  }


  /* =======================================================
     VERİ DEĞİŞTİR
     ======================================================= */

  function updateData(callback){

    setData(previous=>{

      if(!previous){
        return previous;
      }


      const copy={
        ...previous
      };


      callback(copy);


      return copy;

    });

  }


  function setPath(path,value){

    updateData(copy=>{

      let target=copy;


      for(
        let i=0;
        i<path.length-1;
        i++
      ){

        const key=path[i];


        target[key]={
          ...(target[key]||{})
        };


        target=target[key];

      }


      target[
        path[path.length-1]
      ]=value;

    });

  }


  /* =======================================================
     KAYDET
     ======================================================= */

  async function save(){

    if(!data || saving){
      return;
    }


    setSaving(true);


    try{

      const dataToSave=
        normalizeData(data);


      if(
        countBase64Images(dataToSave)>0
      ){

        throw new Error(
          "Fotoğraflar hâlâ hazırlanıyor."
        );

      }


      const result=
        await supabase
          .from("site_data")
          .upsert(
            {
              id:SITE_ID,
              data:dataToSave,
              updated_at:
                new Date().toISOString()
            },
            {
              onConflict:"id"
            }
          );


      if(result.error){
        throw result.error;
      }


      setData(dataToSave);

      setSaved(true);

      showToast(
        "Başarıyla kaydedildi"
      );


      setTimeout(()=>{

        setSaved(false);

        setPanelOpen(false);

      },900);


    }catch(error){

      console.error(
        "KAYDETME HATASI:",
        error
      );


      showToast(
        "Kaydetme hatası: "+
        (
          error?.message ||
          "Supabase bağlantısı"
        )
      );

    }finally{

      setSaving(false);

    }

  }

  /* =======================================================

     ======================================================= */

  function moveCategory(
    id,
    direction
  ){

    updateData(copy=>{

      const list=[
        ...copy.categories
      ];


      const index=
        list.findIndex(
          category=>
            category.id===id
        );


      const target=
        index+direction;


      if(
        index<0 ||
        target<0 ||
        target>=list.length
      ){
        return;
      }


      [
        list[index],
        list[target]
      ]=[
        list[target],
        list[index]
      ];


      copy.categories=list;

    });

  }

                    className="w-full py-3 rounded-xl text-sm font-bold text-white mb-4 flex items-center justify-center gap-2"
                    style={{
                      backgroundColor:
                        data.theme.accent
                    }}
                  >

                    <Icon
                      type="plus"
                      size={17}
                    />

                    Yeni Kategori

                  </button>


                  {data.categories.map(
                    (
                      category,
                      categoryIndex
                    )=>{

                      const isOpen=
                        activeCat===
                        category.id;


                      return(

                        <div
                          key={category.id}
                          className="bg-neutral-900 border border-neutral-800 rounded-xl mb-3 overflow-hidden"
                        >

                          <div
                            className="p-2 flex items-center gap-1.5"
                          >

                            <input
                              value={category.name}
                              onChange={event=>
                                renameCategory(
                                  category.id,
                                  event.target.value
                                )
                              }
                              className="admin-input"
                              style={{
                                padding:"9px 10px",
                                fontSize:"13px"
                              }}
                            />


                            <button
                              onClick={()=>
                                moveCategory(
                                  category.id,
                                  -1
                                )
                              }
                              disabled={
                                categoryIndex===0
                              }
                              className="p-2 bg-neutral-800 rounded-lg disabled:opacity-20"
                            >

                              <Icon
                                type="up"
                                size={14}
                              />

                            </button>


                            <button
                              onClick={()=>
                                moveCategory(
                                  category.id,
                                  1
                                )
                              }
                              disabled={
                                categoryIndex===
                                data.categories.length-1
                              }
                              className="p-2 bg-neutral-800 rounded-lg disabled:opacity-20"
                            >

                              <Icon
                                type="down"
                                size={14}
                              />

                            </button>


                            <button
                              onClick={()=>
                                deleteCategory(
                                  category.id
                                )
                              }
                              className="p-2 bg-red-950 text-red-400 rounded-lg"
                            >

                              <Icon
                                type="trash"
                                size={14}
                              />

                            </button>


                            <button
                              onClick={()=>
                                setActiveCat(
                                  isOpen
                                    ?
                                    null
                                    :
                                    category.id
                                )
                              }
                              className="px-2.5 py-2 bg-neutral-800 rounded-lg text-[11px] whitespace-nowrap"
                            >

                              {isOpen
                                ?
                                "Kapat"
                                :
                                "Ürünler"
                              }

                            </button>

                          </div>


                          {isOpen &&(

                            <div className="p-2 pt-0">

                              {category.items.map(
                                (
                                  item,
                                  itemIndex
                                )=>(

                                  <div
                                    key={item.id}
                                    className="bg-neutral-800 rounded-xl p-3 mb-2"
                                  >

                                    {/* ÜRÜN ÜST */}

                                    <div
                                      className="flex gap-2 mb-2"
                                    >

                                      <div
                                        onClick={()=>
                                          itemRefs.current[
                                            item.id
                                          ]?.click()
                                        }
                                        className="w-16 h-16 rounded-lg bg-neutral-700 flex-shrink-0 overflow-hidden flex items-center justify-center cursor-pointer"
                                        style={{
                                          backgroundImage:
                                            item.image
                                              ?
                                              `url(${item.image})`
                                              :
                                              undefined,
                                          backgroundSize:"cover",
                                          backgroundPosition:"center"
                                        }}
                                      >

                                        {!item.image &&(

                                          <Icon
                                            type="image"
                                            size={18}
                                          />

                                        )}

                                      </div>


                                      <input
                                        type="file"
                                        accept="image/*"
                                        className="hidden"
                                        ref={element=>{

                                          itemRefs.current[
                                            item.id
                                          ]=element;

                                        }}
                                        onChange={event=>
                                          uploadItemImage(
                                            category.id,
                                            item.id,
                                            event
                                          )
                                        }
                                      />


                                      <div className="flex-1">

                                        <input
                                          value={item.name}
                                          onChange={event=>
                                            updateItem(
                                              category.id,
                                              item.id,
                                              "name",
                                              event.target.value
                                            )
                                          }
                                          placeholder="Ürün adı"
                                          className="admin-input"
                                          style={{
                                            padding:"8px 9px",
                                            fontSize:"12px",
                                            marginBottom:"6px"
                                          }}
                                        />


                                        <input
                                          value={item.dims}
                                          onChange={event=>
                                            updateItem(
                                              category.id,
                                              item.id,
                                              "dims",
                                              event.target.value
                                            )
                                          }
                                          placeholder="Ölçüler: 200x90x75 cm"
                                          className="admin-input"
                                          style={{
                                            padding:"8px 9px",
                                            fontSize:"12px"
                                          }}
                                        />

                                      </div>

                                    </div>


                                    {/* AÇIKLAMA */}

                                    <input
                                      value={item.desc}
                                      onChange={event=>
                                        updateItem(
                                          category.id,
                                          item.id,
                                          "desc",
                                          event.target.value
                                        )
                                      }
                                      placeholder="Ürün özellikleri"
                                      className="admin-input"
                                      style={{
                                        padding:"8px 9px",
                                        fontSize:"12px",
                                        marginBottom:"8px"
                                      }}
                                    />


                                    {/* =================================================
                                        ANA FİYAT
                                    ================================================= */}

                                    <div
                                      className="rounded-xl bg-neutral-900 p-3 mb-2"
                                    >

                                      <div
                                        className="text-[10px] font-bold uppercase tracking-widest text-amber-500 mb-2"
                                      >
                                        Ana Fiyat
                                      </div>


                                      <div
                                        className="flex gap-2 items-center mb-2"
                                      >

                                        <input
                                          type="number"
                                          value={
                                            item.price.amount ??
                                            ""
                                          }
                                          disabled={
                                            !!item.price.contactOnly
                                          }
                                          onChange={event=>
                                            updatePrice(
                                              category.id,
                                              item.id,
                                              {
                                                amount:
                                                  event.target.value===""
                                                    ?
                                                    null
                                                    :
                                                    Number(
                                                      event.target.value
                                                    )
                                              }
                                            )
                                          }
                                          placeholder="Fiyat TL"
                                          className="admin-input"
                                          style={{
                                            padding:"8px 9px",
                                            fontSize:"12px",
                                            opacity:
                                              item.price.contactOnly
                                                ?
                                                .4
                                                :
                                                1
                                          }}
                                        />


                                        <label
                                          className="flex items-center gap-1.5 text-[10px] text-neutral-400 whitespace-nowrap"
                                        >

                                          <input
                                            type="checkbox"
                                            checked={
                                              !!item.price.contactOnly
                                            }
                                            onChange={event=>
                                              updatePrice(
                                                category.id,
                                                item.id,
                                                {
                                                  contactOnly:
                                                    event.target.checked
                                                }
                                              )
                                            }
                                          />

                                          İletişime geçin

                                        </label>

                                      </div>


                                      {!item.price.contactOnly &&
                                        item.price.amount!==null &&(

                                        <div
                                          className="text-[10px] text-neutral-500"
                                        >

                                          {numberTR(
                                            item.price.amount
                                          )} ₺
                                          {" / "}
                                          $
                                          {numberUSD(
                                            Number(
                                              item.price.amount
                                            )/
                                            (
                                              Number(
                                                data.rates?.USD
                                              )||1
                                            )
                                          )}
                                          {" / "}
                                          €
                                          {numberEUR(
                                            Number(
                                              item.price.amount
                                            )/
                                            (
                                              Number(
                                                data.rates?.EUR
                                              )||1
                                            )
                                          )}

                                        </div>

                                      )}

                                    </div>


                                    {/* =================================================
                                        AYRI FİYATLAR
                                    ================================================= */}

                                    <div
                                      className="rounded-xl bg-neutral-900 p-3 mb-2"
                                    >

                                      <div
                                        className="flex items-center justify-between gap-2 mb-2"
                                      >

                                        <div
                                          className="text-[10px] font-bold uppercase tracking-widest text-amber-500"
                                        >
                                          Diğer Fiyatlar
                                        </div>


                                        <button
                                          onClick={()=>
                                            addPricePart(
                                              category.id,
                                              item.id
                                            )
                                          }
                                          className="px-2.5 py-1.5 rounded-lg text-[10px] font-bold"
                                          style={{
                                            backgroundColor:
                                              data.theme.accent,
                                            color:"#fff"
                                          }}
                                        >
                                          + Fiyat Ekle
                                        </button>

                                      </div>


                                      {(
                                        item.price?.parts||
                                        []
                                      ).map(part=>(

                                        <div
                                          key={part.id}
                                          className="bg-neutral-800 rounded-lg p-2 mb-2"
                                        >

                                          <div
                                            className="flex gap-2 mb-2"
                                          >

                                            <input
                                              value={
                                                part.name||
                                                ""
                                              }
                                              onChange={event=>
                                                updatePricePart(
                                                  category.id,
                                                  item.id,
                                                  part.id,
                                                  {
                                                    name:
                                                      event.target.value
                                                  }
                                                )
                                              }
                                              placeholder="Fiyat adı (Masa, Koltuk vb.)"
                                              className="admin-input"
                                              style={{
                                                padding:"7px 8px",
                                                fontSize:"11px"
                                              }}
                                            />


                                            <button
                                              onClick={()=>
                                                deletePricePart(
                                                  category.id,
                                                  item.id,
                                                  part.id
                                                )
                                              }
                                              className="px-2 bg-red-950 text-red-400 rounded-lg"
                                            >

                                              <Icon
                                                type="trash"
                                                size={13}
                                              />

                                            </button>

                                          </div>


                                          <div
                                            className="flex gap-2 items-center"
                                          >

                                            <input
                                              type="number"
                                              value={
                                                part.amount ??
                                                ""
                                              }
                                              disabled={
                                                !!part.contactOnly
                                              }
                                              onChange={event=>
                                                updatePricePart(
                                                  category.id,
                                                  item.id,
                                                  part.id,
                                                  {
                                                    amount:
                                                      event.target.value===""
                                                        ?
                                                        null
                                                        :
                                                        Number(
                                                          event.target.value
                                                        )
                                                  }
                                                )
                                              }
                                              placeholder="TL fiyat"
                                              className="admin-input"
                                              style={{
                                                padding:"7px 8px",
                                                fontSize:"11px",
                                                opacity:
                                                  part.contactOnly
                                                    ?
                                                    .4
                                                    :
                                                    1
                                              }}
                                            />


                                            <label
                                              className="flex items-center gap-1 text-[9px] text-neutral-400 whitespace-nowrap"
                                            >

                                              <input
                                                type="checkbox"
                                                checked={
                                                  !!part.contactOnly
                                                }
                                                onChange={event=>
                                                  updatePricePart(
                                                    category.id,
                                                    item.id,
                                                    part.id,
                                                    {
                                                      contactOnly:
                                                        event.target.checked
                                                    }
                                                  )
                                                }
                                              />

                                              İletişim

                                            </label>

                                          </div>

                                        </div>

                                      ))}


                                      {(
                                        item.price?.parts||
                                        []
                                      ).length===0 &&(

                                        <div
                                          className="text-[10px] text-neutral-600"
                                        >
                                          İstersen bu ürüne
                                          ayrı ayrı fiyatlar
                                          ekleyebilirsin.
                                        </div>

                                      )}

                                    </div>


                                    {/* =================================================
                                        ALT BUTONLAR
                                    ================================================= */}

                                    <div
                                      className="flex justify-end gap-1"
                                    >

                                      {item.image &&(

                                        <button
                                          onClick={()=>
                                            updateItem(
                                              category.id,
                                              item.id,
                                              "image",
                                              null
                                            )
                                          }
                                          className="px-2 py-1 bg-neutral-700 rounded text-[10px]"
                                        >
                                          Görseli Sil
                                        </button>

                                      )}


                                      <button
                                        onClick={()=>
                                          moveItem(
                                            category.id,
                                            item.id,
                                            -1
                                          )
                                        }
                                        disabled={
                                          itemIndex===0
                                        }
                                        className="p-1.5 bg-neutral-700 rounded disabled:opacity-20"
                                      >

                                        <Icon
                                          type="up"
                                          size={12}
                                        />

                                      </button>


                                      <button
                                        onClick={()=>
                                          moveItem(
                                            category.id,
                                            item.id,
                                            1
                                          )
                                        }
                                        disabled={
                                          itemIndex===
                                          category.items.length-1
                                        }
                                        className="p-1.5 bg-neutral-700 rounded disabled:opacity-20"
                                      >

                                        <Icon
                                          type="down"
                                          size={12}
                                        />

                                      </button>


                                      <button
                                        onClick={()=>
                                          deleteItem(
                                            category.id,
                                            item.id
                                          )
                                        }
                                        className="p-1.5 bg-red-950 text-red-400 rounded"
                                      >

                                        <Icon
                                          type="trash"
                                          size={12}
                                        />

                                      </button>

                                    </div>

                                  </div>

                                )
                              )}


                              <button
                                onClick={()=>
                                  addItem(
                                    category.id
                                  )
                                }
                                className="w-full py-2.5 bg-neutral-700 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5"
                              >

                                <Icon
                                  type="plus"
                                  size={14}
                                />

                                Ürün Ekle

                              </button>

                            </div>

                          )}

                        </div>

                      );

                    }
                  )}

                </div>

              )}

            </div>


            {/* =================================================
                KAYDET
            ================================================= */}

            <div
              className="sticky bottom-0 bg-neutral-950 border-t border-neutral-800 p-4"
            >

              <button
                onClick={save}
                disabled={
                  saving ||
                  busy ||
                  migration.active
                }
                className="w-full py-3.5 rounded-xl text-sm font-bold text-white flex items-center justify-center gap-2 disabled:opacity-50"
                style={{
                  backgroundColor:
                    saved
                      ?
                      "#12B76A"
                      :
                      data.theme.accent,
                  animation:
                    saved
                      ?
                      "popSave .5s ease"
                      :
                      saving
                        ?
                        "none"
                        :
                        "pulseGlow 2.2s infinite"
                }}
              >

                {saved
                  ?
                  <Icon
                    type="check"
                    size={17}
                  />
                  :
                  <Icon
                    type="save"
                    size={17}
                  />
                }


                {saved
                  ?
                  "Kaydedildi!"
                  :
                  saving
                    ?
                    "Kaydediliyor..."
                    :
                    "Kaydet ve Kapat"
                }

              </button>

            </div>

          </aside>

        </div>

      )}

    </div>

  );

}


/* =========================================================
   ADMIN LABEL
   ========================================================= */

function AdminLabel({
  children
}){

  return(

    <div
      style={{
        color:"#737373",
        fontSize:"10px",
        fontWeight:700,
        letterSpacing:".08em",
        textTransform:"uppercase",
        marginBottom:"6px"
      }}
    >
      {children}
    </div>

  );

}


/* =========================================================
   RENK INPUT
   ========================================================= */

function ColorInput({
  label,
  value,
  onChange
}){

  return(

    <label
      className="flex items-center justify-between mb-3"
    >

      <span
        className="text-xs text-neutral-400"
      >
        {label}
      </span>


      <input
        type="color"
        value={
          value ||
          "#000000"
        }
        onChange={event=>
          onChange(
            event.target.value
          )
        }
        className="w-9 h-9 rounded-lg border border-neutral-700 bg-transparent cursor-pointer"
      />

    </label>

  );

}


/* =========================================================
   BAŞLAT
   ========================================================= */

ReactDOM
  .createRoot(
    document.getElementById("root")
  )
  .render(
    <App/>
  );

</script>

</body>
</html>
