/* =========================================================
   VERİYİ GÜVENLİ HALE GETİR
   ========================================================= */

function normalizeData(input){

  const base=defaultData();

  if(!input || typeof input!=="object"){
    return base;
  }

  const result={
    ...base,
    ...input
  };

  result.siteName={
    ...base.siteName,
    ...(input.siteName||{})
  };

  result.subtitle={
    ...base.subtitle,
    ...(input.subtitle||{})
  };

  result.eyebrow={
    ...base.eyebrow,
    ...(input.eyebrow||{})
  };

  result.rates={
    ...base.rates,
    ...(input.rates||{})
  };

  result.logo={
    ...base.logo,
    ...(input.logo||{})
  };

  result.theme={
    ...base.theme,
    ...(input.theme||{})
  };

  if(Array.isArray(input.categories)){

    result.categories=input.categories.map(c=>({

      ...c,

      id:c.id||uid(),

      name:{
        tr:"",
        en:"",
        ar:"",
        ...(c.name||{})
      },

      items:Array.isArray(c.items)

      ?c.items.map(it=>({

          ...it,

          id:it.id||uid(),

          name:{
            tr:"",
            en:"",
            ar:"",
            ...(it.name||{})
          },

          desc:{
            tr:"",
            en:"",
            ar:"",
            ...(it.desc||{})
          },

          dims:it.dims||"",

          price:{
            amount:null,
            contactOnly:true,
            ...(it.price||{})
          },

          image:it.image||null

        }))

      :[]

    }));

  }

  return result;
}

/* =========================================================

   ========================================================= */

function resizeImg(
  file,
  maxW=900,
  quality=.8
){

  return new Promise((resolve,reject)=>{

    const reader=new FileReader();

    reader.onload=e=>{

      const img=new Image();

      img.onload=()=>{

        let width=img.width;
        let height=img.height;

        if(width>maxW){

          height=Math.round(
            height*(maxW/width)
          );

          width=maxW;

        }

        const canvas=
          document.createElement("canvas");

        canvas.width=width;
        canvas.height=height;

        const ctx=
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        resolve(
          canvas.toDataURL(
            "image/jpeg",
            quality
          )
        );

      };

      img.onerror=reject;

      img.src=e.target.result;

    };

    reader.onerror=reject;

    reader.readAsDataURL(file);

  });

}

/* =========================================================
   FİYAT
   ========================================================= */

function formatPrice(
  price,
  currency,
  rates,
  lang
){

  if(
    !price ||
    price.contactOnly ||
    price.amount===null ||
    price.amount==="" ||
    price.amount===undefined
  ){

    return CONTACT[lang]||CONTACT.tr;

  }

  let amount=Number(price.amount);

  if(currency==="usd"){
    amount/=Number(rates.usd)||1;
  }

  if(currency==="eur"){
    amount/=Number(rates.eur)||1;
  }

  const curr=
    CURR.find(x=>x.c===currency)||CURR[0];

  const decimals=
    currency==="try"?0:2;

  return curr.s+
    amount.toLocaleString(
      "tr-TR",
      {
        minimumFractionDigits:decimals,
        maximumFractionDigits:decimals
      }
    );

}

  /* =======================================================

     ======================================================= */

  function updateData(callback){

    setData(old=>{

      const copy=
        structuredClone(old);

      const result=
        callback(copy);

      return result||copy;

    });

  }

  function setPath(path,value){

    updateData(data=>{

      let obj=data;

      for(
        let i=0;
        i<path.length-1;
        i++
      ){

        if(
          obj[path[i]]===undefined||
          obj[path[i]]===null
        ){
          obj[path[i]]={};
        }

        obj=obj[path[i]];

      }

      obj[path[path.length-1]]=value;

    });

  }

  /* =======================================================
     SUPABASE'E KAYDET
     ======================================================= */

  async function save(){

    if(!data){
      return;
    }

    setSaving(true);

    try{

      /*
       * Önce mevcut kaydı kontrol et.
       * Böylece yanlışlıkla kategorileri boşaltmayız.
       */

      const check=
        await supabase
          .from("site_data")
          .select("id,data")
          .eq("id",SITE_ID)
          .maybeSingle();

      if(check.error){
        throw check.error;
      }

      /*
       * Güvenlik:
       * Ekrandaki kategoriler boşsa ve DB'de kategoriler
       * varsa DB'deki kategorileri silme.
       */

      let dataToSave=
        structuredClone(data);

      const oldCategories=
        check.data?.data?.categories;

      if(
        Array.isArray(oldCategories)&&
        oldCategories.length>0&&
        (!Array.isArray(dataToSave.categories)||
         dataToSave.categories.length===0)
      ){

        dataToSave.categories=
          structuredClone(oldCategories);

        setData(prev=>({
          ...prev,
          categories:
            structuredClone(oldCategories)
        }));

      }

      const result=
        await supabase
          .from("site_data")
          .upsert(
            {
              id:SITE_ID,
              data:dataToSave,
              updated_at:new Date().toISOString()
            },
            {
              onConflict:"id"
            }
          );

      if(result.error){
        throw result.error;
      }

      setData(
        normalizeData(dataToSave)
      );

      setSaved(true);

      showToast(
        "Başarıyla kaydedildi"

      setTimeout(()=>{

        setSaved(false);
        setPanelOpen(false);

      );

      showToast(

        (error.message||"Supabase hatası")

    }finally{

      setSaving(false);

    }

    if(!file){
      return;
    }

    setBusy(true);

    try{

      const src=
        await resizeImg(
          file,
          600,
          .9
        );

      setPath(
        ["logo","src"],
        src
      );

      showToast(
        "Logo eklendi"
      );

    }catch(error){

      console.error(error);

      showToast(
        "Logo yüklenemedi"
      );

    }finally{

      setBusy(false);

    }

  }

     ======================================================= */

  async function uploadBackground(event){

    const file=
      event.target.files?.[0];

    if(!file){
      return;
    }

    setBusy(true);

    try{

      const src=
        await resizeImg(
          file,
          1400,
          .72
        );

      setPath(
        ["theme","bgImage"],
        src
      );

      showToast(
        "Arka plan eklendi"
      );

    }catch(error){

      console.error(error);

      showToast(
        "Görsel yüklenemedi"
      );

    }finally{

      setBusy(false);

    }

  }

  /* =======================================================

     ======================================================= */

  async function uploadItemImage(
    categoryId,
    itemId,
    event
  ){

    const file=
      event.target.files?.[0];

    if(!file){
      return;
    }

    setBusy(true);

    try{

      const src=
        await resizeImg(
          file,
          1000,
          .8
        );

      updateItem(
        categoryId,
        itemId,
        "image",
        src
      );

      showToast(
        "Ürün görseli eklendi"
      );

    }catch(error){

      console.error(error);

      showToast(
        "Görsel yüklenemedi"
      );

    }finally{

      setBusy(false);

    }

  }

                      setPath(
                        ["theme","card"],
                        e.target.value
                      )
                    }
                    className="w-full h-9 mb-3"
                  />

                  <Lbl>
                    Vurgu Rengi
                  </Lbl>

                  <input
                    type="color"
                    value={data.theme.accent}
                    onChange={e=>
                      setPath(
                        ["theme","accent"],
                        e.target.value
                      )
                    }
                    className="w-full h-9 mb-3"
                  />

                  <Lbl>
                    Yazı Rengi
                  </Lbl>

                  <input
                    type="color"
                    value={data.theme.text}
                    onChange={e=>
                      setPath(
                        ["theme","text"],
                        e.target.value
                      )
                    }
                    className="w-full h-9 mb-4"
                  />

                  <div className="flex gap-2 mb-5">

                    <button
                      onClick={()=>
                        bgRef.current?.click()
                      }
                      className="flex-1 py-2.5 bg-neutral-900 border border-neutral-700 rounded-lg text-xs flex items-center justify-center gap-1.5"
                    >

                      <Icon
                        type="upload"
                        size={14}
                      />

                      Arka Plan Görseli

                    </button>

                    {data.theme.bgImage&&(

                      <button
                        onClick={()=>
                          setPath(
                            [
                              "theme",
                              "bgImage"
                            ],
                            null
                          )
                        }
                        className="px-3 bg-red-950 text-red-400 rounded-lg"
                      >
                        <Icon
                          type="trash"
                          size={14}
                        />
                      </button>

                    )}

                    <input
                      ref={bgRef}
                      type="file"
                      accept="image/*"
                      className="hidden"
                      onChange={
                        uploadBackground
                      }
                    />

                  </div>

                  <label className="block mb-4">

                    <Lbl>
                      Ürün Görsel Yüksekliği — {data.cardImgSize}px
                    </Lbl>

                    <input
                      type="range"
                      min="90"
                      max="300"
                      value={data.cardImgSize}
                      onChange={e=>
                        setPath(
                          ["cardImgSize"],
                          Number(
                            e.target.value
                          )
                        )
                      }
                      className="w-full"
                    />

                  </label>

                  <label className="block mb-5">

                    <Lbl>
                      Yönetim PIN
                    </Lbl>

                    <input
                      value={data.pin||""}
                      inputMode="numeric"
                      maxLength="8"
                      onChange={e=>
                        setPath(
                          ["pin"],
                          e.target.value.replace(
                            /\D/g,
                            ""
                          )
                        )
                      }
                      style={{
                        ...fieldStyle,
                        letterSpacing:".3em"
                      }}
                    />

                  </label>

                  <button
                    onClick={resetDefault}
                    className="w-full py-2.5 bg-neutral-900 border border-neutral-700 rounded-lg text-xs text-neutral-400"
                  >
                    Varsayılan Ayarlara Dön
                  </button>

                </div>

              )}

              {/* =================================================
                  KATALOG
              ================================================= */}

              {tab==="icerik"&&(

                <div>

                  <button
                    onClick={addCategory}
                    className="w-full py-3 rounded-xl text-sm font-bold text-white mb-4 flex items-center justify-center gap-2"
                    style={{
                      backgroundColor:
                        data.theme.accent
                    }}
                  >

                    <Icon
                      type="plus"
                      size={17}
                    />

                    Yeni Kategori

                  </button>

                  {data.categories.map(
                    (category,index)=>(

                      <div
                        key={category.id}
                        className="bg-neutral-900 border border-neutral-800 rounded-xl mb-3 overflow-hidden"
                      >

                        <div className="p-2 flex items-center gap-1.5">

                          <input
                            value={
                              category.name[
                                editLang
                              ]||""
                            }
                            onChange={e=>
                              renameCategory(
                                category.id,
                                e.target.value
                              )
                            }
                            style={{
                              ...fieldStyle,
                              padding:"9px 10px",
                              fontSize:13
                            }}
                          />

                          <button
                            onClick={()=>
                              moveCategory(
                                category.id,
                                -1
                              )
                            }
                            disabled={index===0}
                            className="p-2 bg-neutral-800 rounded-lg disabled:opacity-20"
                          >
                            <Icon
                              type="up"
                              size={14}
                            />
                          </button>

                          <button
                            onClick={()=>
                              moveCategory(
                                category.id,
                                1
                              )
                            }
                            disabled={
                              index===
                              data.categories.length-1
                            }
                            className="p-2 bg-neutral-800 rounded-lg disabled:opacity-20"
                          >
                            <Icon
                              type="down"
                              size={14}
                            />
                          </button>

                          <button
                            onClick={()=>
                              deleteCategory(
                                category.id
                              )
                            }
                            className="p-2 bg-red-950 text-red-400 rounded-lg"
                          >
                            <Icon
                              type="trash"
                              size={14}
                            />
                          </button>

                          <button
                            onClick={()=>
                              setOpenCat(
                                openCat===
                                category.id
                                ?null
                                :category.id
                              )
                            }
                            className="px-2.5 py-2 bg-neutral-800 rounded-lg text-[11px] whitespace-nowrap"
                          >
                            {
                              openCat===
                              category.id
                              ?"Kapat"
                              :"Ürünler"
                            }
                          </button>

                        </div>

                        {openCat===category.id&&(

                          <div className="p-2 pt-0">

                            {category.items.map(
                              (item,itemIndex)=>(

                                <div
                                  key={item.id}
                                  className="bg-neutral-800 rounded-xl p-3 mb-2"
                                >

                                  <div className="flex gap-2 mb-2">

                                    <div
                                      onClick={()=>
                                        itemRefs.current[
                                          item.id
                                        ]?.click()
                                      }
                                      className="w-16 h-16 rounded-lg bg-neutral-700 flex-shrink-0 overflow-hidden flex items-center justify-center"
                                      style={{
                                        backgroundImage:
                                          item.image
                                          ?`url(${item.image})`
                                          :undefined,
                                        backgroundSize:"cover",
                                        backgroundPosition:"center"
                                      }}
                                    >

                                      {!item.image&&(

                                        <Icon
                                          type="image"
                                          size={18}
                                        />

                                      )}

                                    </div>

                                    <input
                                      type="file"
                                      accept="image/*"
                                      className="hidden"
                                      ref={element=>
                                        itemRefs.current[
                                          item.id
                                        ]=element
                                      }
                                      onChange={e=>
                                        uploadItemImage(
                                          category.id,
                                          item.id,
                                          e
                                        )
                                      }
                                    />

                                    <div className="flex-1">

                                      <input
                                        value={
                                          item.name[
                                            editLang
                                          ]||""
                                        }
                                        onChange={e=>
                                          updateItem(
                                            category.id,
                                            item.id,
                                            "name",
                                            e.target.value
                                          )
                                        }
                                        placeholder="Ürün adı"
                                        style={{
                                          ...fieldStyle,
                                          padding:"8px 9px",
                                          fontSize:12,
                                          marginBottom:6
                                        }}
                                      />

                                      <input
                                        value={
                                          item.dims||""
                                        }
                                        onChange={e=>
                                          updateItem(
                                            category.id,
                                            item.id,
                                            "dims",
                                            e.target.value
                                          )
                                        }
                                        placeholder="Ölçüler: 200x90x75 cm"
                                        style={{
                                          ...fieldStyle,
                                          padding:"8px 9px",
                                          fontSize:12
                                        }}
                                      />

                                    </div>

                                  </div>

                                  <input
                                    value={
                                      item.desc[
                                        editLang
                                      ]||""
                                    }
                                    onChange={e=>
                                      updateItem(
                                        category.id,
                                        item.id,
                                        "desc",
                                        e.target.value
                                      )
                                    }
                                    placeholder="Ürün özellikleri"
                                    style={{
                                      ...fieldStyle,
                                      padding:"8px 9px",
                                      fontSize:12,
                                      marginBottom:8
                                    }}
                                  />

                                  <div className="flex gap-2 items-center mb-2">

                                    <input
                                      type="number"
                                      disabled={
                                        item.price.contactOnly
                                      }
                                      value={
                                        item.price.amount??""
                                      }
                                      onChange={e=>
                                        updatePrice(
                                          category.id,
                                          item.id,
                                          {
                                            amount:
                                              e.target.value===""
                                              ?null
                                              :Number(
                                                e.target.value
                                              )
                                          }
                                        )
                                      }
                                      placeholder="Fiyat TL"
                                      style={{
                                        ...fieldStyle,
                                        padding:"8px 9px",
                                        fontSize:12,
                                        opacity:
                                          item.price.contactOnly
                                          ?.4
                                          :1
                                      }}
                                    />

                                    <label className="flex items-center gap-1.5 text-[10px] text-neutral-400 whitespace-nowrap">

                                      <input
                                        type="checkbox"
                                        checked={
                                          !!item.price.contactOnly
                                        }
                                        onChange={e=>
                                          updatePrice(
                                            category.id,
                                            item.id,
                                            {
                                              contactOnly:
                                                e.target.checked
                                            }
                                          )
                                        }
                                      />

                                      İletişime geçin

                                    </label>

                                  </div>

                                  <div className="flex justify-end gap-1">

                                    {item.image&&(

                                      <button
                                        onClick={()=>
                                          updateItem(
                                            category.id,
                                            item.id,
                                            "image",
                                            null
                                          )
                                        }
                                        className="px-2 py-1 bg-neutral-700 rounded text-[10px]"
                                      >
                                        Görseli Sil
                                      </button>

                                    )}

                                    <button
                                      onClick={()=>
                                        moveItem(
                                          category.id,
                                          item.id,
                                          -1
                                        )
                                      }
                                      disabled={
                                        itemIndex===0
                                      }
                                      className="p-1.5 bg-neutral-700 rounded disabled:opacity-20"
                                    >
                                      <Icon
                                        type="up"
                                        size={12}
                                      />
                                    </button>

                                    <button
                                      onClick={()=>
                                        moveItem(
                                          category.id,
                                          item.id,
                                          1
                                        )
                                      }
                                      disabled={
                                        itemIndex===
                                        category.items.length-1
                                      }
                                      className="p-1.5 bg-neutral-700 rounded disabled:opacity-20"
                                    >
                                      <Icon
                                        type="down"
                                        size={12}
                                      />
                                    </button>

                                    <button
                                      onClick={()=>
                                        deleteItem(
                                          category.id,
                                          item.id
                                        )
                                      }
                                      className="p-1.5 bg-red-950 text-red-400 rounded"
                                    >
                                      <Icon
                                        type="trash"
                                        size={12}
                                      />
                                    </button>

                                  </div>

                                </div>

                              )
                            )}

                            <button
                              onClick={()=>
                                addItem(
                                  category.id
                                )
                              }
                              className="w-full py-2.5 bg-neutral-700 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5"
                            >

                              <Icon
                                type="plus"
                                size={14}
                              />

                              Ürün Ekle

                            </button>

                          </div>

                        )}

                      </div>

                    )
                  )}

                </div>

              )}

            </div>

            {/* =================================================
                KAYDET
            ================================================= */}

            <div className="sticky bottom-0 bg-neutral-950 border-t border-neutral-800 p-4">

              <button
                onClick={save}
                disabled={saving}
                className="w-full py-3.5 rounded-xl text-sm font-bold text-white flex items-center justify-center gap-2"
                style={{
                  backgroundColor:
                    saved
                    ?" #12B76A"
                    :data.theme.accent,

                  animation:
                    saved
                    ?"popSave .5s ease"
                    :
                    saving
                    ?"none"
                    :"pulseGlow 2.2s infinite"
                }}
              >

                {saved

                  ?

                  <Icon
                    type="check"
                    size={17}
                  />

                  :

                  <Icon
                    type="save"
                    size={17}
                  />

                }

                {saved
                  ?"Kaydedildi!"
                  :
                  saving
                  ?"Kaydediliyor..."
                  :"Kaydet ve Kapat"
                }

              </button>

            </div>

          </aside>

        </div>

      )}

    </div>

  );

}

/* =========================================================
   YARDIMCI STİLLER
   ========================================================= */

const fieldStyle={
  width:"100%",
  background:"#171717",
  border:"1px solid #404040",
  color:"#f5f5f5",
  borderRadius:"8px",
  padding:"10px 12px",
  outline:"none",
  fontSize:"13px"
};

function Lbl({children}){

  return React.createElement(
    "div",
    {
      style:{
        color:"#737373",
        fontSize:"10px",
        fontWeight:700,
        letterSpacing:".08em",
        textTransform:"uppercase",
        marginBottom:"5px"
      }
    },
    children
  );

}

/* =========================================================
   BAŞLAT
   ========================================================= */

ReactDOM
  .createRoot(
    document.getElementById("root")
  )
  .render(
    React.createElement(App)
  );

</script>

</body>
</html>
