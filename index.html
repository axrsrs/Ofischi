/* =========================================================
BASE64
========================================================= */

function dataUrlToBlob(dataUrl){

const parts=dataUrl.split(",");

const mime=
(parts[0].match(/data:([^;]+)/)||[])[1]
||
"image/jpeg";

const binary=atob(parts[1]);

const bytes=new Uint8Array(binary.length);

for(let i=0;i<binary.length;i++){

bytes[i]=binary.charCodeAt(i);

}

return new Blob(
[bytes],
{type:mime}
);

}


/* =========================================================
RESIZE
========================================================= */

function resizeImg(
file,
maxWidth=1000,
quality=.78
){

return new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=e=>{

const img=new Image();

img.onload=()=>{

let width=img.width;
let height=img.height;

if(width>maxWidth){

height=Math.round(
height*(maxWidth/width)
);

width=maxWidth;

}

const canvas=
document.createElement("canvas");

canvas.width=width;
canvas.height=height;

const ctx=
canvas.getContext(
"2d",
{alpha:false}
);

ctx.drawImage(
img,
0,
0,
width,
height
);

resolve(
canvas.toDataURL(
"image/jpeg",
quality
)
);

};

img.onerror=reject;

img.src=e.target.result;

};

reader.onerror=reject;

reader.readAsDataURL(file);

});

}

const result=
await supabase.storage
.from(STORAGE_BUCKET)
.upload(
path,
blob,
{
contentType:"image/jpeg",
cacheControl:"31536000",
upsert:false
}
);

if(result.error){

throw result.error;

}

const publicResult=
supabase.storage
.from(STORAGE_BUCKET)
.getPublicUrl(path);

return publicResult?.data?.publicUrl||null;

}

)return category;

[
list[index],
list[target]
]=[
list[target],
list[index]
];

return{

...category,
items:list

};

});

});

}

<div className="text-[10px] font-bold uppercase tracking-widest text-amber-500 mb-3">
Logo
</div>


<div className="bg-neutral-900 rounded-xl p-4 mb-3 flex items-center justify-center min-h-[110px]">

{data.logo.src?

<img
src={data.logo.src}
alt="Logo"
style={{
maxWidth:"100%",
maxHeight:90,
objectFit:"contain"
}}
/>

:

<div className="text-xs text-neutral-500">
Logo eklenmedi
</div>

}

</div>


<button
disabled={busy}
onClick={()=>
logoRef.current?.click()
}
className="w-full py-2.5 bg-neutral-900 border border-neutral-700 rounded-lg text-xs flex items-center justify-center gap-2"
>

<Icon type="upload" size={14}/>

Logo Yükle

</button>


<input
ref={logoRef}
type="file"
accept="image/png,image/jpeg,image/webp"
className="hidden"
onChange={uploadLogo}
/>


<div className="mt-4">

<AdminLabel>
Logo Boyutu — {data.logo.size}px
</AdminLabel>

<input
type="range"
min="40"
max="260"
value={data.logo.size}
onChange={e=>
updateData(copy=>{
copy.logo.size=
Number(e.target.value);
})
}
className="w-full"
/>

</div>


<div className="mt-4">

<AdminLabel>
Logo Konumu
</AdminLabel>

<div className="grid grid-cols-3 gap-2">

{[
["left","Sol"],
["center","Orta"],
["right","Sağ"]
].map(([value,label])=>(

<button
key={value}
onClick={()=>
updateData(copy=>{
copy.logo.position=value;
})
}
className="py-2 rounded-lg text-xs"
style={{
backgroundColor:
data.logo.position===value
?
data.theme.accent
:
"#1c1917"
}}
>
{label}
</button>

))}

</div>

</div>


<div className="h-px bg-neutral-800 my-5"/>


{/* TEMALAR */}

<div className="text-[10px] font-bold uppercase tracking-widest text-amber-500 mb-3">
Hazır Temalar
</div>


<div className="grid grid-cols-3 gap-2 mb-5">

{THEMES.map(theme=>(

<button
key={theme.id}
onClick={()=>
applyTheme(theme)
}
className="rounded-xl overflow-hidden border-2"
style={{
borderColor:
data.theme.bg===theme.bg&&
data.theme.accent===theme.accent
?
theme.accent
:
"#292524"
}}
>

<div
style={{
height:35,
backgroundColor:theme.bg,
display:"flex",
alignItems:"center",
justifyContent:"center"
}}
>

<span
style={{
width:15,
height:15,
borderRadius:"50%",
backgroundColor:theme.accent
}}
/>

</div>

<div className="bg-neutral-900 py-1 text-[9px]">
{theme.name}
</div>

</button>

))}

</div>


<ColorInput
label="Arka Plan Rengi"
value={data.theme.bg}
onChange={value=>
updateData(copy=>{
copy.theme.bg=value;
})
}
/>


<ColorInput
label="Kart Rengi"
value={data.theme.card}
onChange={value=>
updateData(copy=>{
copy.theme.card=value;
})
}
/>


<ColorInput
label="Vurgu Rengi"
value={data.theme.accent}
onChange={value=>
updateData(copy=>{
copy.theme.accent=value;
})
}
/>


<ColorInput
label="Yazı Rengi"
value={data.theme.text}
onChange={value=>
updateData(copy=>{
copy.theme.text=value;
})
}
/>


<button
disabled={busy}
onClick={()=>
bgRef.current?.click()
}
className="w-full mt-2 py-2.5 bg-neutral-900 border border-neutral-700 rounded-lg text-xs"
>
Arka Plan Görseli Yükle
</button>


<input
ref={bgRef}
type="file"
accept="image/*"
className="hidden"
onChange={uploadBackground}
/>


<div className="mt-4">

<AdminLabel>
Ürün Görsel Yüksekliği — {data.cardImgSize}px
</AdminLabel>

<input
type="range"
min="90"
max="300"
value={data.cardImgSize}
onChange={e=>
updateData(copy=>{
copy.cardImgSize=
Number(e.target.value);
})
}
className="w-full"
/>

</div>


<div className="mt-5">

<AdminLabel>
Yönetim PIN
</AdminLabel>

<input
className="admin-input"
value={data.pin}
inputMode="numeric"
maxLength={8}
onChange={e=>
updateData(copy=>{
copy.pin=
e.target.value.replace(/\D/g,"");
})
}
/>

</div>


<button
onClick={resetDefault}
className="w-full mt-5 py-2.5 bg-neutral-900 border border-neutral-700 rounded-lg text-xs text-neutral-400"
>
Varsayılan Ayarlara Dön
</button>

</div>

)}


{/* ====================================================
ÜRÜN KATALOĞU
==================================================== */}

{tab==="icerik"&&(

<div>


<div
className="mb-4 p-3 rounded-xl"
style={{
background:
"rgba(201,162,39,.08)",
border:
"1px solid rgba(201,162,39,.15)"
}}
>

<div className="text-xs font-bold mb-1">

Şu an düzenlenen mağaza:

</div>

<div
className="text-sm font-bold"
style={{
color:data.theme.accent
}}
>

{editStore==="premium"
?
"PREMIUM MAĞAZA"
:
"OUTLET MAĞAZA"}

</div>

</div>


<button
onClick={addCategory}
className="w-full py-3 rounded-xl text-sm font-bold text-white mb-4 flex items-center justify-center gap-2"
style={{
backgroundColor:data.theme.accent
}}
>

<Icon type="plus" size={17}/>

Yeni Kategori

</button>


{getEditStore().categories.map(
(category,categoryIndex)=>(

<div
key={category.id}
className="bg-neutral-900 border border-neutral-800 rounded-xl mb-3 overflow-hidden"
>


{/* CATEGORY HEADER */}

<div className="p-2 flex items-center gap-1.5">

<input
value={category.name.tr}
onChange={e=>
renameCategory(
category.id,
e.target.value
)
}
className="admin-input"
style={{
padding:"9px 10px",
fontSize:"13px"
}}
/>


<button
onClick={()=>
moveCategory(
category.id,
-1
)
}
disabled={
categoryIndex===0
}
className="p-2 bg-neutral-800 rounded-lg disabled:opacity-20"
>
<Icon type="up" size={14}/>
</button>


<button
onClick={()=>
moveCategory(
category.id,
1
)
}
disabled={
categoryIndex===
getEditStore().categories.length-1
}
className="p-2 bg-neutral-800 rounded-lg disabled:opacity-20"
>
<Icon type="down" size={14}/>
</button>


<button
onClick={()=>
deleteCategory(
category.id
)
}
className="p-2 bg-red-950 text-red-400 rounded-lg"
>
<Icon type="trash" size={14}/>
</button>


<button
onClick={()=>
setOpenCat(
openCat===category.id
?
null
:
category.id
)
}
className="px-2.5 py-2 bg-neutral-800 rounded-lg text-[11px]"
>
{openCat===category.id
?
"Kapat"
:
"Ürünler"}
</button>

</div>


{/* PRODUCTS */}

{openCat===category.id&&(

<div className="p-2 pt-0">

{category.items.map(
(item,itemIndex)=>(

<div
key={item.id}
className="bg-neutral-800 rounded-xl p-3 mb-2"
>


<div className="flex gap-2 mb-2">


<div
onClick={()=>
itemRefs.current[item.id]?.click()
}
className="w-16 h-16 rounded-lg bg-neutral-700 flex-shrink-0 overflow-hidden flex items-center justify-center cursor-pointer"
style={{
backgroundImage:
item.image
?
`url(${item.image})`
:
undefined,
backgroundSize:"cover",
backgroundPosition:"center"
}}
>

{!item.image&&(
<Icon type="image" size={18}/>
)}

</div>


<input
type="file"
accept="image/*"
className="hidden"
ref={element=>{
itemRefs.current[item.id]=element;
}}
onChange={e=>
uploadItemImage(
category.id,
item.id,
e
)
}
/>


<div className="flex-1">

<input
value={item.name.tr}
onChange={e=>
updateItem(
category.id,
item.id,
"name",
e.target.value
)
}
placeholder="Ürün adı"
className="admin-input"
style={{
padding:"8px 9px",
fontSize:"12px",
marginBottom:"6px"
}}
/>


<input
value={item.dims}
onChange={e=>
updateItem(
category.id,
item.id,
"dims",
e.target.value
)
}
placeholder="Ölçüler: 200x90x75 cm"
className="admin-input"
style={{
padding:"8px 9px",
fontSize:"12px"
}}
/>

</div>

</div>


<input
value={item.desc.tr}
onChange={e=>
updateItem(
category.id,
item.id,
"desc",
e.target.value
)
}
placeholder="Ürün özellikleri"
className="admin-input mb-3"
style={{
padding:"8px 9px",
fontSize:"12px"
}}
/>


{/* =================================================
FİYATLAR
================================================= */}

<div className="rounded-xl bg-neutral-900 p-2.5 mb-2">

<div className="flex items-center justify-between mb-2">

<div className="text-[10px] font-bold uppercase tracking-widest text-amber-500">

Fiyatlar

</div>


<button
onClick={()=>
addPrice(
category.id,
item.id
)
}
className="flex items-center gap-1 px-2 py-1.5 rounded-lg text-[10px] font-bold"
style={{
backgroundColor:data.theme.accent,
color:"#fff"
}}
>

<Icon type="plus" size={12}/>

Fiyat Ekle

</button>

</div>


<div className="space-y-2">

{(item.prices||[]).map(price=>(

<div
key={price.id}
className="flex gap-1.5"
>

<input
value={price.label}
onChange={e=>
updatePrice(
category.id,
item.id,
price.id,
"label",
e.target.value
)
}
placeholder="Fiyat adı"
className="admin-input"
style={{
padding:"8px",
fontSize:"11px"
}}
/>


<input
type="number"
value={
price.amount??""
}
onChange={e=>
updatePrice(
category.id,
item.id,
price.id,
"amount",
e.target.value
)
}
placeholder="TL"
className="admin-input"
style={{
width:"105px",
padding:"8px",
fontSize:"11px"
}}
/>


<button
onClick={()=>
deletePrice(
category.id,
item.id,
price.id
)
}
className="px-2 bg-red-950 text-red-400 rounded-lg"
>

<Icon
type="trash"
size={13}
/>

</button>

</div>

))}

</div>

</div>


{/* ACTIONS */}

<div className="flex justify-end gap-1">

{item.image&&(

<button
onClick={()=>
updateItem(
category.id,
item.id,
"image",
null
)
}
className="px-2 py-1 bg-neutral-700 rounded text-[10px]"
>
Görseli Sil
</button>

)}


<button
onClick={()=>
moveItem(
category.id,
item.id,
-1
)
}
disabled={itemIndex===0}
className="p-1.5 bg-neutral-700 rounded disabled:opacity-20"
>
<Icon type="up" size={12}/>
</button>


<button
onClick={()=>
moveItem(
category.id,
item.id,
1
)
}
disabled={
itemIndex===
category.items.length-1
}
className="p-1.5 bg-neutral-700 rounded disabled:opacity-20"
>
<Icon type="down" size={12}/>
</button>


<button
onClick={()=>
deleteItem(
category.id,
item.id
)
}
className="p-1.5 bg-red-950 text-red-400 rounded"
>
<Icon type="trash" size={12}/>
</button>

</div>


{/* ÖNİZLEME */}

<button
onClick={()=>
openDetail(
item,
category
)
}
className="w-full mt-2 py-2 bg-neutral-700 rounded-lg text-[10px] flex items-center justify-center gap-1"
>

<Icon type="eye" size={13}/>

Ürün Detayını Gör

</button>

</div>

))}


<button
onClick={()=>
addItem(category.id)
}
className="w-full py-2.5 bg-neutral-700 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5"
>

<Icon type="plus" size={14}/>

Ürün Ekle

</button>

</div>

)}

</div>

)

)}

</div>

)}

</div>


{/* ======================================================
SAVE
====================================================== */}

<div
className="sticky bottom-0 bg-neutral-950 border-t border-neutral-800 p-4"
>

<button
onClick={save}
disabled={saving||busy}
className="w-full py-3.5 rounded-xl text-sm font-bold text-white flex items-center justify-center gap-2 disabled:opacity-50"
style={{

backgroundColor:
saved
?
"#12B76A"
:
data.theme.accent,

animation:
saved
?
"popSave .5s ease"
:
saving
?
"none"
:
"pulseGlow 2.2s infinite"

}}
>

{saved?

<Icon type="check" size={17}/>

:

<Icon type="save" size={17}/>

}

{saved
?
"Kaydedildi!"
:
saving
?
"Kaydediliyor..."
:
"Kaydet ve Kapat"}

</button>

</div>

</aside>

</div>

)}

</div>

);

}


/* =========================================================
ADMIN LABEL
========================================================= */

function AdminLabel({children}){

return(

<div
style={{
color:"#737373",
fontSize:"10px",
fontWeight:700,
letterSpacing:".08em",
textTransform:"uppercase",
marginBottom:"6px"
}}
>
{children}
</div>

);

}


/* =========================================================
COLOR INPUT
========================================================= */

function ColorInput({
label,
value,
onChange
}){

return(

<label
className="flex items-center justify-between mb-3"
>

<span className="text-xs text-neutral-400">
{label}
</span>


<input
type="color"
value={value||"#000000"}
onChange={e=>
onChange(e.target.value)
}
className="w-9 h-9 rounded-lg border border-neutral-700 bg-transparent cursor-pointer"
/>

</label>

);

}


/* =========================================================
START
========================================================= */

ReactDOM
.createRoot(
document.getElementById("root")
)
.render(
<App/>
);

</script>

</body>
</html>
