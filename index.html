/* =========================================================
   FİYAT NORMALİZE
========================================================= */

function normalizePrice(price){

if(!price){

return{
contactOnly:true,
amount:null,
parts:[]
};

}

let parts=[];

if(Array.isArray(price.parts)){

parts =
price.parts.map(
p => ({

id:p.id || uid(),

name:
typeof p.name === "string"
?p.name
:"Ürün",

amount:
p.amount === null ||
p.amount === undefined ||
p.amount === ""
?null
:Number(p.amount),

contactOnly:
!!p.contactOnly

})
);

}

if(
parts.length === 0 &&
price.amount !== null &&
price.amount !== undefined &&
price.amount !== ""
){

parts.push({

id:uid(),

name:"Ürün",

amount:Number(
price.amount
),

contactOnly:
!!price.contactOnly

});

}

return{

contactOnly:
!!price.contactOnly &&
parts.length === 0,

amount:
price.amount ?? null,

parts

};

}

/* =========================================================
   IMAGE → BLOB
========================================================= */

function dataUrlToBlob(dataUrl){

const parts =
dataUrl.split(",");

const meta =
parts[0] || "";

const data =
parts[1] || "";

const mimeMatch =
meta.match(
/data:([^;]+)/
);

const mime =
mimeMatch
?mimeMatch[1]
:"image/jpeg";

const binary =
atob(data);

const bytes =
new Uint8Array(
binary.length
);

for(
let i=0;
i<binary.length;
i++
){

bytes[i] =
binary.charCodeAt(i);

}

return new Blob(
[bytes],
{
type:mime
}
);

}


/* =========================================================
   IMAGE RESIZE
========================================================= */

function resizeImg(
file,
maxWidth=1000,
quality=.78
){

return new Promise(
(resolve,reject)=>{

const reader =
new FileReader();

reader.onload =
event => {

const img =
new Image();

img.onload = () => {

let width =
img.width;

let height =
img.height;

if(width > maxWidth){

height =
Math.round(
height *
(maxWidth / width)
);

width =
maxWidth;

}

const canvas =
document.createElement(
"canvas"
);

canvas.width =
width;

canvas.height =
height;

const ctx =
canvas.getContext(
"2d"
);

if(!ctx){

reject(
new Error(
"Canvas oluşturulamadı"
)
);

return;

}

ctx.drawImage(
img,
0,
0,
width,
height
);

resolve(
canvas.toDataURL(
"image/jpeg",
quality
)
);

};

img.onerror =
() =>
reject(
new Error(
"Görsel okunamadı"
)
);

img.src =
event.target.result;

};

reader.onerror =
() =>
reject(
new Error(
"Dosya okunamadı"
)
);

reader.readAsDataURL(file);

});

}

async function uploadBlobToStorage(
blob,
path
){

const result =
await supabase.storage
.from(STORAGE_BUCKET)
.upload(
path,
blob,
{
contentType:"image/jpeg",
cacheControl:"31536000",
upsert:false
}
);

if(result.error){

throw result.error;

}

const publicUrl =
supabase.storage
.from(STORAGE_BUCKET)
.getPublicUrl(path)
?.data
?.publicUrl;

if(!publicUrl){

throw new Error(
"Public URL alınamadı"
);

}

return publicUrl;

}

useEffect(() => {

let cancelled = false;

async function load(){

try{

const result =
await supabase
.from("site_data")
.select("data")
.eq("id",SITE_ID)
.maybeSingle();

if(result.error){

throw result.error;

}

let loaded;

if(
result.data &&
result.data.data
){

loaded =
normalizeData(
result.data.data
);

}
else{

loaded =
defaultData();

const insertResult =
await supabase
.from("site_data")
.upsert({

id:SITE_ID,

data:loaded,

updated_at:
new Date().toISOString()

});

if(insertResult.error){

throw insertResult.error;

}

}

if(cancelled){

return;

}

setData(loaded);

setActiveCat(
loaded.stores
?.premium
?.categories
?.[0]
?.id ||
null
);

setOpenCategories({});


/* =========================================================
   REALTIME
========================================================= */

if(!realtimeChannelRef.current){

const channel =
supabase
.channel(
"site-data-realtime-" +
SITE_ID
)
.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"site_data",
filter:"id=eq." + SITE_ID
},
payload => {

if(
!payload ||
!payload.new ||
!payload.new.data
){

return;

}

const realtimeData =
normalizeData(
payload.new.data
);

setData(
realtimeData
);

setSelectedProduct(
currentProduct => {

if(!currentProduct){

return null;

}

let found = null;

Object.values(
realtimeData.stores || {}
).forEach(
storeData => {

(
storeData.categories || []
).forEach(
category => {

const item =
(
category.items || []
).find(
product =>
product.id ===
currentProduct.id
);

if(item){

found = item;

}

}
);

}
);

return found || null;

}
);

setSaved(false);

}
);

channel.subscribe(
status => {

console.log(
"Supabase Realtime:",
status
);

}
);

realtimeChannelRef.current =
channel;

}

}
catch(error){

console.error(
"VERİ OKUMA HATASI:",
error
);

const fallback =
defaultData();

setData(fallback);

setActiveCat(
fallback
.stores
.premium
.categories
[0]
?.id ||
null
);

setOpenCategories({});

showToast(
"Veritabanı bağlantısı kontrol edilmeli"
);

}
finally{

if(!cancelled){

setLoading(false);

}

}

}

load();

return () => {

cancelled = true;

if(
realtimeChannelRef.current
){

supabase.removeChannel(
realtimeChannelRef.current
);

realtimeChannelRef.current =
null;

}

};

},[]);

/* =========================================================
   DATA UPDATE
========================================================= */

function updateData(callback){

setData(
previous => {

if(!previous){

return previous;

}

const copy = {
...previous
};

callback(copy);

return copy;

}
);

}


/* =========================================================
   PATH UPDATE
========================================================= */

function setPath(
path,
value
){

updateData(
copy => {

let target = copy;

for(
let i=0;
i<path.length-1;
i++
){

const key =
path[i];

target[key] = {
...(target[key] || {})
};

target =
target[key];

}

target[
path[path.length-1]
] = value;

}
);

}


/* =========================================================
   PARA BİRİMİ
========================================================= */

function getCurrency(){

return(
CURRENCIES.find(
item =>
item.id ===
(
data?.currency?.selected ||
"TRY"
)
) ||
CURRENCIES[0]
);

}


/* =========================================================
   FİYAT ÇEVİR
========================================================= */

function convertPrice(amount){

if(
amount === null ||
amount === undefined ||
amount === ""
){

return null;

}

const currency =
data?.currency?.selected ||
"TRY";

const numeric =
Number(amount);

if(
!Number.isFinite(numeric)
){

return null;

}

if(currency === "USD"){

const rate =
Number(
data?.currency?.usdRate
);

if(
!rate ||
rate <= 0
){

return null;

}

return numeric / rate;

}

if(currency === "EUR"){

const rate =
Number(
data?.currency?.eurRate
);

if(
!rate ||
rate <= 0
){

return null;

}

return numeric / rate;

}

return numeric;

}


/* =========================================================
   FİYAT FORMAT
========================================================= */

function formatAmount(amount){

const converted =
convertPrice(amount);

if(converted === null){

return null;

}

const currency =
getCurrency();

const decimals =
currency.id === "TRY"
?0
:2;

const formatted =
converted.toLocaleString(
"tr-TR",
{
minimumFractionDigits:
decimals,

maximumFractionDigits:
decimals
}
);

if(currency.id === "USD"){

return "$" + formatted;

}

if(currency.id === "EUR"){

return "€" + formatted;

}

return formatted + " ₺";

}

/* =========================================================
   KATEGORİ SIRALA
========================================================= */

function moveCategory(
id,
direction
){

updateData(
copy => {

const list = [
...copy.stores[
store
].categories
];

const index =
list.findIndex(
x => x.id === id
);

const target =
index + direction;

if(
index < 0 ||
target < 0 ||
target >= list.length
){

return;

}

[
list[index],
list[target]
] = [
list[target],
list[index]
];

copy.stores[
store
].categories =
list;

}
);

}

async function uploadItemImage(
categoryId,
itemId,
event
){

const file =
event.target.files?.[0];

if(!file){

return;

}

if(
!file.type.startsWith("image/")
){

showToast(
"Lütfen bir görsel seçin."
);

return;

}

setBusy(true);

try{

const compressed =
await resizeImg(
file,
1000,
.76
);

const blob =
dataUrlToBlob(
compressed
);

const path =
storagePath(
"products",
itemId
);

const url =
await uploadBlobToStorage(
blob,
path
);

updateItem(
categoryId,
itemId,
"image",
url
);

showToast(
"Görsel yüklendi. Kaydet'e basın."
);

}
catch(error){

console.error(
"GÖRSEL YÜKLEME HATASI:",
error
);

showToast(
"Görsel yüklenemedi."
);

}
finally{

setBusy(false);

if(event.target){

event.target.value = "";

}

}

}
