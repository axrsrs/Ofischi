function resizeImg(file,maxW=700,q=.78){

  return new Promise((res,rej)=>{

    const r=new FileReader();

    r.onload=e=>{

      const img=new Image();

      img.onload=()=>{

        let w=img.width;
        let h=img.height;

        if(w>maxW){

          h=Math.round(
            h*(maxW/w)
          );

          w=maxW;

        }

        const c=document.createElement("canvas");

        c.width=w;
        c.height=h;

        c.getContext("2d").drawImage(
          img,
          0,
          0,
          w,
          h
        );

        res(
          c.toDataURL(
            "image/jpeg",
            q
          )
        );

      };

      img.onerror=rej;

      img.src=e.target.result;

    };

    r.onerror=rej;

    r.readAsDataURL(file);

  });

}

/* =========================================================
   FİYAT
   ========================================================= */

function formatPrice(
  price,
  currency,
  rates,
  uiLang
){

  if(
    !price ||
    price.contactOnly ||
    price.amount===null ||
    price.amount==="" ||
    price.amount===undefined
  ){

    return CONTACT[uiLang]||CONTACT.tr;

  }

  let amt=Number(price.amount);

  if(currency==="usd"){
    amt/=rates.usd||1;
  }

  if(currency==="eur"){
    amt/=rates.eur||1;
  }

  const curr=
    CURR.find(c=>c.c===currency)
    ||CURR[0];

  const decimals=
    currency==="try"?0:2;

  return curr.s+
    amt.toLocaleString(
      "tr-TR",
      {
        minimumFractionDigits:decimals,
        maximumFractionDigits:decimals
      }
    );

}

        p.categories.map(c=>{

          if(c.id!==catId){
            return c;
          }

          const i=
            c.items.findIndex(
              x=>x.id===id
            );

          const j=i+dir;

          if(
            j<0||
            j>=c.items.length
          ){
            return c;
          }

          const arr=[
            ...c.items
          ];

          [
            arr[i],
            arr[j]
          ]=[
            arr[j],
            arr[i]
          ];

          return{
            ...c,
            items:arr
          };

        })

    }));

                  <Color
                    label="Yazı rengi"
                    value={data.theme.text}
                    onChange={v=>
                      set(
                        ["theme","text"],
                        v
                      )
                    }
                  />

                  {/* ARKA PLAN GÖRSELİ */}

                  <div className="flex gap-2 mt-2 mb-4">

                    <button
                      onClick={()=>
                        bgRef.current.click()
                      }
                      className="flex-1 flex items-center justify-center gap-1 bg-neutral-900 border border-neutral-700 rounded-lg py-2 text-xs"
                    >

                      <Icon
                        name="upload"
                        size={13}
                      />

                      Arka Plan Görseli

                    </button>

                    <input
                      type="file"
                      accept="image/*"
                      ref={bgRef}
                      className="hidden"
                      onChange={upBg}
                    />

                    {data.theme.bgImage&&(

                      <button
                        onClick={()=>
                          set(
                            ["theme","bgImage"],
                            null
                          )
                        }
                        className="px-3 bg-neutral-900 border border-neutral-700 rounded-lg"
                      >
                        <Icon
                          name="trash"
                          size={14}
                        />
                      </button>

                    )}

                  </div>

                  {/* ÜRÜN GÖRSEL BOYUTU */}

                  <label className="block mb-3">

                    <Lbl>
                      Ürün görsel boyutu — {data.cardImgSize}px
                    </Lbl>

                    <input
                      type="range"
                      min="90"
                      max="260"
                      value={data.cardImgSize}
                      onChange={e=>
                        set(
                          ["cardImgSize"],
                          +e.target.value
                        )
                      }
                      className="w-full"
                    />

                  </label>

                  {/* PIN */}

                  <label className="block mb-3">

                    <Lbl>
                      Yönetim PIN
                    </Lbl>

                    <input
                      value={data.pin||""}
                      inputMode="numeric"
                      maxLength="8"
                      onChange={e=>
                        set(
                          ["pin"],
                          e.target.value.replace(/\D/g,"")
                        )
                      }
                      className="w-full bg-neutral-900 border border-neutral-700 rounded-lg px-3 py-2 text-sm outline-none tracking-widest"
                    />

                  </label>

                  {/* RESET */}

                  <button
                    onClick={()=>{

                      if(
                        confirm(
                          "Varsayılana dönülsün mü?"
                        )
                      ){

                        const d=defData();

                        setData(d);

                        setActiveCat(
                          d.categories[0].id
                        );

                      }

                    }}
                    className="w-full flex items-center justify-center gap-1.5 py-2 rounded-lg text-xs bg-neutral-900 border border-neutral-700 text-neutral-400"
                  >

                    <Icon
                      name="reset"
                      size={13}
                    />

                    Varsayılana Sıfırla

                  </button>

                </div>

              )}

              {/* =================================================
                  ÜRÜN KATALOĞU
              ================================================= */}

              {tab==="icerik"&&(

                <div>

                  <button
                    onClick={addCat}
                    className="w-full flex items-center justify-center gap-1.5 mb-3 py-2.5 rounded-lg text-sm font-semibold text-white"
                    style={{
                      backgroundColor:data.theme.accent
                    }}
                  >

                    <Icon
                      name="plus"
                      size={16}
                    />

                    Yeni Kategori

                  </button>

                  {data.categories.map(
                    (c,ci)=>(

                      <div
                        key={c.id}
                        className="mb-3 bg-neutral-900 rounded-xl border border-neutral-800"
                      >

                        <div className="flex items-center gap-1.5 p-2">

                          <div className="flex-1">

                            <input
                              value={
                                c.name[editLang]||""
                              }
                              onChange={e=>
                                renameCat(
                                  c.id,
                                  e.target.value
                                )
                              }
                              className="w-full bg-neutral-800 rounded-lg px-2.5 py-1.5 text-sm outline-none"
                            />

                          </div>

                          <button
                            onClick={()=>
                              moveCat(
                                c.id,
                                -1
                              )
                            }
                            disabled={ci===0}
                            className="p-1.5 bg-neutral-800 rounded-lg disabled:opacity-30"
                          >
                            <Icon
                              name="up"
                              size={14}
                            />
                          </button>

                          <button
                            onClick={()=>
                              moveCat(
                                c.id,
                                1
                              )
                            }
                            disabled={
                              ci===
                              data.categories.length-1
                            }
                            className="p-1.5 bg-neutral-800 rounded-lg disabled:opacity-30"
                          >
                            <Icon
                              name="down"
                              size={14}
                            />
                          </button>

                          <button
                            onClick={()=>
                              delCat(c.id)
                            }
                            className="p-1.5 bg-red-950 rounded-lg text-red-400"
                          >
                            <Icon
                              name="trash"
                              size={14}
                            />
                          </button>

                          <button
                            onClick={()=>
                              setOpenCat(
                                openCat===c.id
                                ?null
                                :c.id
                              )
                            }
                            className="p-1.5 bg-neutral-800 rounded-lg text-[11px] px-2 font-medium"
                          >
                            {
                              openCat===c.id
                              ?"Kapat"
                              :"Ürünler"
                            }
                          </button>

                        </div>

                        {openCat===c.id&&(

                          <div className="p-2 pt-0 space-y-2">

                            {c.items.map(
                              (it,ii)=>(

                                <div
                                  key={it.id}
                                  className="bg-neutral-800 rounded-lg p-2.5"
                                >

                                  <div className="flex gap-2 mb-2">

                                    <div
                                      onClick={()=>
                                        itemRefs.current[it.id]?.click()
                                      }
                                      className="w-14 h-14 rounded-md bg-neutral-700 flex items-center justify-center overflow-hidden cursor-pointer flex-shrink-0"
                                      style={{
                                        backgroundImage:
                                          it.image
                                          ?`url(${it.image})`
                                          :undefined,

                                        backgroundSize:"cover",

                                        backgroundPosition:"center"
                                      }}
                                    >

                                      {!it.image&&(

                                        <Icon
                                          name="image"
                                          size={16}
                                          className="opacity-40"
                                        />

                                      )}

                                    </div>

                                    <input
                                      type="file"
                                      accept="image/*"
                                      className="hidden"
                                      ref={el=>
                                        itemRefs.current[it.id]=el
                                      }
                                      onChange={e=>
                                        upItemImg(
                                          c.id,
                                          it.id,
                                          e
                                        )
                                      }
                                    />

                                    <div className="flex-1 space-y-1.5">

                                      <input
                                        value={
                                          it.name[editLang]||""
                                        }
                                        onChange={e=>
                                          updItem(
                                            c.id,
                                            it.id,
                                            "name",
                                            e.target.value
                                          )
                                        }
                                        placeholder={
                                          "Ürün adı ("+
                                          editLang.toUpperCase()+
                                          ")"
                                        }
                                        className="w-full bg-neutral-900 rounded-md px-2 py-1.5 text-xs outline-none"
                                      />

                                      <input
                                        value={
                                          it.dims||""
                                        }
                                        onChange={e=>
                                          updItem(
                                            c.id,
                                            it.id,
                                            "dims",
                                            e.target.value
                                          )
                                        }
                                        placeholder="Ölçüler (örn: 200x90x75 cm)"
                                        className="w-full bg-neutral-900 rounded-md px-2 py-1.5 text-xs outline-none"
                                      />

                                    </div>

                                  </div>

                                  <input
                                    value={
                                      it.desc[editLang]||""
                                    }
                                    onChange={e=>
                                      updItem(
                                        c.id,
                                        it.id,
                                        "desc",
                                        e.target.value
                                      )
                                    }
                                    placeholder={
                                      "Özellikler ("+
                                      editLang.toUpperCase()+
                                      ")"
                                    }
                                    className="w-full bg-neutral-900 rounded-md px-2 py-1.5 text-xs outline-none mb-2"
                                  />

                                  <div className="flex items-center gap-2 mb-2">

                                    <input
                                      type="number"
                                      disabled={
                                        it.price.contactOnly
                                      }
                                      value={
                                        it.price.amount??""
                                      }
                                      onChange={e=>
                                        updPrice(
                                          c.id,
                                          it.id,
                                          {
                                            amount:
                                              e.target.value===""
                                              ?null
                                              :Number(
                                                e.target.value
                                              )
                                          }
                                        )
                                      }
                                      placeholder="Fiyat (TL)"
                                      className="flex-1 bg-neutral-900 rounded-md px-2 py-1.5 text-xs outline-none disabled:opacity-40"
                                    />

                                    <label className="flex items-center gap-1 text-[10px] text-neutral-400 whitespace-nowrap">

                                      <input
                                        type="checkbox"
                                        checked={
                                          !!it.price.contactOnly
                                        }
                                        onChange={e=>
                                          updPrice(
                                            c.id,
                                            it.id,
                                            {
                                              contactOnly:
                                                e.target.checked
                                            }
                                          )
                                        }
                                      />

                                      İletişime geçin

                                    </label>

                                  </div>

                                  <div className="flex gap-1 justify-end">

                                    {it.image&&(

                                      <button
                                        onClick={()=>
                                          updItem(
                                            c.id,
                                            it.id,
                                            "image",
                                            null
                                          )
                                        }
                                        className="text-[10px] px-2 py-1 bg-neutral-700 rounded"
                                      >
                                        Görseli Sil
                                      </button>

                                    )}

                                    <button
                                      onClick={()=>
                                        moveItem(
                                          c.id,
                                          it.id,
                                          -1
                                        )
                                      }
                                      disabled={ii===0}
                                      className="p-1 bg-neutral-700 rounded disabled:opacity-30"
                                    >
                                      <Icon
                                        name="up"
                                        size={12}
                                      />
                                    </button>

                                    <button
                                      onClick={()=>
                                        moveItem(
                                          c.id,
                                          it.id,
                                          1
                                        )
                                      }
                                      disabled={
                                        ii===
                                        c.items.length-1
                                      }
                                      className="p-1 bg-neutral-700 rounded disabled:opacity-30"
                                    >
                                      <Icon
                                        name="down"
                                        size={12}
                                      />
                                    </button>

                                    <button
                                      onClick={()=>
                                        delItem(
                                          c.id,
                                          it.id
                                        )
                                      }
                                      className="p-1 bg-red-950 rounded text-red-400"
                                    >
                                      <Icon
                                        name="trash"
                                        size={12}
                                      />
                                    </button>

                                  </div>

                                </div>

                              )
                            )}

                            <button
                              onClick={()=>
                                addItem(c.id)
                              }
                              className="w-full flex items-center justify-center gap-1.5 py-2 rounded-lg text-xs font-medium bg-neutral-700"
                            >

                              <Icon
                                name="plus"
                                size={13}
                              />

                              Ürün Ekle

                            </button>

                          </div>

                        )}

                      </div>

                    )
                  )}

                </div>

              )}

            </div>

            {/* =================================================
                KAYDET
            ================================================= */}

            <div className="sticky bottom-0 bg-neutral-950 border-t border-neutral-800 p-4">

              <button
                onClick={save}
                disabled={saving}
                className="w-full flex items-center justify-center gap-2 py-3 rounded-xl text-sm font-bold text-white"
                style={{
                  backgroundColor:
                    saved
                    ?" #12B76A"
                    :data.theme.accent,

                  animation:
                    saved
                    ?"popSave .5s ease"
                    :
                    saving
                    ?undefined
                    :"pulseGlow 2.2s ease-in-out infinite"
                }}
              >

                {saved

                  ?

                  <Icon
                    name="check"
                    size={17}
                  />

                  :

                  <Icon
                    name="save"
                    size={16}
                  />

                }

                {
                  saved
                  ?"Kaydedildi!"
                  :
                  saving
                  ?"Kaydediliyor…"
                  :
                  "Kaydet ve Kapat"
                }

              </button>

            </div>

          </div>

        </div>

      )}

    </div>

  );

}

/* =========================================================
   BAŞLAT
   ========================================================= */

ReactDOM
  .createRoot(
    document.getElementById("root")
  )
  .render(
    <App/>
  );

</script>

</body>
</html>
