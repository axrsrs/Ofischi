<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body,#root{
  margin:0;
  min-height:100%;
  width:100%;
}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f3f4f6;
  color:#111827;
}

button,input,textarea,select{
  font:inherit;
}

button{
  -webkit-user-select:none;
  user-select:none;
}

img{
  max-width:100%;
}

::-webkit-scrollbar{
  width:7px;
  height:7px;
}

::-webkit-scrollbar-thumb{
  background:rgba(100,116,139,.35);
  border-radius:20px;
}

::-webkit-scrollbar-track{
  background:transparent;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes scaleIn{
  from{
    opacity:0;
    transform:scale(.96);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

@keyframes slideInRight{
  from{
    opacity:0;
    transform:translateX(30px);
  }
  to{
    opacity:1;
    transform:translateX(0);
  }
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.animate-fade{
  animation:fadeIn .2s ease-out;
}

.animate-up{
  animation:fadeUp .28s ease-out both;
}

.animate-scale{
  animation:scaleIn .2s ease-out both;
}

.animate-slide{
  animation:slideInRight .28s ease-out both;
}

.spinner{
  width:18px;
  height:18px;
  border:2px solid currentColor;
  border-right-color:transparent;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

/* =========================
   PREMIUM EFFECTS
========================= */

.glass{
  background:rgba(255,255,255,.76);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.card-hover{
  transition:
    transform .22s ease,
    box-shadow .22s ease,
    border-color .22s ease;
}

.card-hover:hover{
  transform:translateY(-3px);
  box-shadow:0 18px 40px rgba(15,23,42,.12);
}

.btn{
  transition:
    transform .16s ease,
    box-shadow .16s ease,
    opacity .16s ease;
}

.btn:active{
  transform:scale(.97);
}

.soft-shadow{
  box-shadow:0 12px 35px rgba(15,23,42,.08);
}

.modal-bg{
  background:rgba(2,6,23,.58);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
}

/* =========================
   MOBILE
========================= */

@media(max-width:640px){
  ::-webkit-scrollbar{
    width:3px;
  }
}
</style>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const {
  useState,
  useEffect,
  useMemo,
  useRef,
  useCallback
} = React;

const SUPABASE_URL =
  "https://irudfkepeocdcmocyvpi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_RS0kurqUR1cEE-lHBAdZDA_SRgH-m5X";

const SITE_ID = 1;
const STORAGE_BUCKET = "catalog-images";

const supabase =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:false,
        autoRefreshToken:false
      }
    }
  );

/* =========================================================
   HELPERS
========================================================= */

const cloneData = data =>
  JSON.parse(JSON.stringify(data));

const uid = () =>
  Math.random().toString(36).slice(2) +
  Date.now().toString(36);

const emptyProduct = () => ({
  id:uid(),
  name:"Yeni Ürün",
  dimensions:"",
  description:"",
  image:"",
  priceParts:[],
  manualTotal:"",
  manualTotalEnabled:false
});

const emptyCategory = name => ({
  id:uid(),
  name,
  products:[]
});

const defaultData = () => ({
  pin:"1234",

  currency:"TRY",

  rates:{
    USD:40,
    EUR:45
  },

  theme:{
    name:"Grafit",
    primary:"#111827",
    secondary:"#374151",
    accent:"#d4a017",
    background:"#f3f4f6",
    backgroundImage:"",
    logo:"",
    logoWidth:180,
    logoTop:20,
    logoLeft:20,
    productImageHeight:240
  },

  stores:{
    Premium:{
      categories:[
        emptyCategory("VIP Makam Takımları"),
        emptyCategory("Makam Takımları"),
        emptyCategory("Personel Takımları"),
        emptyCategory("Toplantı Masaları"),
        emptyCategory("Workstation"),
        emptyCategory("Loby Koltukları"),
        emptyCategory("Ofis Koltukları"),
        emptyCategory("Fileli Koltuklar"),
        emptyCategory("Aksesuarlar")
      ]
    },

    Outlet:{
      categories:[
        emptyCategory("VIP Makam Takımları"),
        emptyCategory("Makam Takımları"),
        emptyCategory("Personel Takımları"),
        emptyCategory("Toplantı Masaları"),
        emptyCategory("Workstation"),
        emptyCategory("Loby Koltukları"),
        emptyCategory("Ofis Koltukları"),
        emptyCategory("Fileli Koltuklar"),
        emptyCategory("Aksesuarlar")
      ]
    }
  }
});

const THEME_LIST = [
  {
    name:"Grafit",
    primary:"#111827",
    secondary:"#374151",
    accent:"#d4a017",
    background:"#f3f4f6"
  },
  {
    name:"Ceviz",
    primary:"#3f2b20",
    secondary:"#6b4b38",
    accent:"#d5a85a",
    background:"#f4efe9"
  },
  {
    name:"Lacivert",
    primary:"#0f2747",
    secondary:"#193b67",
    accent:"#d4af37",
    background:"#eef3f9"
  },
  {
    name:"Antrasit Altın",
    primary:"#202124",
    secondary:"#35363a",
    accent:"#c9a227",
    background:"#f1f1f1"
  },
  {
    name:"Beton Gri",
    primary:"#4b5563",
    secondary:"#6b7280",
    accent:"#b08d57",
    background:"#e5e7eb"
  }
];

/* =========================================================
   APP
========================================================= */

function App(){

  const [data,setData] =
    useState(defaultData());

  const [loading,setLoading] =
    useState(true);

  const [saving,setSaving] =
    useState(false);

  const [saved,setSaved] =
    useState(false);

  const [store,setStore] =
    useState("Premium");

  const [activeCategory,setActiveCategory] =
    useState(null);

  const [selectedProduct,setSelectedProduct] =
    useState(null);

  const [fullscreenImage,setFullscreenImage] =
    useState("");

  const [panelOpen,setPanelOpen] =
    useState(false);

  const [pinOpen,setPinOpen] =
    useState(false);

  const [pin,setPin] =
    useState("");

  const [pinError,setPinError] =
    useState("");

  /*
    DRAFT SYSTEM

    data      = kaydedilmiş / public veri
    draftData = sadece admin panelindeki taslak
  */

  const [draftData,setDraftData] =
    useState(null);

  const [discardModal,setDiscardModal] =
    useState(false);

  const dataRef =
    useRef(data);

  const draftDataRef =
    useRef(null);

  const draftDirtyRef =
    useRef(false);

  const savingRef =
    useRef(false);

  const selectedProductIdRef =
    useRef(null);

  const lastSavedJsonRef =
    useRef("");

  const activeCategoryRef =
    useRef(activeCategory);

  const storeRef =
    useRef(store);

  useEffect(()=>{
    dataRef.current=data;
  },[data]);

  useEffect(()=>{
    draftDataRef.current=draftData;
  },[draftData]);

  useEffect(()=>{
    activeCategoryRef.current=activeCategory;
  },[activeCategory]);

  useEffect(()=>{
    storeRef.current=store;
  },[store]);

  /* =========================================================
     LOAD
  ========================================================= */

  const loadData = useCallback(async()=>{

    setLoading(true);

    try{

      const {data:row,error} =
        await supabase
          .from("site_data")
          .select("data")
          .eq("id",SITE_ID)
          .maybeSingle();

      if(error){
        console.error(error);
        return;
      }

      let loaded =
        row?.data || defaultData();

      /*
        Eski / eksik verileri güvenli şekilde tamamla.
      */

      const base=defaultData();

      loaded={
        ...base,
        ...loaded,

        rates:{
          ...base.rates,
          ...(loaded.rates||{})
        },

        theme:{
          ...base.theme,
          ...(loaded.theme||{})
        },

        stores:{
          ...base.stores,
          ...(loaded.stores||{})
        }
      };

      if(!loaded.stores.Premium){
        loaded.stores.Premium=base.stores.Premium;
      }

      if(!loaded.stores.Outlet){
        loaded.stores.Outlet=base.stores.Outlet;
      }

      setData(loaded);
      dataRef.current=loaded;

      lastSavedJsonRef.current =
        JSON.stringify(loaded);

      const firstCategory =
        loaded.stores?.Premium?.categories?.[0];

      if(firstCategory){
        setActiveCategory(firstCategory.id);
        activeCategoryRef.current=firstCategory.id;
      }

    }catch(err){

      console.error(err);

    }finally{

      setLoading(false);

    }

  },[]);

  useEffect(()=>{
    loadData();
  },[loadData]);

  /* =========================================================
     REALTIME
  ========================================================= */

  useEffect(()=>{

    const channel =
      supabase
        .channel("site-data-realtime")
        .on(
          "postgres_changes",
          {
            event:"UPDATE",
            schema:"public",
            table:"site_data",
            filter:`id=eq.${SITE_ID}`
          },
          payload=>{

            const incoming =
              payload.new?.data;

            if(!incoming) return;

            const incomingJson =
              JSON.stringify(incoming);

            if(
              incomingJson ===
              lastSavedJsonRef.current
            ){
              return;
            }

            /*
              Public data her zaman güncellenir.
            */

            dataRef.current=incoming;
            setData(incoming);

            /*
              Admin panelinde değişiklik yapılmıyorsa
              taslağı da güncelle.
            */

            if(
              panelOpen &&
              !draftDirtyRef.current
            ){

              const fresh =
                cloneData(incoming);

              draftDataRef.current=fresh;
              setDraftData(fresh);

            }

            /*
              Eğer kullanıcı panelde değişiklik yapıyorsa
              kendi taslağına dokunmuyoruz.
            */

            setSaved(false);

          }
        )
        .subscribe();

    return ()=>{

      supabase.removeChannel(channel);

    };

  },[panelOpen]);

  /* =========================================================
     CURRENCY
  ========================================================= */

  const getCurrency =
    useCallback((source=data)=>
      source.currency || "TRY"
    ,[data]);

  const convertPrice =
    useCallback((amount,source=data)=>{

      const n =
        Number(amount);

      if(!Number.isFinite(n)) return 0;

      const currency =
        source.currency || "TRY";

      if(currency==="TRY")
        return n;

      if(currency==="USD")
        return n / Number(source.rates?.USD || 1);

      if(currency==="EUR")
        return n / Number(source.rates?.EUR || 1);

      return n;

    },[]);

  const formatAmount =
    useCallback((amount,source=data)=>{

      const currency =
        source.currency || "TRY";

      const converted =
        convertPrice(amount,source);

      const symbol =
        currency==="TRY"
          ? "₺"
          : currency==="USD"
            ? "$"
            : "€";

      return (
        new Intl.NumberFormat(
          "tr-TR",
          {
            minimumFractionDigits:0,
            maximumFractionDigits:2
          }
        ).format(converted)
        +" "
        +symbol
      );

    },[convertPrice]);

  const priceText =
    useCallback((part,source=data)=>{

      if(!part) return "";

      if(part.contact)
        return "Fiyat için iletişime geçin";

      if(
        part.price === "" ||
        part.price === null ||
        part.price === undefined
      ){
        return "";
      }

      return formatAmount(part.price,source);

    },[formatAmount]);

  const productTotal =
    useCallback((product,source=data)=>{

      if(!product) return null;

      /*
        Manuel toplam açıksa manuel fiyat.
      */

      if(
        product.manualTotalEnabled
      ){

        if(
          product.manualTotal === "" ||
          product.manualTotal === null ||
          product.manualTotal === undefined
        ){
          return null;
        }

        return Number(product.manualTotal) || 0;
      }

      /*
        Otomatik toplam açıksa bütün parçaları topla.
      */

      const parts =
        Array.isArray(product.priceParts)
          ? product.priceParts
          : [];

      let total=0;
      let hasPrice=false;

      for(const part of parts){

        if(
          part &&
          !part.contact &&
          part.price !== "" &&
          part.price !== null &&
          part.price !== undefined
        ){

          const n=Number(part.price);

          if(Number.isFinite(n)){
            total+=n;
            hasPrice=true;
          }
        }
      }

      return hasPrice ? total : null;

    },[]);

  const productTotalText =
    useCallback((product,source=data)=>{

      const total =
        productTotal(product,source);

      if(total===null) return "";

      return formatAmount(total,source);

    },[productTotal,formatAmount]);

  /* =========================================================
     CATEGORIES
  ========================================================= */

  const categories =
    useMemo(()=>{

      return (
        data.stores?.[store]?.categories || []
      );

    },[data,store]);

  const currentCategory =
    useMemo(()=>{

      return categories.find(
        c=>c.id===activeCategory
      ) || categories[0] || null;

    },[categories,activeCategory]);

  const products =
    currentCategory?.products || [];

  /* =========================================================
     STORE
  ========================================================= */

  const changeStore = useCallback(nextStore=>{

    setStore(nextStore);

    storeRef.current=nextStore;

    const source =
      panelOpen && draftDataRef.current
        ? draftDataRef.current
        : dataRef.current;

    const nextCategories =
      source.stores?.[nextStore]?.categories || [];

    const nextCategory =
      nextCategories[0];

    if(nextCategory){

      setActiveCategory(nextCategory.id);
      activeCategoryRef.current =
        nextCategory.id;

    }else{

      setActiveCategory(null);
      activeCategoryRef.current=null;

    }

  },[panelOpen]);

  /* =========================================================
     DRAFT UPDATE
  ========================================================= */

  const updateDraftData =
    useCallback(callback=>{

      setDraftData(previous=>{

        if(!previous) return previous;

        const copy =
          cloneData(previous);

        callback(copy);

        draftDirtyRef.current=true;

        draftDataRef.current=copy;

        return copy;

      });

      setSaved(false);

    },[]);

  /* =========================================================
     DRAFT PATH
  ========================================================= */

  const setDraftPath =
    useCallback((path,value)=>{

      updateDraftData(copy=>{

        let target=copy;

        for(let i=0;i<path.length-1;i++){

          const key=path[i];

          target[key]={
            ...(target[key]||{})
          };

          target=target[key];

        }

        target[
          path[path.length-1]
        ]=value;

      });

    },[updateDraftData]);

  /* =========================================================
     ADMIN OPEN
  ========================================================= */

  const openAdmin = ()=>{

    setPin("");
    setPinError("");
    setPinOpen(true);

  };

  const confirmPin = ()=>{

    if(
      pin ===
      String(dataRef.current.pin || "1234")
    ){

      const fresh =
        cloneData(dataRef.current);

      draftDataRef.current=fresh;

      draftDirtyRef.current=false;

      setDraftData(fresh);

      setPinOpen(false);
      setPanelOpen(true);

      setSaved(false);

    }else{

      setPinError("PIN yanlış.");

    }

  };

  /* =========================================================
     CLOSE ADMIN
  ========================================================= */

  const closePanelImmediately = ()=>{

    if(savingRef.current)
      return;

    draftDirtyRef.current=false;

    draftDataRef.current=null;

    setDraftData(null);

    setDiscardModal(false);

    setPanelOpen(false);

  };

  const requestClosePanel = ()=>{

    if(savingRef.current)
      return;

    /*
      Hiç değişiklik yoksa direkt kapanır.
    */

    if(!draftDirtyRef.current){

      closePanelImmediately();
      return;

    }

    /*
      Değişiklik varsa onay modalı.
    */

    setDiscardModal(true);

  };

  /* =========================================================
     SAVE DRAFT
  ========================================================= */

  const saveDraft =
    useCallback(async(closeAfter=true)=>{

      if(savingRef.current)
        return false;

      const current =
        draftDataRef.current;

      if(!current)
        return false;

      savingRef.current=true;
      setSaving(true);
      setSaved(false);

      try{

        const clean =
          cloneData(current);

        const cleanJson =
          JSON.stringify(clean);

        const {error} =
          await supabase
            .from("site_data")
            .upsert(
              {
                id:SITE_ID,
                data:clean
              },
              {
                onConflict:"id"
              }
            );

        if(error)
          throw error;

        /*
          Artık bu veri public / committed veri.
        */

        lastSavedJsonRef.current =
          cleanJson;

        dataRef.current=clean;
        setData(clean);

        draftDirtyRef.current=false;

        if(closeAfter){

          draftDataRef.current=null;
          setDraftData(null);
          setPanelOpen(false);

        }else{

          const fresh =
            cloneData(clean);

          draftDataRef.current=fresh;
          setDraftData(fresh);

        }

        setDiscardModal(false);
        setSaved(true);

        setTimeout(()=>{
          setSaved(false);
        },1800);

        return true;

      }catch(err){

        console.error(err);

        alert(
          "Kaydetme sırasında hata oluştu.\n\n"+
          (err?.message || err)
        );

        return false;

      }finally{

        savingRef.current=false;
        setSaving(false);

      }

    },[]);

  /* =========================================================
     ADMIN CATEGORY HELPERS
  ========================================================= */

  const adminCategories =
    draftData?.stores?.[store]?.categories || [];

  const adminCurrentCategory =
    adminCategories.find(
      c=>c.id===activeCategory
    ) ||
    adminCategories[0] ||
    null;

  const adminProducts =
    adminCurrentCategory?.products || [];

  const addCategory = ()=>{

    const name =
      prompt("Kategori adı:");

    if(!name?.trim())
      return;

    const category =
      emptyCategory(name.trim());

    updateDraftData(copy=>{

      if(
        !copy.stores?.[store]
      ){
        copy.stores[store]={
          categories:[]
        };
      }

      if(
        !Array.isArray(
          copy.stores[store].categories
        )
      ){
        copy.stores[store].categories=[];
      }

      copy.stores[store].categories.push(category);

    });

    setActiveCategory(category.id);

  };

  const renameCategory = category=>{

    const name =
      prompt(
        "Yeni kategori adı:",
        category.name
      );

    if(!name?.trim())
      return;

    updateDraftData(copy=>{

      const list =
        copy.stores[store].categories;

      const target =
        list.find(
          c=>c.id===category.id
        );

      if(target)
        target.name=name.trim();

    });

  };

  const deleteCategory = category=>{

    if(
      !confirm(
        `"${category.name}" kategorisi silinsin mi?`
      )
    )
      return;

    updateDraftData(copy=>{

      const list =
        copy.stores[store].categories;

      copy.stores[store].categories =
        list.filter(
          c=>c.id!==category.id
        );

    });

    const remaining =
      adminCategories.filter(
        c=>c.id!==category.id
      );

    setActiveCategory(
      remaining[0]?.id || null
    );

  };

  const moveCategory = (category,direction)=>{

    updateDraftData(copy=>{

      const list =
        copy.stores[store].categories;

      const index =
        list.findIndex(
          c=>c.id===category.id
        );

      const next=index+direction;

      if(
        index<0 ||
        next<0 ||
        next>=list.length
      )
        return;

      [
        list[index],
        list[next]
      ]=[
        list[next],
        list[index]
      ];

    });

  };

  /* =========================================================
     PRODUCT HELPERS
  ========================================================= */

  const addProduct = ()=>{

    if(!adminCurrentCategory)
      return;

    const product =
      emptyProduct();

    updateDraftData(copy=>{

      const category =
        copy.stores[store].categories.find(
          c=>c.id===adminCurrentCategory.id
        );

      if(!category) return;

      if(!Array.isArray(category.products))
        category.products=[];

      category.products.push(product);

    });

  };

  const updateProduct =
    (productId,callback)=>{

      updateDraftData(copy=>{

        const category =
          copy.stores[store].categories.find(
            c=>c.id===adminCurrentCategory?.id
          );

        if(!category) return;

        const product =
          category.products?.find(
            p=>p.id===productId
          );

        if(!product) return;

        callback(product);

      });

    };

  const deleteProduct = productId=>{

    if(
      !confirm("Bu ürün silinsin mi?")
    )
      return;

    updateDraftData(copy=>{

      const category =
        copy.stores[store].categories.find(
          c=>c.id===adminCurrentCategory?.id
        );

      if(!category) return;

      category.products =
        (category.products||[])
          .filter(
            p=>p.id!==productId
          );

    });

  };

  const moveProduct =
    (productId,direction)=>{

      updateDraftData(copy=>{

        const category =
          copy.stores[store].categories.find(
            c=>c.id===adminCurrentCategory?.id
          );

        if(!category) return;

        const list =
          category.products || [];

        const index =
          list.findIndex(
            p=>p.id===productId
          );

        const next =
          index+direction;

        if(
          index<0 ||
          next<0 ||
          next>=list.length
        )
          return;

        [
          list[index],
          list[next]
        ]=[
          list[next],
          list[index]
        ];

      });

    };

  /* =========================================================
     PRICE PARTS
  ========================================================= */

  const addPricePart =
    productId=>{

      updateProduct(
        productId,
        product=>{

          if(!Array.isArray(product.priceParts))
            product.priceParts=[];

            );

  ========================================================= */

  const compressImage =
    file=>{

      return new Promise(
        (resolve,reject)=>{

          const reader =
            new FileReader();

          reader.onload=e=>{

            const img =
              new Image();

            img.onload=()=>{

              const maxWidth=1800;

              let width=img.width;
              let height=img.height;

              if(width>maxWidth){

                height =
                  height*
                  maxWidth/
                  width;

                width=maxWidth;

              }

              const canvas =
                document.createElement("canvas");

              canvas.width=width;
              canvas.height=height;

              const ctx =
                canvas.getContext("2d");

              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );

              canvas.toBlob(
                blob=>{

                  if(!blob){

                    reject(
                      new Error(
                        "Görsel sıkıştırılamadı."
                      )
                    );

                    return;

                  }

                  resolve(blob);

                },
                "image/webp",
                .82
              );

            };

            img.onerror=reject;

            img.src=e.target.result;

          };

          reader.onerror=reject;

          reader.readAsDataURL(file);

        }
      );

    };

    async(file,folder)=>{

        return "";

      const blob =
        await compressImage(file);

      const path =
        `${folder}/${Date.now()}-${Math.random()
          .toString(36)
          .slice(2)}.webp`;

      const {error} =
        await supabase.storage
          .from(STORAGE_BUCKET)
          .upload(
            path,
            blob,
            {
              contentType:"image/webp",
              upsert:false
            }
          );

      if(error)
        throw error;

      const {data:urlData} =
        supabase.storage
          .from(STORAGE_BUCKET)
          .getPublicUrl(path);

      return urlData.publicUrl;

    };

                              (
                                !product.manualTotalEnabled
                                  ? "bg-slate-900 text-white"
                                  : "bg-white border border-slate-200"
                              )
                            }
                          >
                            Otomatik Toplam
                          </button>

                          <button
                            onClick={()=>
                              updateProduct(
                                product.id,
                                p=>{
                                  p.manualTotalEnabled=true;
                                }
                              )
                            }
                            className={
                              "btn flex-1 py-2 rounded-lg text-sm font-bold " +
                              (
                                product.manualTotalEnabled
                                  ? "bg-slate-900 text-white"
                                  : "bg-white border border-slate-200"
                              )
                            }
                          >
                            Manuel Toplam
                          </button>

                        </div>

                        {product.manualTotalEnabled ? (

                          <div className="mt-3">

                            <label className="text-xs font-semibold text-slate-500">
                              Toplam fiyat
                            </label>

                            <input
                              type="number"
                              value={
                                product.manualTotal ?? ""
                              }
                              onChange={e=>
                                updateProduct(
                                  product.id,
                                  p=>{
                                    p.manualTotal=
                                      e.target.value;
                                  }
                                )
                              }
                              className="mt-1 w-full px-3 py-2 rounded-lg border border-slate-300"
                              placeholder="Örn. 25000"
                            />

                          </div>

                        ) : (

                          <div className="mt-3">

                            <div className="flex items-center justify-between mb-2">

                              <div className="text-sm font-bold">
                                Parçalar
                              </div>

                              <button
                                onClick={()=>
                                  addPricePart(
                                    product.id
                                  )
                                }
                                className="btn px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-xs font-bold"
                              >
                                + Parça
                              </button>

                            </div>

                            <div className="space-y-2">

                              {(product.priceParts||[])
                                .map(part=>(

                                  <div
                                    key={part.id}
                                    className="bg-white rounded-xl border border-slate-200 p-2"
                                  >

                                    <input
                                      value={part.name || ""}
                                      onChange={e=>
                                        updatePricePart(
                                          product.id,
                                          part.id,
                                          "name",
                                          e.target.value
                                        )
                                      }
                                      className="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm font-semibold"
                                      placeholder="Parça adı"
                                    />

                                    <div className="flex gap-2 mt-2">

                                      <input
                                        type="number"
                                        value={
                                          part.price ?? ""
                                        }
                                        disabled={!!part.contact}
                                        onChange={e=>
                                          updatePricePart(
                                            product.id,
                                            part.id,
                                            "price",
                                            e.target.value
                                          )
                                        }
                                        className="flex-1 px-3 py-2 rounded-lg border border-slate-300 text-sm disabled:bg-slate-100"
                                        placeholder="Fiyat"
                                      />

                                      <button
                                        onClick={()=>
                                          updatePricePart(
                                            product.id,
                                            part.id,
                                            "contact",
                                            !part.contact
                                          )
                                        }
                                        className={
                                          "px-3 rounded-lg text-xs font-bold " +
                                          (
                                            part.contact
                                              ? "bg-amber-100 text-amber-800"
                                              : "bg-slate-100"
                                          )
                                        }
                                      >
                                        {part.contact
                                          ? "İletişim"
                                          : "Fiyat"}
                                      </button>

                                      <button
                                        onClick={()=>
                                          deletePricePart(
                                            product.id,
                                            part.id
                                          )
                                        }
                                        className="w-9 rounded-lg bg-red-50 text-red-600"
                                      >
                                        ×
                                      </button>

                                    </div>

                                  </div>

                                ))}

                            </div>

                          </div>

                        )}

                        {/* ADMIN TOTAL */}

                        {productTotalText(
                          product,
                          draftData
                        ) && (

                          <div className="mt-4 pt-3 border-t border-slate-200 flex justify-between items-center">

                            <span className="font-bold text-sm">
                              Toplam
                            </span>

                            <span
                              className="font-black"
                              style={{
                                color:
                                  adminTheme.primary
                              }}
                            >
                              {productTotalText(
                                product,
                                draftData
                              )}
                            </span>

                          </div>

                        )}

                      </div>

                      {/* PRODUCT ACTIONS */}

                      <div className="flex flex-wrap gap-2 mt-3">

                        <button
                          onClick={()=>
                            moveProduct(
                              product.id,
                              -1
                            )
                          }
                          disabled={index===0}
                          className="btn px-3 py-2 rounded-lg bg-slate-100 text-sm disabled:opacity-30"
                        >
                          ↑
                        </button>

                        <button
                          onClick={()=>
                            moveProduct(
                              product.id,
                              1
                            )
                          }
                          disabled={
                            index===
                            adminProducts.length-1
                          }
                          className="btn px-3 py-2 rounded-lg bg-slate-100 text-sm disabled:opacity-30"
                        >
                          ↓
                        </button>

                        <button
                          onClick={()=>
                            deleteProduct(
                              product.id
                            )
                          }
                          className="btn ml-auto px-3 py-2 rounded-lg bg-red-50 text-red-600 text-sm font-bold"
                        >
                          Ürünü Sil
                        </button>

                      </div>

                    </div>

                  ))}

                  {adminProducts.length===0 && (

                    <div className="text-center py-8 text-sm text-slate-400">
                      Bu kategoride ürün yok.
                    </div>

                  )}

                </div>

              </section>

              {/* CURRENCY */}

              <section className="rounded-2xl border border-slate-200 p-4">

                <div className="font-bold mb-3">
                  Para Birimi
                </div>

                <div className="grid grid-cols-3 gap-2">

                  {[
                    ["TRY","₺ Türk Lirası"],
                    ["USD","$ Dolar"],
                    ["EUR","€ Euro"]
                  ].map(([code,label])=>(

                    <button
                      key={code}
                      onClick={()=>
                        setDraftPath(
                          ["currency"],
                          code
                        )
                      }
                      className={
                        "btn p-3 rounded-xl text-sm font-bold " +
                        (
                          draftData.currency===code
                            ? "bg-slate-900 text-white"
                            : "bg-slate-100"
                        )
                      }
                    >
                      {label}
                    </button>

                  ))}

                </div>

                <div className="grid grid-cols-2 gap-3 mt-3">

                  <div>

                    <label className="text-xs text-slate-500 font-semibold">
                      1 USD = TL
                    </label>

                    <input
                      type="number"
                      value={
                        draftData.rates?.USD ?? ""
                      }
                      onChange={e=>
                        setDraftPath(
                          ["rates","USD"],
                          e.target.value
                        )
                      }
                      className="mt-1 w-full px-3 py-2 rounded-lg border border-slate-300"
                    />

                  </div>

                  <div>

                    <label className="text-xs text-slate-500 font-semibold">
                      1 EUR = TL
                    </label>

                    <input
                      type="number"
                      value={
                        draftData.rates?.EUR ?? ""
                      }
                      onChange={e=>
                        setDraftPath(
                          ["rates","EUR"],
                          e.target.value
                        )
                      }
                      className="mt-1 w-full px-3 py-2 rounded-lg border border-slate-300"
                    />

                  </div>

                </div>

              </section>

              {/* THEME */}

              <section className="rounded-2xl border border-slate-200 p-4">

                <div className="font-bold mb-3">
                  Tema
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">

                  {THEME_LIST.map(theme=>(

                    <button
                      key={theme.name}
                      onClick={()=>
                        updateDraftData(copy=>{
                          copy.theme={
                            ...copy.theme,
                            ...theme
                          };
                        })
                      }
                      className={
                        "rounded-xl border overflow-hidden text-left " +
                        (
                          draftData.theme?.name===theme.name
                            ? "ring-2 ring-slate-900"
                            : "border-slate-200"
                        )
                      }
                    >

                      <div
                        className="h-10"
                        style={{
                          background:
                            `linear-gradient(135deg,
                              ${theme.primary},
                              ${theme.secondary})`
                        }}
                      />

                      <div className="p-2 text-xs font-bold">
                        {theme.name}
                      </div>

                    </button>

                  ))}

                </div>

              </section>

              {/* LOGO */}

              <section className="rounded-2xl border border-slate-200 p-4">

                <div className="font-bold mb-3">
                  Logo
                </div>

                {draftData.theme?.logo && (

                  <div className="bg-slate-100 rounded-xl p-4 mb-3 flex items-center justify-center">

                    <img
                      src={draftData.theme.logo}
                      alt=""
                      style={{
                        width:
                          Number(
                            draftData.theme.logoWidth
                          ) || 180,
                        maxWidth:"100%",
                        maxHeight:100,
                        objectFit:"contain"
                      }}
                    />

                  </div>

                )}

                <input
                  type="file"
                  accept="image/*"
                  onChange={e=>
                    handleLogo(
                      e.target.files?.[0]
                    )
                  }
                  className="w-full text-sm"
                />

                <div className="grid grid-cols-2 gap-3 mt-4">

                  <div>

                    <label className="text-xs font-semibold text-slate-500">
                      Logo genişliği
                    </label>

                    <input
                      type="range"
                      min="60"
                      max="500"
                      value={
                        Number(
                          draftData.theme?.logoWidth
                        ) || 180
                      }
                      onChange={e=>
                        setDraftPath(
                          ["theme","logoWidth"],
                          Number(e.target.value)
                        )
                      }
                      className="w-full"
                    />

                  </div>

                  <div>

                    <label className="text-xs font-semibold text-slate-500">
                      Ürün görsel yüksekliği
                    </label>

                    <input
                      type="range"
                      min="140"
                      max="500"
                      value={
                        Number(
                          draftData.theme?.productImageHeight
                        ) || 240
                      }
                      onChange={e=>
                        setDraftPath(
                          ["theme","productImageHeight"],
                          Number(e.target.value)
                        )
                      }
                      className="w-full"
                    />

                  </div>

                </div>

              </section>

              {/* BACKGROUND */}

              <section className="rounded-2xl border border-slate-200 p-4">

                <div className="font-bold mb-3">
                  Arka Plan
                </div>

                <input
                  type="file"
                  accept="image/*"
                  onChange={e=>
                    handleBackground(
                      e.target.files?.[0]
                    )
                  }
                  className="w-full text-sm"
                />

                {draftData.theme?.backgroundImage && (

                  <button
                    onClick={()=>
                      setDraftPath(
                        ["theme","backgroundImage"],
                        ""
                      )
                    }
                    className="mt-3 text-sm text-red-600 font-semibold"
                  >
                    Arka plan görselini kaldır
                  </button>

                )}

              </section>

              {/* PIN */}

              <section className="rounded-2xl border border-slate-200 p-4">

                <div className="font-bold mb-3">
                  Yönetim PIN
                </div>

                <input
                  type="text"
                  value={
                    draftData.pin || ""
                  }
                  onChange={e=>
                    setDraftPath(
                      ["pin"],
                      e.target.value
                    )
                  }
                  className="w-full px-3 py-2 rounded-xl border border-slate-300"
                />

              </section>

              {/* RESET */}

              <button
                onClick={resetDefault}
                className="btn w-full px-4 py-3 rounded-xl bg-red-50 text-red-700 font-bold"
              >
                ⚠ Varsayılan Ayarlara Dön
              </button>

            </div>

            {/* PANEL FOOTER */}

            <div className="border-t border-slate-200 p-4 bg-white">

              <div className="flex gap-2">

                <button
                  onClick={requestClosePanel}
                  disabled={saving}
                  className="btn flex-1 px-4 py-3 rounded-xl bg-slate-100 font-bold disabled:opacity-50"
                >
                  Kapat
                </button>

                <button
                  onClick={()=>
                    saveDraft(true)
                  }
                  disabled={saving}
                  className="btn flex-[1.5] px-4 py-3 rounded-xl text-white font-black disabled:opacity-60 flex items-center justify-center gap-2"
                  style={{
                    background:
                      adminTheme.primary
                  }}
                >

                  {saving && (
                    <span className="spinner" />
                  )}

                  {saving
                    ? "Kaydediliyor..."
                    : saved
                      ? "✓ Kaydedildi"
                      : "Kaydet ve Kapat"}

                </button>

              </div>

              <div className="text-center text-[11px] text-slate-400 mt-2">
                Değişiklikler yalnızca “Kaydet ve Kapat” ile yayınlanır.
              </div>

            </div>

          </aside>

        </div>

      )}

      {/* ================================================
          DISCARD CONFIRMATION
      ================================================ */}

      {discardModal && (

        <div
          className="fixed inset-0 z-[300] modal-bg flex items-center justify-center p-4 animate-fade"
        >

          <div
            className="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl animate-scale"
            onClick={e=>e.stopPropagation()}
          >

            <div className="w-12 h-12 rounded-2xl bg-amber-100 flex items-center justify-center text-2xl mb-4">
              ⚠️
            </div>

            <h2 className="text-xl font-black text-slate-900">
              Kaydedilmemiş değişiklikler var
            </h2>

            <p className="text-sm text-slate-500 mt-2 leading-6">
              Paneli şimdi kapatırsan yaptığın değişiklikler
              iptal edilecek ve son kaydedilmiş sürüm korunacak.
            </p>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 mt-6">

              <button
                onClick={()=>
                  setDiscardModal(false)
                }
                className="btn px-3 py-3 rounded-xl bg-slate-100 font-bold text-sm"
              >
                Panelde Kal
              </button>

              <button
                onClick={()=>
                  closePanelImmediately()
                }
                className="btn px-3 py-3 rounded-xl bg-red-600 text-white font-bold text-sm"
              >
                İptal Et ve Çık
              </button>

              <button
                onClick={()=>
                  saveDraft(true)
                }
                disabled={saving}
                className="btn px-3 py-3 rounded-xl text-white font-bold text-sm disabled:opacity-50"
                style={{
                  background:
                    publicTheme.primary
                }}
              >
                Kaydet ve Çık
              </button>

            </div>

          </div>

        </div>

      )}

    </div>

  );

}

ReactDOM.createRoot(
  document.getElementById("root")
).render(
  <App />
);

</script>
</body>
</html>
