    size,
    className

    <span

function resizeImg(
  file,
  maxW=700,
  quality=.78
){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload = e => {

        const img =
          new Image();

        img.onload = () => {

          let w =
            img.width;

          let h =
            img.height;

          if(
            w > maxW
          ){

            h =
              Math.round(
                h *
                (maxW / w)
              );

            w =
              maxW;
          }

          const canvas =
            document.createElement(
              "canvas"
            );

          canvas.width=w;
          canvas.height=h;

          const ctx =
            canvas.getContext(
              "2d"
            );

          ctx.drawImage(
            img,
            0,
            0,
            w,
            h
          );

          resolve(
            canvas.toDataURL(
              "image/jpeg",
              quality
            )
          );

        };

        img.onerror =
          reject;

        img.src =
          e.target.result;
      };

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   FİYAT
========================================================= */

function formatPrice(
  price,
  currency,
  rates,
  lang
){

  if(
    !price ||
    price.contactOnly ||
    price.amount === null ||
    price.amount === "" ||
    price.amount === undefined
  ){

    return (
      CONTACT[lang] ||
      CONTACT.tr
    );

  }

  let amount =
    Number(price.amount);

  if(
    currency === "usd"
  ){

    amount =
      amount /
      (rates.usd || 1);

  }

  if(
    currency === "eur"
  ){

    amount =
      amount /
      (rates.eur || 1);

  }

  const symbol =
    CURR.find(
      x => x.c === currency
    )?.s || "₺";

  const decimals =
    currency === "try"
      ? 0
      : 2;

  return (
    symbol +
    amount.toLocaleString(
      "tr-TR",
      {
        minimumFractionDigits:
          decimals,

        maximumFractionDigits:
          decimals
      }
    )
  );

}

async function translateText(

  source
){

    !text ||
    !text.trim()
  ){

    return {
      tr:"",
      en:"",
      ar:""
    };

  }

  /*
    GitHub Pages üzerinde API anahtarını
    frontend'e koymak güvenli olmadığı için
    temel fallback kullanılıyor.
  */

  const r = {
    tr:text,
    en:text,
    ar:text
  };

  if(source === "tr"){

    const map = {

      "Yeni Ürün":
        "New Product",

      "Yeni Kategori":
        "New Category",

      "Ürün":
        "Product",

      "Modeli":
        "Model",

      "VIP Makam Takımları":
        "VIP Executive Sets",

      "Makam Takımları":
        "Executive Sets",

      "Personel Takımları":
        "Staff Sets",

      "Toplantı Masaları":
        "Meeting Tables",

      "Workstation":
        "Workstations",

      "Loby Koltukları":
        "Lobby Sofas",

      "Ofis Koltukları":
        "Office Chairs",

      "Fileli Koltuklar":
        "Mesh Chairs",

      "Aksesuarlar":
        "Accessories"

    };

    r.en =
      map[text] ||
      text;

  }

  return r;

}

                      )

                  }
          )

    );

    categoryId,
    itemId,
    direction

    setData(
      previous => ({
        ...previous,

        categories:
          previous.categories.map(
            category => {

              if(
                category.id !== categoryId
              ){

                return category;

              }

              const index =
                category.items.findIndex(
                  item =>
                    item.id === itemId
                );

              const nextIndex =
                index + direction;

              if(
                nextIndex < 0 ||
                nextIndex >=
                category.items.length
              ){

                return category;

              }

              const items =
                [
                  ...category.items
                ];

              [
                items[index],
                items[nextIndex]
              ] =
              [
                items[nextIndex],
                items[index]
              ];

              return {
                ...category,
                items
              };

            }
          )

      })
    );

                            }}
                          >

                            <span
                              style={{
                                width:14,
                                height:14,
                                borderRadius:999,
                                backgroundColor:
                                  theme.accent
                              }}
                            />

                          </div>


                          <div className="bg-neutral-900 text-center py-1 text-[9px]">
                            {theme.name}
                          </div>

                        </button>

                      )
                    )}

                  </div>


                  <Color
                    label="Arka plan"
                    value={
                      data.theme.bg
                    }
                    onChange={
                      value =>
                        set(
                          [
                            "theme",
                            "bg"
                          ],
                          value
                        )
                    }
                  />


                  <Color
                    label="Kart rengi"
                    value={
                      data.theme.card
                    }
                    onChange={
                      value =>
                        set(
                          [
                            "theme",
                            "card"
                          ],
                          value
                        )
                    }
                  />


                  <Color
                    label="Vurgu rengi"
                    value={
                      data.theme.accent
                    }
                    onChange={
                      value =>
                        set(
                          [
                            "theme",
                            "accent"
                          ],
                          value
                        )
                    }
                  />


                  <Color
                    label="Yazı rengi"
                    value={
                      data.theme.text
                    }
                    onChange={
                      value =>
                        set(
                          [
                            "theme",
                            "text"
                          ],
                          value
                        )
                    }
                  />


                  {/* ARKA PLAN */}

                  <div className="flex gap-2 mt-2 mb-4">

                    <button
                      onClick={() =>
                        bgRef.current?.click()
                      }

                      className="flex-1 flex items-center justify-center gap-1 bg-neutral-900 border border-neutral-700 rounded-lg py-2 text-xs"
                    >

                      <Icon
                        name="upload"
                        size={13}
                      />

                      Arka Plan Görseli

                    </button>


                    <input
                      type="file"
                      accept="image/*"
                      ref={bgRef}
                      className="hidden"
                      onChange={
                        upBg
                      }
                    />


                    {data.theme.bgImage && (

                      <button
                        onClick={() =>
                          set(
                            [
                              "theme",
                              "bgImage"
                            ],
                            null
                          )
                        }

                        className="px-3 bg-neutral-900 border border-neutral-700 rounded-lg"
                      >

                        <Icon
                          name="trash-2"
                          size={14}
                        />

                      </button>

                    )}

                  </div>


                  {/* ÜRÜN GÖRSEL BOYUTU */}

                  <label className="block mb-3">

                    <Lbl>
                      Ürün görsel boyutu —
                      {data.cardImgSize}px
                    </Lbl>

                    <input
                      type="range"
                      min="90"
                      max="300"

                      value={
                        data.cardImgSize
                      }

                      onChange={
                        event =>
                          set(
                            [
                              "cardImgSize"
                            ],
                            Number(
                              event.target.value
                            )
                          )
                      }

                      className="w-full"
                    />

                  </label>


                  {/* PIN */}

                  <label className="block mb-3">

                    <Lbl>
                      Yönetim PIN
                    </Lbl>

                    <input
                      value={
                        data.pin
                      }

                      inputMode="numeric"

                      maxLength="8"

                      onChange={
                        event =>
                          set(
                            [
                              "pin"
                            ],
                            event.target.value.replace(
                              /\D/g,
                              ""
                            )
                          )
                      }

                      className="w-full bg-neutral-900 border border-neutral-700 rounded-lg px-3 py-2 text-sm tracking-widest"
                    />

                  </label>


                  {/* RESET */}

                  <button
                    onClick={() => {

                      if(
                        confirm(
                          "Tüm ayarlar varsayılana döndürülsün mü?"
                        )
                      ){

                        const defaults =
                          defData();

                        setData(
                          defaults
                        );

                        setActiveCat(
                          defaults.categories[0].id
                        );

                        toastMsg(
                          "Varsayılan ayarlar yüklendi"
                        );

                      }

                    }}

                    className="w-full flex items-center justify-center gap-1.5 py-2 rounded-lg text-xs bg-neutral-900 border border-neutral-700 text-neutral-400"
                  >

                    <Icon
                      name="rotate-ccw"
                      size={13}
                    />

                    Varsayılana Sıfırla

                  </button>

                </div>

              )}


              {/* =================================================
                  ÜRÜN KATALOĞU
              ================================================= */}

              {tab === "icerik" && (

                <div>

                  <button
                    onClick={
                      addCat
                    }

                    className="w-full flex items-center justify-center gap-1.5 mb-3 py-2.5 rounded-lg text-sm font-semibold text-white"

                    style={{
                      backgroundColor:
                        data.theme.accent
                    }}
                  >

                    <Icon
                      name="plus"
                      size={16}
                    />

                    Yeni Kategori

                  </button>


                  {data.categories.map(
                    (
                      category,
                      categoryIndex
                    ) => (

                      <div
                        key={
                          category.id
                        }

                        className="mb-3 bg-neutral-900 rounded-xl border border-neutral-800"
                      >


                        {/* CATEGORY HEADER */}

                        <div className="flex items-center gap-1.5 p-2">

                          <div className="flex-1">

                            <input
                              value={
                                category.name[
                                  editLang
                                ]
                              }

                              onChange={
                                event =>
                                  renameCat(
                                    category.id,
                                    event.target.value
                                  )
                              }

                              onBlur={() =>
                                translateCat(
                                  category.id
                                )
                              }

                              className="w-full bg-neutral-800 rounded-lg px-2.5 py-1.5 text-sm outline-none"
                            />

                          </div>


                          <button
                            onClick={() =>
                              moveCat(
                                category.id,
                                -1
                              )
                            }

                            disabled={
                              categoryIndex === 0
                            }

                            className="p-1.5 bg-neutral-800 rounded-lg disabled:opacity-30"
                          >

                            <Icon
                              name="chevron-up"
                              size={14}
                            />

                          </button>


                          <button
                            onClick={() =>
                              moveCat(
                                category.id,
                                1
                              )
                            }

                            disabled={
                              categoryIndex ===
                              data.categories.length - 1
                            }

                            className="p-1.5 bg-neutral-800 rounded-lg disabled:opacity-30"
                          >

                            <Icon
                              name="chevron-down"
                              size={14}
                            />

                          </button>


                          <button
                            onClick={() => {

                              if(
                                confirm(
                                  "Bu kategoriyi silmek istiyor musun?"
                                )
                              ){

                                delCat(
                                  category.id
                                );

                              }

                            }}

                            className="p-1.5 bg-red-950 rounded-lg text-red-400"
                          >

                            <Icon
                              name="trash-2"
                              size={14}
                            />

                          </button>


                          <button
                            onClick={() =>
                              setOpenCat(
                                openCat === category.id
                                  ? null
                                  : category.id
                              )
                            }

                            className="p-1.5 bg-neutral-800 rounded-lg text-[11px] px-2"
                          >

                            {openCat === category.id
                              ? "Kapat"
                              : "Ürünler"}

                          </button>

                        </div>


                        {/* PRODUCTS */}

                        {openCat === category.id && (

                          <div className="p-2 pt-0 space-y-2">

                            {category.items.map(
                              (
                                item,
                                itemIndex
                              ) => (

                                <div
                                  key={
                                    item.id
                                  }

                                  className="bg-neutral-800 rounded-lg p-2.5"
                                >


                                  <div className="flex gap-2 mb-2">


                                    {/* IMAGE */}

                                    <div
                                      onClick={() =>
                                        itemRefs.current[
                                          item.id
                                        ]?.click()
                                      }

                                      className="w-14 h-14 rounded-md bg-neutral-700 flex items-center justify-center overflow-hidden cursor-pointer flex-shrink-0"

                                      style={{
                                        backgroundImage:
                                          item.image
                                            ? `url(${item.image})`
                                            : undefined,

                                        backgroundSize:
                                          "cover",

                                        backgroundPosition:
                                          "center"
                                      }}
                                    >

                                      {!item.image && (

                                        <Icon
                                          name="image"
                                          size={16}
                                          className="opacity-40"
                                        />

                                      )}

                                    </div>


                                    <input
                                      type="file"
                                      accept="image/*"

                                      className="hidden"

                                      ref={
                                        element =>
                                          itemRefs.current[
                                            item.id
                                          ] =
                                            element
                                      }

                                      onChange={
                                        event =>
                                          upItemImg(
                                            category.id,
                                            item.id,
                                            event
                                          )
                                      }
                                    />


                                    <div className="flex-1 space-y-1.5">


                                      {/* PRODUCT NAME */}

                                      <input
                                        value={
                                          item.name[
                                            editLang
                                          ]
                                        }

                                        onChange={
                                          event =>
                                            updItem(
                                              category.id,
                                              item.id,
                                              "name",
                                              event.target.value
                                            )
                                        }

                                        onBlur={() =>
                                          translateItem(
                                            category.id,
                                            item.id,
                                            "name"
                                          )
                                        }

                                        placeholder={
                                          `Ürün adı (${editLang.toUpperCase()})`
                                        }

                                        className="w-full bg-neutral-900 rounded-md px-2 py-1.5 text-xs outline-none"
                                      />


                                      {/* DIMENSIONS */}

                                      <input
                                        value={
                                          item.dims
                                        }

                                        onChange={
                                          event =>
                                            updItem(
                                              category.id,
                                              item.id,
                                              "dims",
                                              event.target.value
                                            )
                                        }

                                        placeholder="Ölçüler: 200x90x75 cm"

                                        className="w-full bg-neutral-900 rounded-md px-2 py-1.5 text-xs outline-none"
                                      />

                                    </div>

                                  </div>


                                  {/* DESCRIPTION */}

                                  <input
                                    value={
                                      item.desc[
                                        editLang
                                      ]
                                    }

                                    onChange={
                                      event =>
                                        updItem(
                                          category.id,
                                          item.id,
                                          "desc",
                                          event.target.value
                                        )
                                    }

                                    onBlur={() =>
                                      translateItem(
                                        category.id,
                                        item.id,
                                        "desc"
                                      )
                                    }

                                    placeholder={
                                      `Özellikler (${editLang.toUpperCase()})`
                                    }

                                    className="w-full bg-neutral-900 rounded-md px-2 py-1.5 text-xs outline-none mb-2"
                                  />


                                  {/* PRICE */}

                                  <div className="flex items-center gap-2 mb-2">

                                    <input
                                      type="number"

                                      disabled={
                                        item.price.contactOnly
                                      }

                                      value={
                                        item.price.amount ??
                                        ""
                                      }

                                      onChange={
                                        event =>
                                          updPrice(
                                            category.id,
                                            item.id,
                                            {
                                              amount:
                                                event.target.value === ""
                                                  ? null
                                                  : Number(
                                                      event.target.value
                                                    )
                                            }
                                          )
                                      }

                                      placeholder="Fiyat (TL)"

                                      className="flex-1 bg-neutral-900 rounded-md px-2 py-1.5 text-xs outline-none disabled:opacity-40"
                                    />


                                    <label className="flex items-center gap-1 text-[10px] text-neutral-400 whitespace-nowrap">

                                      <input
                                        type="checkbox"

                                        checked={
                                          item.price.contactOnly
                                        }

                                        onChange={
                                          event =>
                                            updPrice(
                                              category.id,
                                              item.id,
                                              {
                                                contactOnly:
                                                  event.target.checked
                                              }
                                            )
                                        }
                                      />

                                      İletişime geçin

                                    </label>

                                  </div>


                                  {/* ACTIONS */}

                                  <div className="flex gap-1 justify-end">


                                    {item.image && (

                                      <button
                                        onClick={() =>
                                          updItem(
                                            category.id,
                                            item.id,
                                            "image",
                                            null
                                          )
                                        }

                                        className="text-[10px] px-2 py-1 bg-neutral-700 rounded"
                                      >
                                        Görseli Sil
                                      </button>

                                    )}


                                    <button
                                      onClick={() =>
                                        moveItem(
                                          category.id,
                                          item.id,
                                          -1
                                        )
                                      }

                                      disabled={
                                        itemIndex === 0
                                      }

                                      className="p-1 bg-neutral-700 rounded disabled:opacity-30"
                                    >

                                      <Icon
                                        name="chevron-up"
                                        size={12}
                                      />

                                    </button>


                                    <button
                                      onClick={() =>
                                        moveItem(
                                          category.id,
                                          item.id,
                                          1
                                        )
                                      }

                                      disabled={
                                        itemIndex ===
                                        category.items.length - 1
                                      }

                                      className="p-1 bg-neutral-700 rounded disabled:opacity-30"
                                    >

                                      <Icon
                                        name="chevron-down"
                                        size={12}
                                      />

                                    </button>


                                    <button
                                      onClick={() => {

                                        if(
                                          confirm(
                                            "Bu ürünü silmek istiyor musun?"
                                          )
                                        ){

                                          delItem(
                                            category.id,
                                            item.id
                                          );

                                        }

                                      }}

                                      className="p-1 bg-red-950 rounded text-red-400"
                                    >

                                      <Icon
                                        name="trash-2"
                                        size={12}
                                      />

                                    </button>

                                  </div>

                                </div>

                              )
                            )}


                            {/* ADD PRODUCT */}

                            <button
                              onClick={() =>
                                addItem(
                                  category.id
                                )
                              }

                              className="w-full flex items-center justify-center gap-1.5 py-2 rounded-lg text-xs font-medium bg-neutral-700"
                            >

                              <Icon
                                name="plus"
                                size={13}
                              />

                              Ürün Ekle

                            </button>

                          </div>

                        )}

                      </div>

                    )
                  )}

                </div>

              )}

            </div>


            {/* =================================================
                KAYDET
            ================================================= */}

            <div className="sticky bottom-0 bg-neutral-950 border-t border-neutral-800 p-4">

              <button
                onClick={
                  save
                }

                disabled={
                  saving
                }

                className="w-full flex items-center justify-center gap-2 py-3 rounded-xl text-sm font-bold text-white"

                style={{
                  backgroundColor:
                    saved
                      ? "#12B76A"
                      : data.theme.accent,

                  animation:
                    saved
                      ? "popSave .5s ease"
                      : saving
                        ? undefined
                        : "pulseGlow 2.2s ease-in-out infinite"
                }}
              >

                {saved
                  ? <Icon
                      name="check"
                      size={17}
                    />
                  : <Icon
                      name="save"
                      size={16}
                    />
                }

                {saved
                  ? "Kaydedildi!"
                  : saving
                    ? "Kaydediliyor…"
                    : "Kaydet ve Kapat"}

              </button>

            </div>

          </div>

        </div>

      )}

    </div>

  );

}


/* =========================================================
   UYGULAMAYI BAŞLAT
========================================================= */

ReactDOM
  .createRoot(
    document.getElementById(
      "root"
    )
  )
  .render(
    <FurnitureSiteApp />
  );

</script>

</body>
</html>
