<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#141416">
<meta name="color-scheme" content="dark">
<title>Ofischi</title>

<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body,
#root{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#141416;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeSpeed;
}

button,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

button:disabled{
  cursor:not-allowed;
}

::-webkit-scrollbar{
  display:none;
}

*{
  scrollbar-width:none;
}


/* =========================================================
   LIQUID GLASS
========================================================= */

.glass{
  background:rgba(255,255,255,.075);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:
    0 8px 32px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(18px) saturate(135%);
  -webkit-backdrop-filter:blur(18px) saturate(135%);
}

.glass-strong{
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:
    0 15px 45px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.10);
  backdrop-filter:blur(24px) saturate(145%);
  -webkit-backdrop-filter:blur(24px) saturate(145%);
}

.glass-dark{
  background:rgba(8,8,10,.66);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:
    0 20px 60px rgba(0,0,0,.32),
    inset 0 1px 0 rgba(255,255,255,.06);
  backdrop-filter:blur(24px) saturate(130%);
  -webkit-backdrop-filter:blur(24px) saturate(130%);
}


/* =========================================================
   LIQUID BACKGROUND
========================================================= */

.liquid-bg{
  position:relative;
  isolation:isolate;
  overflow:hidden;
}

.liquid-bg::before,
.liquid-bg::after{
  content:"";
  position:fixed;
  pointer-events:none;
  z-index:-3;
  border-radius:999px;
  filter:blur(70px);
  will-change:transform;
}

.liquid-bg::before{
  width:520px;
  height:520px;
  top:-170px;
  left:-180px;
  background:
    radial-gradient(
      circle,
      color-mix(in srgb,var(--accent) 42%,transparent),
      transparent 68%
    );
  opacity:.22;
  animation:
    luxuryDrift
    18s
    ease-in-out
    infinite
    alternate;
}

.liquid-bg::after{
  width:480px;
  height:480px;
  right:-170px;
  bottom:-160px;
  background:
    radial-gradient(
      circle,
      color-mix(in srgb,var(--accent) 34%,transparent),
      transparent 68%
    );
  opacity:.18;
  animation:
    luxuryDriftReverse
    22s
    ease-in-out
    infinite
    alternate;
}


/* =========================================================
   EXTRA LIQUID LIGHT LAYERS
========================================================= */

.liquid-bg .liquid-light-one,
.liquid-bg .liquid-light-two{
  position:fixed;
  pointer-events:none;
  z-index:-2;
  border-radius:999px;
  filter:blur(75px);
  will-change:transform;
}

.liquid-bg .liquid-light-one{
  width:300px;
  height:300px;
  top:22%;
  left:-120px;
  background:var(--accent);
  opacity:.08;
  animation:
    orbFloat1
    12s
    ease-in-out
    infinite;
}

.liquid-bg .liquid-light-two{
  width:280px;
  height:280px;
  right:-100px;
  top:42%;
  background:var(--accent);
  opacity:.065;
  animation:
    orbFloat2
    16s
    ease-in-out
    infinite;
}


/* =========================================================
   LUXURY SHIMMER
========================================================= */

.liquid-bg .luxury-surface{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  opacity:.12;
  background:
    radial-gradient(
      circle at 20% 30%,
      rgba(255,255,255,.07),
      transparent 25%
    ),
    radial-gradient(
      circle at 80% 70%,
      rgba(255,255,255,.045),
      transparent 28%
    ),
    linear-gradient(
      120deg,
      transparent 0%,
      rgba(255,255,255,.025) 48%,
      transparent 52%
    );
  background-size:
    100% 100%,
    100% 100%,
    220% 100%;
  animation:
    luxuryShimmer
    14s
    linear
    infinite;
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes pageEnter{

  from{
    opacity:0;
    transform:translateY(8px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


@keyframes fadeIn{

  from{
    opacity:0;
    transform:translateY(6px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


@keyframes pop{

  0%{
    opacity:0;
    transform:scale(.94);
  }

  70%{
    opacity:1;
    transform:scale(1.015);
  }

  100%{
    opacity:1;
    transform:scale(1);
  }

}


@keyframes modalIn{

  from{
    opacity:0;
    transform:translateY(25px) scale(.97);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }

}


@keyframes modalInDesktop{

  from{
    opacity:0;
    transform:translateY(14px) scale(.96);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }

}


@keyframes panelIn{

  from{
    opacity:0;
    transform:translateX(100%);
  }

  to{
    opacity:1;
    transform:translateX(0);
  }

}


@keyframes backdropIn{

  from{
    opacity:0;
  }

  to{
    opacity:1;
  }

}


@keyframes productEnter{

  0%{
    opacity:0;
    transform:translateY(15px) scale(.975);
  }

  100%{
    opacity:1;
    transform:translateY(0) scale(1);
  }

}


@keyframes categoryEnter{

  0%{
    opacity:0;
    transform:translateY(10px) scale(.95);
  }

  100%{
    opacity:1;
    transform:translateY(0) scale(1);
  }

}


@keyframes categoryGlow{

  0%,
  100%{
    opacity:.35;
    transform:scaleX(.65);
  }

  50%{
    opacity:1;
    transform:scaleX(1);
  }

}


@keyframes categoryLight{

  0%{
    left:-120%;
  }

  100%{
    left:140%;
  }

}


@keyframes imageViewerIn{

  from{
    opacity:0;
  }

  to{
    opacity:1;
  }

}


@keyframes imageZoomIn{

  from{
    opacity:0;
    transform:scale(.82);
  }

  to{
    opacity:1;
    transform:scale(1);
  }

}


@keyframes toastIn{

  from{
    opacity:0;
    transform:translateY(12px) scale(.94);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }

}


@keyframes pulseGlass{

  0%,
  100%{
    box-shadow:
      0 0 0 0 rgba(255,255,255,0),
      0 8px 28px rgba(0,0,0,.16);
  }

  50%{
    box-shadow:
      0 0 0 5px rgba(255,255,255,.035),
      0 10px 32px rgba(0,0,0,.20);
  }

}


@keyframes ambientFloat{

  from{
    transform:translate3d(0,0,0) scale(1);
  }

  to{
    transform:translate3d(25px,-18px,0) scale(1.08);
  }

}


@keyframes luxuryDrift{

  0%{
    transform:
      translate3d(-1.5%,-1%,0)
      scale(1);
  }

  50%{
    transform:
      translate3d(1%,1.5%,0)
      scale(1.035);
  }

  100%{
    transform:
      translate3d(-.5%,2%,0)
      scale(1.02);
  }

}


@keyframes luxuryDriftReverse{

  0%{
    transform:
      translate3d(1%,0,0)
      scale(1);
  }

  50%{
    transform:
      translate3d(-1.5%,-1.5%,0)
      scale(1.04);
  }

  100%{
    transform:
      translate3d(.5%,1%,0)
      scale(1.02);
  }

}


@keyframes luxuryShimmer{

  0%{
    background-position:
      0 0,
      0 0,
      0 0;
  }

  100%{
    background-position:
      0 0,
      70px 70px,
      100% 0;
  }

}


@keyframes orbFloat1{

  0%,
  100%{
    transform:translate(0,0);
  }

  50%{
    transform:translate(70px,-45px);
  }

}


@keyframes orbFloat2{

  0%,
  100%{
    transform:translate(0,0);
  }

  50%{
    transform:translate(-60px,50px);
  }

}


@keyframes luxuryEnter{

  from{
    opacity:0;
    transform:translateY(14px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


/* =========================================================
   SEARCH
========================================================= */

.search-input{
  width:100%;
  background:rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.13);
  color:inherit;
  border-radius:18px;
  padding:13px 44px;
  outline:none;

  box-shadow:
    0 12px 35px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.05);

  backdrop-filter:
    blur(18px)
    saturate(130%);

  -webkit-backdrop-filter:
    blur(18px)
    saturate(130%);

  transition:
    border-color .2s ease,
    box-shadow .2s ease,
    transform .2s ease;
}

.search-input:focus{
  border-color:rgba(255,255,255,.24);

  box-shadow:
    0 14px 38px rgba(0,0,0,.22),
    0 0 0 3px rgba(255,255,255,.035);

  transform:translateY(-1px);
}


/* =========================================================
   CATEGORY
========================================================= */

.category-bar{
  background:transparent!important;
  box-shadow:none!important;
  backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important;
}

.category-scroll{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:5px 2px 10px;
  -webkit-overflow-scrolling:touch;
  scroll-snap-type:x proximity;
}

.category-chip{
  position:relative;
  flex-shrink:0;
  overflow:hidden;

  border:1px solid rgba(255,255,255,.10);
  border-radius:15px;

  padding:9px 14px;

  font-size:12px;
  font-weight:700;
  white-space:nowrap;

  transition:
    transform .28s cubic-bezier(.22,1,.36,1),
    background .28s ease,
    border-color .28s ease,
    box-shadow .28s ease,
    opacity .28s ease;

  scroll-snap-align:start;
}

.category-chip::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.10),
      transparent 38%
    );
  opacity:.35;
}

.category-chip::after{
  content:"";
  position:absolute;
  top:-80%;
  left:-120%;
  width:70%;
  height:260%;

  background:
    linear-gradient(
      110deg,
      transparent 35%,
      rgba(255,255,255,.16) 50%,
      transparent 65%
    );

  transform:rotate(8deg);
  pointer-events:none;
}

.category-chip:hover{
  transform:translateY(-2px);
}

.category-chip:hover::after{
  animation:
    categoryLight
    .65s
    ease
    forwards;
}

.category-chip:active{
  transform:scale(.94);
}

.category-chip.active{
  transform:translateY(-2px);
}

.category-chip.active::after{
  animation:
    categoryLight
    .8s
    ease
    forwards;
}

.category-chip.active::before{
  opacity:.5;
}

.category-chip.active{
  box-shadow:
    0 7px 20px
      color-mix(
        in srgb,
        var(--accent) 22%,
        transparent
      ),
    inset 0 1px 0 rgba(255,255,255,.16);
}


/* =========================================================
   CATEGORY ACTIVE UNDERLINE
========================================================= */

.category-chip.active{
  isolation:isolate;
}

.category-chip.active span{
  position:relative;
  z-index:2;
}


/* =========================================================
   PRODUCT
========================================================= */

.product-card{
  position:relative;
  overflow:hidden;

  transform:translateZ(0);

  contain:layout paint;
  content-visibility:auto;
  contain-intrinsic-size:320px;

  -webkit-tap-highlight-color:transparent;

  animation:
    productEnter
    .45s
    cubic-bezier(.2,.8,.2,1)
    both;

  transition:
    transform .28s cubic-bezier(.2,.8,.2,1),
    box-shadow .28s ease,
    border-color .28s ease;
}

.product-card::before{
  content:"";
  position:absolute;
  top:0;
  left:-120%;
  width:65%;
  height:100%;

  pointer-events:none;

  border-radius:inherit;

  background:
    linear-gradient(
      110deg,
      transparent 25%,
      rgba(255,255,255,.12) 50%,
      transparent 75%
    );

  transform:rotate(8deg);

  opacity:.5;

  z-index:5;

  transition:
    transform 1.2s ease;
}

.product-card:hover{
  transform:
    translateY(-6px)
    scale(1.008);

  box-shadow:
    0 18px 42px rgba(0,0,0,.25),
    0 0 0 1px rgba(255,255,255,.04);
}

.product-card:hover::before{
  transform:
    translateX(260%)
    rotate(8deg);
}

.product-card:active{
  transform:
    scale(.965)
    translateY(1px);
}

.product-image{
  position:relative;
  overflow:hidden;
}

.product-image::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.08),
      transparent 45%
    );

  opacity:.6;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;

  transform:scale(1.001);

  transition:
    transform .55s cubic-bezier(.22,1,.36,1),
    filter .35s ease;
}

.product-card:hover .product-image img{
  transform:scale(1.045);
}

.product-detail-image{
  cursor:zoom-in;
}


/* =========================================================
   BUTTONS
========================================================= */

.liquid-button{
  position:relative;
  overflow:hidden;

  transition:
    transform .18s ease,
    box-shadow .2s ease,
    filter .2s ease;
}

.liquid-button::after{
  content:"";

  position:absolute;

  top:-80%;
  left:-80%;

  width:50%;
  height:260%;

  transform:rotate(25deg);

  background:rgba(255,255,255,.14);

  transition:
    left .55s ease;

  pointer-events:none;
}

.liquid-button:hover::after{
  left:150%;
}

.liquid-button:hover{
  filter:brightness(1.04);
}

.liquid-button:active{
  transform:scale(.96);
}


/* =========================================================
   MODALS
========================================================= */

.modal-backdrop{
  background:rgba(0,0,0,.68);

  backdrop-filter:
    blur(9px)
    saturate(115%);

  -webkit-backdrop-filter:
    blur(9px)
    saturate(115%);

  animation:
    backdropIn
    .2s
    ease
    both;
}

.product-modal{
  animation:
    modalIn
    .34s
    cubic-bezier(.22,1,.36,1)
    both;
}

@media(min-width:640px){

  .product-modal{
    animation:
      modalInDesktop
      .3s
      cubic-bezier(.22,1,.36,1)
      both;
  }

}

.full-image-viewer{
  background:rgba(0,0,0,.94);

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  animation:
    imageViewerIn
    .22s
    ease
    both;
}

.full-image-viewer img{
  max-width:96vw;
  max-height:92vh;

  width:auto;
  height:auto;

  object-fit:contain;
  display:block;

  animation:
    imageZoomIn
    .35s
    cubic-bezier(.22,1,.36,1)
    both;

  filter:
    drop-shadow(
      0 20px 50px rgba(0,0,0,.45)
    );
}


/* =========================================================
   ADMIN
========================================================= */

.admin-panel{
  animation:
    backdropIn
    .2s
    ease
    both;
}

.admin-aside{
  animation:
    panelIn
    .34s
    cubic-bezier(.22,1,.36,1)
    both;
}

.admin-input{
  width:100%;

  background:rgba(255,255,255,.045);

  border:
    1px solid rgba(255,255,255,.11);

  color:#f5f5f5;

  border-radius:12px;

  padding:10px 12px;

  outline:none;

  font-size:13px;

  transition:
    border-color .2s ease,
    background .2s ease,
    box-shadow .2s ease,
    transform .2s ease;
}

.admin-input:focus{
  border-color:rgba(255,255,255,.28);

  background:rgba(255,255,255,.065);

  box-shadow:
    0 0 0 3px rgba(255,255,255,.035);

  transform:translateY(-1px);
}

.admin-section{
  background:rgba(255,255,255,.035);

  border:
    1px solid rgba(255,255,255,.08);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.035);
}


/* =========================================================
   TOAST
========================================================= */

.toast{
  animation:
    toastIn
    .3s
    cubic-bezier(.22,1,.36,1)
    both;
}


/* =========================================================
   HEADER
========================================================= */

header{
  animation:
    luxuryEnter
    .7s
    cubic-bezier(.2,.75,.2,1)
    both;
}


/* =========================================================
   PERFORMANCE
========================================================= */

@media(max-width:640px){

  .glass,
  .glass-strong{
    backdrop-filter:
      blur(12px)
      saturate(125%);

    -webkit-backdrop-filter:
      blur(12px)
      saturate(125%);
  }

  .modal-backdrop{
    backdrop-filter:blur(5px);
    -webkit-backdrop-filter:blur(5px);
  }

  .liquid-bg::before,
  .liquid-bg::after{
    filter:blur(55px);
    opacity:.11;
  }

  .liquid-bg .liquid-light-one,
  .liquid-bg .liquid-light-two{
    filter:blur(55px);
    opacity:.045;
  }

  .product-card:hover{
    transform:none;
  }

  .product-card:hover .product-image img{
    transform:none;
  }

  .product-card::before{
    display:none;
  }

  .category-chip:hover{
    transform:none;
  }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }

  .liquid-bg::before,
  .liquid-bg::after,
  .liquid-bg .liquid-light-one,
  .liquid-bg .liquid-light-two,
  .liquid-bg .luxury-surface{
    animation:none!important;
  }

}


/* =========================================================
   SMALL DEVICES
========================================================= */

@media(max-width:420px){

  .product-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .category-chip{
    padding:9px 12px;
    font-size:11.5px;
  }

}

</style>
</head>

/* =========================================================
   PRICE NORMALIZE
========================================================= */

function normalizePrice(price){

  if(!price){

    return{
      contactOnly:true,
      amount:null,
      parts:[]
    };

  }

  let parts=[];

  if(Array.isArray(price.parts)){

    parts=
      price.parts.map(p=>({

        id:p.id||uid(),

        name:
          typeof p.name==="string"
          ?p.name
          :"Ürün",

        amount:
          p.amount===null||
          p.amount===undefined||
          p.amount===""
          ?null
          :Number(p.amount),

        contactOnly:
          !!p.contactOnly

      }));

  }

  if(
    parts.length===0 &&
    price.amount!==null &&
    price.amount!==undefined &&
    price.amount!==""
  ){

    parts.push({

      id:uid(),

      name:"Ürün",

      amount:Number(price.amount),

      contactOnly:
        !!price.contactOnly

    });

  }

  return{

    contactOnly:
      !!price.contactOnly&&
      parts.length===0,

    amount:
      price.amount??null,

    parts

  };

}

   ITEM NORMALIZE

function normalizeItem(item){

  item=item||{};

  return{

    desc:

    dims:

      ?item.dims

    image:

  };

}


/* =========================================================
   CATEGORIES NORMALIZE
========================================================= */

function normalizeCategories(categories){

  if(!Array.isArray(categories)){
    return createDefaultCategories();
  }

  return categories.map(category=>({

    id:
      category.id||uid(),

    name:
      typeof category.name==="string"
      ?category.name
      :(category.name?.tr||"Yeni Kategori"),

    items:
      Array.isArray(category.items)
      ?category.items.map(normalizeItem)
      :[]

  }));

}

/* =========================================================
   DATA NORMALIZE
========================================================= */

function normalizeData(input){

  const base=
    defaultData();

  if(
    !input||
    typeof input!=="object"
  ){
    return base;
  }

  const result={
    ...base,
    ...input
  };

  result.logo={
    ...base.logo,
    ...(input.logo||{})
  };

  result.theme={
    ...base.theme,
    ...(input.theme||{})
  };

  result.currency={
    ...base.currency,
    ...(input.currency||{})
  };

  if(
    input.stores &&
    typeof input.stores==="object"
  ){

    const legacyLogo=
      input.logo||
      base.logo;

    result.stores={

      premium:
        normalizeStore(
          input.stores.premium,
          legacyLogo
        ),

      outlet:
        normalizeStore(
          input.stores.outlet,
          legacyLogo
        )

    };

  }
  else if(
    Array.isArray(input.categories)
  ){

    const legacyLogo=
      input.logo||
      base.logo;

    result.stores={

      premium:{

        logo:
          normalizeLogo(
            legacyLogo
          ),

        categories:
          normalizeCategories(
            input.categories
          )

      },

      outlet:
        createEmptyStore()

    };

  }
  else{

    const legacyLogo=
      input.logo||
      base.logo;

    result.stores={

      premium:
        createEmptyStore(
          legacyLogo
        ),

      outlet:
        createEmptyStore()

    };

  }

  result.siteName=
    typeof input.siteName==="string"
    ?input.siteName
    :"Ofischi";

  result.subtitle=
    typeof input.subtitle==="string"
    ?input.subtitle
    :"Ofis Mobilyaları";

  result.eyebrow=
    typeof input.eyebrow==="string"
    ?input.eyebrow
    :"İNEGÖL ÜRETİM";

  result.phone=
    typeof input.phone==="string"
    ?input.phone
    :"";

  result.pin=
    typeof input.pin==="string"
    ?input.pin
    :"1234";

  result.cardImgSize=
    Number(input.cardImgSize)||
    180;

  result.stores.premium.logo=
    normalizeLogo(
      result.stores.premium.logo,
      result.logo
    );

  result.stores.outlet.logo=
    normalizeLogo(
      result.stores.outlet.logo,
      result.logo
    );

  return result;

}


/* =========================================================
   IMAGE HELPERS
========================================================= */

function dataUrlToBlob(dataUrl){

  const parts=
    dataUrl.split(",");

  const meta=
    parts[0]||"";

  const data=
    parts[1]||"";

  const mimeMatch=
    meta.match(/data:([^;]+)/);

  const mime=
    mimeMatch
    ?mimeMatch[1]
    :"image/jpeg";

  const binary=
    atob(data);

  const bytes=
    new Uint8Array(
      binary.length
    );

  for(
    let i=0;
    i<binary.length;
    i++
  ){

    bytes[i]=
      binary.charCodeAt(i);

  }

  return new Blob(
    [bytes],
    {
      type:mime
    }
  );

}


function resizeImg(
  file,
  maxWidth=700,
  quality=.70
){

  return new Promise(
    (resolve,reject)=>{

      const reader=
        new FileReader();

      reader.onload=
        event=>{

          const img=
            new Image();

          img.onload=()=>{

            let width=
              img.width;

            let height=
              img.height;

            if(width>maxWidth){

              const ratio=
                maxWidth/width;

              width=
                maxWidth;

              height=
                Math.round(
                  height*ratio
                );

            }

            const canvas=
              document.createElement(
                "canvas"
              );

            canvas.width=
              width;

            canvas.height=
              height;

            const ctx=
              canvas.getContext("2d");

            if(!ctx){

              reject(
                new Error(
                  "Canvas desteklenmiyor"
                )
              );

              return;

            }

            ctx.drawImage(
              img,
              0,
              0,
              width,
              height
            );

            resolve(
              canvas.toDataURL(
                "image/webp",
                quality
              )
            );

          };

          img.onerror=()=>{

            reject(
              new Error(
                "Görsel okunamadı"
              )
            );

          };

          img.src=
            event.target.result;

        };

      reader.onerror=()=>{

        reject(
          new Error(
            "Dosya okunamadı"
          )
        );

      };

      reader.readAsDataURL(file);

    }
  );

}

async function uploadBlobToStorage(
  blob,
  path
){

  const result=
    await supabase.storage
    .from(STORAGE_BUCKET)
    .upload(
      path,
      blob,
      {
        contentType:
          "image/webp",

        cacheControl:
          "31536000",

        upsert:false
      }
    );

  if(result.error){
    throw result.error;
  }

  return(
    supabase.storage
    .from(STORAGE_BUCKET)
    .getPublicUrl(path)
    ?.data
    ?.publicUrl||
    null
  );

}

  const realtimeChannelRef=

  /* =======================================================
     DATA REF
  ======================================================= */

  useEffect(()=>{

  },[data]);


  /* =======================================================
     SELECTED PRODUCT REF
  ======================================================= */

          clearTimeout(

          );

        }

        toastTimerRef.current=
          setTimeout(
            ()=>setToast(""),
            2600
          );

      },
      []
    );


  /* =======================================================
     CLEANUP
  ======================================================= */

  useEffect(()=>{

    return()=>{

      if(toastTimerRef.current){

        clearTimeout(
          toastTimerRef.current
        );

      }

      if(logoLongPressTimerRef.current){

        clearTimeout(

        );

      }

      if(

          realtimeChannelRef.current
        );

      }

    };

  },[]);


  /* =======================================================
     CATEGORY
  ======================================================= */

  function toggleCategory(id){

        ...previous,

        [id]:
          !previous[id]

      })
    );

  }


  function openCategory(id){

    setOpenCategories(
      previous=>({

        ...previous,

        [id]:true

      })
    );

  }


  /* =======================================================
     LOAD
  ======================================================= */

  useEffect(()=>{

    let cancelled=false;

    async function load(){

      const started=
        performance.now();

      try{

        const result=
          await supabase
          .from("site_data")
          .select("data")
          .eq("id",SITE_ID)
          .maybeSingle();

        if(result.error){
          throw result.error;
        }

        let loaded;

        if(
          result.data &&
          result.data.data
        ){

          loaded=
            normalizeData(
              result.data.data
            );

        }
        else{

          loaded=
            defaultData();

          const insertResult=
            await supabase
            .from("site_data")
            .upsert(
              {
                id:SITE_ID,
                data:loaded,
                updated_at:
                  new Date().toISOString()
              },
              {
                onConflict:"id"
              }
            );

          if(insertResult.error){
            throw insertResult.error;
          }

        }

        if(cancelled){
          return;
        }

        const json=
          JSON.stringify(loaded);

        lastSavedJsonRef.current=
          json;

        savedSnapshotRef.current=
          json;

        dirtyRef.current=false;

        dataRef.current=
          loaded;

        setData(loaded);

        const first=
          loaded
          .stores
          ?.premium
          ?.categories
          ?.[0]
          ?.id||
          null;

        setActiveCat(first);


        /* =================================================
           REALTIME
        ================================================= */

        const channel=
          supabase
          .channel(
            "ofischi-site-"+SITE_ID
          )
          .on(
            "postgres_changes",
            {
              event:"UPDATE",
              schema:"public",
              table:"site_data",
              filter:
                "id=eq."+SITE_ID
            },
            payload=>{

              const incoming=
                payload?.new?.data;

              if(!incoming){
                return;
              }

              const incomingData=
                normalizeData(
                  incoming
                );

              const incomingJson=
                JSON.stringify(
                  incomingData
                );

              if(
                incomingJson===
                lastSavedJsonRef.current
              ){
                return;
              }

              if(
                dirtyRef.current
              ){
                return;
              }

              lastSavedJsonRef.current=
                incomingJson;

              savedSnapshotRef.current=
                incomingJson;

              dataRef.current=
                incomingData;

              setData(
                incomingData
              );

              setActiveCat(
                current=>{

                  const cats=
                    incomingData
                    .stores?.[store]
                    ?.categories||[];

                  if(
                    cats.some(
                      category=>
                        category.id===current
                    )
                  ){

                    return current;

                  }

                  return(
                    cats[0]?.id||
                    null
                  );

                }
              );

              const selectedId=
                selectedProductIdRef.current;

              if(selectedId){

                let found=null;

                Object.values(
                  incomingData.stores||{}
                ).forEach(
                  storeData=>{

                    (
                      storeData.categories||[]
                    ).forEach(
                      category=>{

                        const product=
                          (
                            category.items||[]
                          ).find(
                            item=>
                              item.id===
                              selectedId
                          );

                        if(product){
                          found=product;
                        }

                      }
                    );

                  }
                );

                setSelectedProduct(
                  found||null
                );

              }

            }
          )
          .subscribe(
            status=>{

              console.log(
                "Ofischi Realtime:",
                status
              );

            }
          );

        realtimeChannelRef.current=
          channel;

        console.log(
          "Ofischi yükleme:",
          Math.round(
            performance.now()-started
          )+"ms"
        );

      }
      catch(error){

        console.error(
          "VERİ OKUMA HATASI:",
          error
        );

        const fallback=
          defaultData();

        dataRef.current=
          fallback;

        savedSnapshotRef.current=
          JSON.stringify(
            fallback
          );

        lastSavedJsonRef.current=
          JSON.stringify(
            fallback
          );

        dirtyRef.current=false;

        setData(fallback);

        setActiveCat(
          fallback
          .stores
          .premium
          .categories
          ?.[0]
          ?.id||
          null
        );

        showToast(
          "Veritabanı bağlantısı kontrol edilmeli"
        );

      }
      finally{

        if(!cancelled){

          setLoading(false);

        }

      }

    }

    load();

    return()=>{

      cancelled=true;

      if(
        realtimeChannelRef.current
      ){

        supabase.removeChannel(
          realtimeChannelRef.current
        );

        realtimeChannelRef.current=
          null;

      }

    };

  ======================================================= */

  function getCurrency(){

    return(
      CURRENCIES.find(
        item=>

            data?.currency?.selected||
            "TRY"
          )
      )||
      CURRENCIES[0]

  /* =======================================================
     CONVERT
  ======================================================= */

  function convertPrice(amount){

    if(
      amount===null||
      amount===undefined||
      amount===""
    ){
      return null;
    }

    const currency=
      data?.currency?.selected||
      "TRY";

    const numeric=
      Number(amount);

    if(!Number.isFinite(numeric)){
      return null;
    }

    if(currency==="USD"){

      const rate=
        Number(
          data?.currency?.usdRate
        );

      if(!rate||rate<=0){
        return null;
      }

      return numeric/rate;

    }

    if(currency==="EUR"){

      const rate=
        Number(
          data?.currency?.eurRate
        );

      if(!rate||rate<=0){
        return null;
      }

      return numeric/rate;

    }

    return numeric;

  }


  /* =======================================================
     FORMAT
  ======================================================= */

  function formatAmount(amount){

    const converted=
      convertPrice(amount);

    if(converted===null){
      return null;
    }

    const currency=
      getCurrency();

    const decimals=
      currency.id==="TRY"
      ?0
      :2;

    const formatted=
      converted.toLocaleString(
        "tr-TR",
        {
          minimumFractionDigits:
            decimals,

          maximumFractionDigits:
            decimals
        }
      );

    if(currency.id==="USD"){
      return "$"+formatted;
    }

    if(currency.id==="EUR"){
      return "€"+formatted;
    }

    return formatted+" ₺";

  }


  /* =======================================================
     PRODUCT TOTAL
  ======================================================= */

  function getProductTotal(item){

    const price=
      normalizePrice(
        item?.price
      );

    if(!price.parts.length){

      if(
        price.amount!==null&&
        price.amount!==undefined&&
        price.amount!==""
      ){

        const number=
          Number(price.amount);

        return Number.isFinite(number)
          ?number
          :null;

      }

      return null;

    }

    let total=0;

    let hasAmount=false;

    for(
      const part of price.parts
    ){

      if(
        part.contactOnly||
        part.amount===null||
        part.amount===undefined||
        part.amount===""
      ){
        continue;
      }

      const amount=
        Number(part.amount);

      if(Number.isFinite(amount)){

        total+=amount;
        hasAmount=true;

      }

    }

    return hasAmount
      ?total
      :null;

  }


  function productTotalText(item){

    const total=
      getProductTotal(item);

    if(total===null){
      return null;
    }

    return formatAmount(total);

  }


  /* =======================================================

  ======================================================= */

  const save=
    useCallback(
      async()=>{

        const current=
          dataRef.current;

        if(
          !current||
          saving||
          busy
        ){
          return;
        }

        if(!dirtyRef.current){

          setPanelOpen(false);

          return;

        }

        const clean=
          normalizeData(current);

        const cleanJson=
          JSON.stringify(clean);

        setSaving(true);

        try{

          const result=
            await supabase
            .from("site_data")
            .upsert(
              {
                id:SITE_ID,
                data:clean,
                updated_at:
                  new Date().toISOString()
              },
              {
                onConflict:"id"
              }
            );

          if(result.error){
            throw result.error;
          }

          lastSavedJsonRef.current=
            cleanJson;

          savedSnapshotRef.current=
            cleanJson;

          dataRef.current=
            clean;

          dirtyRef.current=false;

          setData(clean);

          setSaved(true);

          showToast(
            "Başarıyla kaydedildi"
          );

          setTimeout(()=>{

            setSaved(false);

            setPanelOpen(false);

          },550);

        }
        catch(error){

          console.error(
            "KAYDETME HATASI:",
            error
          );

          showToast(
            "Kaydetme hatası"
          );

        }
        finally{

          setSaving(false);

        }

      },
      [
        saving,
        busy,
        showToast
      ]
    );

                                          </div>


                                          <label
                                            className="flex items-center gap-2 mt-2 text-[10px] text-neutral-400"
                                          >

                                            <input
                                              type="checkbox"

                                              checked={
                                                !!part.contactOnly
                                              }

                                              onChange={e=>
                                                updatePricePart(
                                                  category.id,
                                                  item.id,
                                                  part.id,
                                                  "contactOnly",
                                                  e.target.checked
                                                )
                                              }
                                            />

                                            Fiyat için iletişime geçin

                                          </label>

                                        </div>

                                      )
                                    )}


                                    {/* TOTAL PREVIEW */}

                                    {productTotalText(item)&&(

                                      <div
                                        className="mt-2 rounded-lg px-3 py-2 flex items-center justify-between"

                                        style={{

                                          background:
                                            theme.accent+"12",

                                          animation:
                                            "pop .25s ease both"

                                        }}
                                      >

                                        <span
                                          className="text-[10px] opacity-50"
                                        >
                                          Toplam
                                        </span>


                                        <strong
                                          className="text-sm"

                                          style={{
                                            color:
                                              theme.accent
                                          }}
                                        >
                                          {productTotalText(item)}
                                        </strong>

                                      </div>

                                    )}

                                  </div>


                                  <div
                                    className="flex justify-end gap-1"
                                  >

                                    {item.image&&(

                                      <button
                                        onClick={()=>
                                          updateItem(
                                            category.id,
                                            item.id,
                                            "image",
                                            null
                                          )
                                        }

                                        className="liquid-button px-2 py-1 bg-neutral-700 rounded text-[10px]"
                                      >
                                        Görseli Sil
                                      </button>

                                    )}


                                    <button
                                      onClick={()=>
                                        moveItem(
                                          category.id,
                                          item.id,
                                          -1
                                        )
                                      }

                                      disabled={
                                        itemIndex===0
                                      }

                                      className="liquid-button p-1.5 bg-neutral-700 rounded disabled:opacity-20"
                                    >

                                      <Icon
                                        type="up"
                                        size={12}
                                      />

                                    </button>


                                    <button
                                      onClick={()=>
                                        moveItem(
                                          category.id,
                                          item.id,
                                          1
                                        )
                                      }

                                      disabled={
                                        itemIndex===
                                        category.items.length-1
                                      }

                                      className="liquid-button p-1.5 bg-neutral-700 rounded disabled:opacity-20"
                                    >

                                      <Icon
                                        type="down"
                                        size={12}
                                      />

                                    </button>


                                    <button
                                      onClick={()=>
                                        deleteItem(
                                          category.id,
                                          item.id
                                        )
                                      }

                                      className="liquid-button p-1.5 bg-red-950 text-red-400 rounded"
                                    >

                                      <Icon
                                        type="trash"
                                        size={12}
                                      />

                                    </button>

                                  </div>

                                </div>

                              )
                            )}


                            <button
                              onClick={()=>
                                addItem(
                                  category.id
                                )
                              }

                              className="liquid-button w-full py-2.5 bg-neutral-700 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5"
                            >

                              <Icon
                                type="plus"
                                size={14}
                              />

                              Ürün Ekle

                            </button>


                          </div>

                        )}

                      </div>

                    )
                  )}

                </div>

              )}

            </div>


            {/* =================================================
                SAVE BAR
            ================================================= */}

            <div
              className="sticky bottom-0 p-4"

              style={{

                background:
                  "rgba(10,10,12,.88)",

                borderTop:
                  "1px solid rgba(255,255,255,.08)",

                backdropFilter:
                  "blur(20px)",

                WebkitBackdropFilter:
                  "blur(20px)"

              }}
            >

              <div
                className="flex items-center justify-center mb-2 h-4"
              >

                {dirtyRef.current&&!saving&&(

                  <span
                    className="text-[10px] text-amber-400"
                  >
                    Kaydedilmemiş değişiklikler var
                  </span>

                )}

                {saving&&(

                  <span
                    className="text-[10px] text-neutral-400"
                  >
                    Kaydediliyor...
                  </span>

                )}

                {!dirtyRef.current&&saved&&(

                  <span
                    className="text-[10px]"
                    style={{
                      color:"#12B76A"
                    }}
                  >
                    ✓ Kaydedildi
                  </span>

                )}

              </div>


              <button
                onClick={save}

                disabled={
                  saving||
                  busy
                }

                className="liquid-button w-full py-3.5 rounded-xl text-sm font-bold text-white flex items-center justify-center gap-2 disabled:opacity-50"

                style={{

                  background:
                    saved
                    ?" #12B76A"
                    :theme.accent,

                  boxShadow:
                    saved
                    ?"0 8px 25px rgba(18,183,106,.20)"
                    :`0 8px 25px ${theme.accent}32`

                }}
              >

                {saved?(

                  <Icon
                    type="check"
                    size={17}
                  />

                ):(

                  <Icon
                    type="save"
                    size={17}
                  />

                )}


                {saved
                  ?"Kaydedildi!"
                  :saving
                  ?"Kaydediliyor..."
                  :"Kaydet ve Kapat"}

              </button>


              <div
                className="text-center text-[9px] text-neutral-600 mt-2"
              >
                Kaydetmeden paneli kapatırsan yaptığın değişiklikler iptal edilir.
              </div>

            </div>


          </aside>

        </div>

      )}

    </div>

  );

}


/* =========================================================
   ADMIN LABEL
========================================================= */

function AdminLabel({
  children
}){

  return(

    <div
      style={{

        color:"#737373",

        fontSize:"10px",

        fontWeight:700,

        letterSpacing:".08em",

        textTransform:
          "uppercase",

        marginBottom:"6px"

      }}
    >
      {children}
    </div>

  );

}


/* =========================================================
   COLOR
========================================================= */

function ColorInput({
  label,
  value,
  onChange
}){

  return(

    <label
      className="flex items-center justify-between mb-3"
    >

      <span
        className="text-xs text-neutral-400"
      >
        {label}
      </span>


      <input
        type="color"

        value={
          value||
          "#000000"
        }

        onChange={e=>
          onChange(
            e.target.value
          )
        }

        className="w-9 h-9 rounded-lg border border-neutral-700 bg-transparent cursor-pointer"
      />

    </label>

  );

}


/* =========================================================
   START
========================================================= */

const root=
  document.getElementById("root");

if(root){

  ReactDOM
  .createRoot(root)
  .render(
    <App/>
  );

}

</script>

</body>
</html>
