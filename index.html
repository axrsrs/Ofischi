function normalizeData(input) {

/* =========================================================
   BASE64 → BLOB
   ========================================================= */

function dataUrlToBlob(
  dataUrl
) {

  const parts =
    dataUrl.split(",");

  const meta =
    parts[0] || "";

  const data =
    parts[1] || "";

  const mimeMatch =
    meta.match(
      /data:([^;]+)/
    );

  const mime =
    mimeMatch
      ? mimeMatch[1]
      : "image/jpeg";

  const binary =
    atob(data);

  const len =
    binary.length;

  const bytes =
    new Uint8Array(len);

  for (
    let i = 0;
    i < len;
    i++
  ) {

    bytes[i] =
      binary.charCodeAt(i);

  }

  return new Blob(
    [bytes],
    {
      type: mime
    }
  );

}


/* =========================================================
   GÖRSEL SIKIŞTIRME
   ========================================================= */

function resizeImg(
  file,
  maxWidth = 1000,
  quality = 0.78
) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload =
        (event) => {

          const img =
            new Image();

          img.onload =
            () => {

              let width =
                img.width;

              let height =
                img.height;


              if (
                width >
                maxWidth
              ) {

                height =
                  Math.round(
                    height *
                    (
                      maxWidth /
                      width
                    )
                  );

                width =
                  maxWidth;

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d",
                  {
                    alpha: false
                  }
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  quality
                )
              );

            };


          img.onerror =
            reject;


          img.src =
            event.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}

/* =========================================================
   STORAGE'A YÜKLE
   ========================================================= */

async function uploadBlobToStorage(
  blob,
  path
) {

  const result =
    await supabase.storage
      .from(
        STORAGE_BUCKET
      )
      .upload(
        path,
        blob,
        {
          contentType:
            "image/jpeg",

          cacheControl:
            "31536000",

          upsert:
            false
        }
      );


  if (result.error) {
    throw result.error;
  }


  const publicResult =
    supabase.storage
      .from(
        STORAGE_BUCKET
      )
      .getPublicUrl(
        path
      );


  return (
    publicResult
      ?.data
      ?.publicUrl ||
    null
  );

}

function isRemoteImage(
  value
) {

  if (
    typeof value !== "string"
  ) {

    return false;

  }


  return (
    value.startsWith(
      "http://"
    ) ||
    value.startsWith(
      "https://"
    ) ||
    value.startsWith(
      "/"
    ) ||
    value.startsWith(
      "./"
    )
  );

}


/* =========================================================
   ESKİ BASE64 FOTOĞRAFLARI STORAGE'A TAŞI
   ========================================================= */

async function migrateOldImages(
  originalData,
  onProgress
) {

  const copy =
    normalizeData(
      originalData
    );


  const tasks = [];


  if (
    typeof copy.logo?.src ===
      "string" &&
    copy.logo.src.startsWith(
      "data:image/"
    )
  ) {

    tasks.push({
      type: "logo",
      id: "logo",
      value:
        copy.logo.src
    });

  }


  if (
    typeof copy.theme?.bgImage ===
      "string" &&
    copy.theme.bgImage.startsWith(
      "data:image/"
    )
  ) {

    tasks.push({
      type: "background",
      id: "background",
      value:
        copy.theme.bgImage
    });

  }


  copy.categories.forEach(
    (category) => {

      category.items.forEach(
        (item) => {

          if (
            typeof item.image ===
              "string" &&
            item.image.startsWith(
              "data:image/"
            )
          ) {

            tasks.push({
              type: "product",
              id: item.id,
              value:
                item.image,
              categoryId:
                category.id
            });

          }

        }
      );

    }
  );


  if (
    tasks.length === 0
  ) {

    return {
      data: copy,
      migrated: 0
    };

  }


  let completed = 0;


  /*
   * Aynı anda en fazla 3 fotoğraf.
   * Böylece telefon ve bağlantı boğulmaz.
   */

  const concurrency = 3;


  async function worker() {

    while (true) {

      const task =
        tasks.shift();

      if (!task) {
        break;
      }


      try {

        const blob =
          dataUrlToBlob(
            task.value
          );


        const path =
          storagePath(
            task.type,
            task.id
          );


        const url =
          await uploadBlobToStorage(
            blob,
            path
          );


        if (task.type === "logo") {

          copy.logo.src =
            url;

        }


        else if (
          task.type ===
          "background"
        ) {

          copy.theme.bgImage =
            url;

        }


        else {

          const category =
            copy.categories.find(
              (x) =>
                x.id ===
                task.categoryId
            );


          const item =
            category?.items.find(
              (x) =>
                x.id ===
                task.id
            );


          if (item) {

            item.image =
              url;

          }

        }


        completed++;


        if (onProgress) {

          onProgress(
            completed,
            completed +
              tasks.length
          );

        }

      } catch (error) {

        console.error(
          "Fotoğraf taşıma hatası:",
          error
        );

      }

    }

  }


  await Promise.all(
    Array.from(
      {
        length:
          Math.min(
            concurrency,
            tasks.length
          )
      },
      worker
    )
  );


  return {
    data: copy,
    migrated: completed
  };

}


/* =========================================================
   FİYAT
   ========================================================= */

function formatPrice(
  price,
  currency,
  rates,
  lang
) {

  if (
    !price ||
    price.contactOnly ||
    price.amount === null ||
    price.amount === "" ||
    price.amount === undefined
  ) {

    return (
      CONTACT[lang] ||
      CONTACT.tr
    );

  }


  let amount =
    Number(
      price.amount
    );


  if (
    currency === "usd"
  ) {

    amount =
      amount /
      (
        Number(
          rates.usd
        ) || 1
      );

  }


  if (
    currency === "eur"
  ) {

    amount =
      amount /
      (
        Number(
          rates.eur
        ) || 1
      );

  }


  const current =
    CURR.find(
      (x) =>
        x.c === currency
    ) ||
    CURR[0];


  const decimals =
    currency === "try"
      ? 0
      : 2;


  return (
    current.s +
    amount.toLocaleString(
      "tr-TR",
      {
        minimumFractionDigits:
          decimals,

        maximumFractionDigits:
          decimals
      }
    )
  );

}

  /* =======================================================
     SUPABASE'DEN VERİ OKU
     ======================================================= */

  useEffect(
    () => {

      let cancelled =
        false;


      async function loadData() {

        try {

          const result =
            await supabase
              .from("site_data")
              .select(
                "data"
              )
              .eq(
                "id",
                SITE_ID
              )
              .maybeSingle();


          if (
            result.error
          ) {

            throw result.error;

          }


          let loadedData;


          if (
            result.data &&
            result.data.data
          ) {

            loadedData =
              normalizeData(
                result.data.data
              );

          } else {

            loadedData =
              defaultData();


            const insert =
              await supabase
                .from(
                  "site_data"
                )
                .insert({
                  id:
                    SITE_ID,

                  data:
                    loadedData,

                  updated_at:
                    new Date()
                      .toISOString()
                });


            if (
              insert.error &&
              insert.error.code !==
                "23505"
            ) {

              console.error(
                "İlk veri oluşturulamadı:",
                insert.error
              );

            }

          }


          if (cancelled) {
            return;
          }


          setData(
            loadedData
          );


          setActiveCat(
            loadedData
              .categories?.[0]?.id ||
            null
          );


          /*
           * Eski Base64 fotoğrafları
           * arka planda Storage'a taşı.
           */

          const hasOldImages =
            containsBase64Images(
              loadedData
            );


          if (
            hasOldImages
          ) {

            setMigration({
              active: true,
              current: 0,
              total: countBase64Images(
                loadedData
              )
            });


            try {

              const migrated =
                await migrateOldImages(
                  loadedData,
                  (
                    current,
                    total
                  ) => {

                    if (
                      cancelled
                    ) {
                      return;
                    }

                    setMigration({
                      active: true,
                      current,
                      total
                    });

                  }
                );


              if (
                cancelled
              ) {
                return;
              }


              setData(
                migrated.data
              );


              if (
                migrated.migrated >
                0
              ) {

                /*
                 * Fotoğraflar Storage'a taşındı.
                 * Artık sadece URL'leri kaydediyoruz.
                 */

                const result =
                  await supabase
                    .from(
                      "site_data"
                    )
                    .upsert(
                      {
                        id:
                          SITE_ID,

                        data:
                          migrated.data,

                        updated_at:
                          new Date()
                            .toISOString()
                      },
                      {
                        onConflict:
                          "id"
                      }
                    );


                if (
                  result.error
                ) {

                  console.error(
                    "Fotoğraf taşıma kaydı:",
                    result.error
                  );

                  showToast(
                    "Fotoğraflar taşındı fakat kayıt tamamlanamadı."
                  );

                } else {

                  showToast(
                    migrated.migrated +
                    " fotoğraf optimize edildi"
                  );

                }

              }

            } catch (migrationError) {

              console.error(
                "Fotoğraf migrasyon hatası:",
                migrationError
              );

              showToast(
                "Eski fotoğrafların optimizasyonunda hata oluştu."
              );

            } finally {

              if (
                !cancelled
              ) {

                setMigration({
                  active: false,
                  current: 0,
                  total: 0
                });

              }

            }

          }


        } catch (error) {

          console.error(
            "SUPABASE OKUMA HATASI:",
            error
          );


          if (
            cancelled
          ) {
            return;
          }


          const fallback =
            defaultData();


          setData(
            fallback
          );


          setActiveCat(
            fallback
              .categories?.[0]?.id ||
            null
          );


          showToast(
            "Veritabanı bağlantısı kontrol edilmeli"
          );

        } finally {

          if (
            !cancelled
          ) {

            setLoading(
              false
            );

          }

        }

      }


      loadData();


      return () => {

        cancelled =
          true;

      };

    },
    []
  );


  /* =======================================================
     BASE64 KONTROL
     ======================================================= */

  function countBase64Images(
    source
  ) {

    let count = 0;


    if (
      source?.logo?.src
        ?.startsWith(
          "data:image/"
        )
    ) {

      count++;

    }


    if (
      source?.theme?.bgImage
        ?.startsWith(
          "data:image/"
        )
    ) {

      count++;

    }


    source?.categories?.forEach(
      (category) => {

        category.items?.forEach(
          (item) => {

            if (
              item.image
                ?.startsWith(
                  "data:image/"
                )
            ) {

              count++;

            }

          }
        );

      }
    );


    return count;

  }


  function containsBase64Images(
    source
  ) {

    return (
      countBase64Images(
        source
      ) > 0
    );

  }


  /* =======================================================
     VERİ DEĞİŞTİR
     ======================================================= */

  function updateData(
    callback
  ) {

    setData(
      (previous) => {

        if (!previous) {
          return previous;
        }


        /*
         * Eskiden structuredClone bütün
         * katalogu her tuşta kopyalıyordu.
         *
         * Artık sadece callback'e verilen
         * veriyi kontrollü şekilde değiştiriyoruz.
         *
         * Fotoğraflar URL olduğu için veri
         * zaten çok küçük kalacak.
         */

        const copy = {
          ...previous
        };


        callback(
          copy
        );


        return copy;

      }
    );

  }


  function setPath(
    path,
    value
  ) {

    updateData(
      (copy) => {

        let target =
          copy;


        for (
          let i = 0;
          i <
            path.length - 1;
          i++
        ) {

          const key =
            path[i];


          target[key] = {
            ...(target[key] || {})
          };


          target =
            target[key];

        }


        target[
          path[
            path.length - 1
          ]
        ] = value;

      }
    );

  }


  /* =======================================================
     KAYDET
     ======================================================= */

  async function save() {

    if (
      !data ||
      saving
    ) {

      return;

    }


    setSaving(
      true
    );


    try {

      /*
       * ÖNEMLİ:
       *
       * Artık kaydetmeden önce Supabase'den
       * mevcut veriyi tekrar çekmiyoruz.
       *
       * Bu eski sistemdeki en büyük
       * yavaşlık kaynaklarından biriydi.
       */


      const dataToSave =
        normalizeData(
          data
        );


      /*
       * Eğer hâlâ yanlışlıkla Base64 kaldıysa
       * kaydetmeden önce durdur.
       */

      if (
        containsBase64Images(
          dataToSave
        )
      ) {

        throw new Error(
          "Fotoğraflar hâlâ optimize ediliyor. Birkaç saniye sonra tekrar deneyin."
        );

      }


      const result =
        await supabase
          .from(
            "site_data"
          )
          .upsert(
            {
              id:
                SITE_ID,

              data:
                dataToSave,

              updated_at:
                new Date()
                  .toISOString()
            },
            {
              onConflict:
                "id"
            }
          );


      if (
        result.error
      ) {

        throw result.error;

      }


      setData(
        dataToSave
      );


      setSaved(
        true
      );


      showToast(
        "Başarıyla kaydedildi"
      );


      setTimeout(
        () => {

          setSaved(
            false
          );

          setPanelOpen(
            false
          );

        },
        900
      );


    } catch (error) {

      console.error(
        "SUPABASE KAYDETME HATASI:",
        error
      );


      showToast(
        "Kaydetme hatası: " +
        (
          error?.message ||
          "Supabase bağlantısı"
        )
      );


    } finally {

      setSaving(
        false
      );

    }

  }

  /* =======================================================
     KATEGORİ SIRALA
     ======================================================= */

  function moveCategory(
    id,
    direction
  ) {

    updateData(
      (copy) => {

        const list =
          [
            ...copy.categories
          ];


        const index =
          list.findIndex(
            (category) =>
              category.id ===
              id
          );


        const target =
          index +
          direction;


        if (
          index < 0 ||
          target < 0 ||
          target >= list.length
        ) {

          return;

        }


        [
          list[index],
          list[target]
        ] = [
          list[target],
          list[index]
        ];


        copy.categories =
          list;

      }
    );

  }

  ) {

      (copy) => {

            (category) => {

              if (
                category.id !==
                categoryId

              const index =

                list[target]
              ] = [
                list[target],
                list[index]
              ];


              return {

                ...category,

                items:
                  list

              };

            }
          );

      }
    );

  /* =======================================================

  async function uploadLogo(
    event
  ) {

    const file =
      event.target.files?.[0];


    if (!file) {
      return;
    }


    setBusy(
      true
    );


    try {

      const compressed =
        await resizeImg(
          file,
          700,
          0.88
        );


      const blob =
        dataUrlToBlob(
          compressed
        );


      const path =
        storagePath(
          "logo",
          "logo"
        );


      const url =
        await uploadBlobToStorage(
          blob,
          path
        );


      setPath(
        [
          "logo",
          "src"
        ],
        url
      );


      showToast(
        "Logo eklendi. Kaydet'e basın."

      console.error(
        error

      showToast(

                      Hazır Temalar
                    </div>


                    <div
                      className="grid grid-cols-3 gap-2 mb-5"
                    >

                      {THEMES.map(
                        (theme) => (

                          <button
                            key={
                              theme.id
                            }

                            onClick={() =>
                              applyTheme(
                                theme
                              )
                            }

                            className="rounded-xl overflow-hidden border-2"

                            style={{

                              borderColor:
                                data.theme.bg ===
                                  theme.bg &&
                                data.theme.accent ===
                                  theme.accent
                                  ?
                                  theme.accent
                                  :
                                  "#292524"

                            }}
                          >

                            <div
                              style={{

                                height:
                                  35,

                                backgroundColor:
                                  theme.bg,

                                display:
                                  "flex",

                                alignItems:
                                  "center",

                                justifyContent:
                                  "center"

                              }}
                            >

                              <span
                                style={{

                                  width:
                                    15,

                                  height:
                                    15,

                                  borderRadius:
                                    "50%",

                                  backgroundColor:
                                    theme.accent

                                }}
                              />

                            </div>


                            <div
                              className="bg-neutral-900 py-1 text-[9px]"
                            >
                              {
                                theme.name
                              }
                            </div>

                          </button>

                        )
                      )}

                    </div>


                    {/* RENKLER */}

                    <ColorInput
                      label="Arka Plan Rengi"

                      value={
                        data.theme.bg
                      }

                      onChange={
                        (value) =>
                          setPath(
                            [
                              "theme",
                              "bg"
                            ],
                            value
                          )
                      }
                    />


                    <ColorInput
                      label="Kart Rengi"

                      value={
                        data.theme.card
                      }

                      onChange={
                        (value) =>
                          setPath(
                            [
                              "theme",
                              "card"
                            ],
                            value
                          )
                      }
                    />


                    <ColorInput
                      label="Vurgu Rengi"

                      value={
                        data.theme.accent
                      }

                      onChange={
                        (value) =>
                          setPath(
                            [
                              "theme",
                              "accent"
                            ],
                            value
                          )
                      }
                    />


                    <ColorInput
                      label="Yazı Rengi"

                      value={
                        data.theme.text
                      }

                      onChange={
                        (value) =>
                          setPath(
                            [
                              "theme",
                              "text"
                            ],
                            value
                          )
                      }
                    />


                    <div
                      className="flex gap-2 mb-5"
                    >

                      <button
                        disabled={
                          busy
                        }

                        onClick={() =>
                          bgRef.current?.click()
                        }

                        className="flex-1 py-2.5 bg-neutral-900 border border-neutral-700 rounded-lg text-xs flex items-center justify-center gap-1.5 disabled:opacity-40"
                      >

                        <Icon
                          type="upload"
                          size={14}
                        />

                        {
                          busy
                            ?
                            "Yükleniyor..."
                            :
                            "Arka Plan Görseli"
                        }

                      </button>


                      {data.theme.bgImage && (

                        <button
                          onClick={() =>
                            setPath(
                              [
                                "theme",
                                "bgImage"
                              ],
                              null
                            )
                          }

                          className="px-3 bg-red-950 text-red-400 rounded-lg"
                        >

                          <Icon
                            type="trash"
                            size={14}
                          />

                        </button>

                      )}


                      <input
                        ref={
                          bgRef
                        }

                        type="file"

                        accept="image/*"

                        className="hidden"

                        onChange={
                          uploadBackground
                        }
                      />

                    </div>


                    <label
                      className="block mb-4"
                    >

                      <AdminLabel>
                        Ürün Görsel Yüksekliği —{" "}
                        {
                          data.cardImgSize
                        }px
                      </AdminLabel>


                      <input
                        type="range"

                        min="90"

                        max="300"

                        value={
                          data.cardImgSize
                        }

                        onChange={
                          (event) =>
                            setPath(
                              [
                                "cardImgSize"
                              ],
                              Number(
                                event.target.value
                              )
                            )
                        }

                        className="w-full"
                      />

                    </label>


                    <label
                      className="block mb-5"
                    >

                      <AdminLabel>
                        Yönetim PIN
                      </AdminLabel>


                      <input
                        className="admin-input"

                        value={
                          data.pin ||
                          ""
                        }

                        inputMode="numeric"

                        maxLength={8}

                        onChange={
                          (event) =>
                            setPath(
                              [
                                "pin"
                              ],
                              event.target.value.replace(
                                /\D/g,
                                ""
                              )
                            )
                        }

                        style={{
                          letterSpacing:
                            ".3em"
                        }}
                      />

                    </label>


                    <button
                      onClick={
                        resetDefault
                      }

                      className="w-full py-2.5 bg-neutral-900 border border-neutral-700 rounded-lg text-xs text-neutral-400"
                    >
                      Varsayılan Ayarlara Dön
                    </button>

                  </div>

                )}


                {/* =========================================
                    ÜRÜN KATALOĞU
                ========================================= */}

                {tab ===
                  "icerik" && (

                  <div>

                    <button
                      onClick={
                        addCategory
                      }

                      className="w-full py-3 rounded-xl text-sm font-bold text-white mb-4 flex items-center justify-center gap-2"

                      style={{
                        backgroundColor:
                          data.theme.accent
                      }}
                    >

                      <Icon
                        type="plus"
                        size={17}
                      />

                      Yeni Kategori

                    </button>


                    {data.categories.map(
                      (
                        category,
                        categoryIndex
                      ) => (

                        <div
                          key={
                            category.id
                          }

                          className="bg-neutral-900 border border-neutral-800 rounded-xl mb-3 overflow-hidden"
                        >

                          <div
                            className="p-2 flex items-center gap-1.5"
                          >

                            <input
                              value={
                                category.name[
                                  editLang
                                ] ||
                                ""
                              }

                              onChange={
                                (event) =>
                                  renameCategory(
                                    category.id,
                                    event.target.value
                                  )
                              }

                              className="admin-input"

                              style={{
                                padding:
                                  "9px 10px",

                                fontSize:
                                  "13px"
                              }}
                            />


                            <button
                              onClick={() =>
                                moveCategory(
                                  category.id,
                                  -1
                                )
                              }

                              disabled={
                                categoryIndex ===
                                0
                              }

                              className="p-2 bg-neutral-800 rounded-lg disabled:opacity-20"
                            >

                              <Icon
                                type="up"
                                size={14}
                              />

                            </button>


                            <button
                              onClick={() =>
                                moveCategory(
                                  category.id,
                                  1
                                )
                              }

                              disabled={
                                categoryIndex ===
                                data.categories.length -
                                  1
                              }

                              className="p-2 bg-neutral-800 rounded-lg disabled:opacity-20"
                            >

                              <Icon
                                type="down"
                                size={14}
                              />

                            </button>


                            <button
                              onClick={() =>
                                deleteCategory(
                                  category.id
                                )
                              }

                              className="p-2 bg-red-950 text-red-400 rounded-lg"
                            >

                              <Icon
                                type="trash"
                                size={14}
                              />

                            </button>


                            <button
                              onClick={() =>
                                setOpenCat(
                                  openCat ===
                                    category.id
                                    ?
                                    null
                                    :
                                    category.id
                                )
                              }

                              className="px-2.5 py-2 bg-neutral-800 rounded-lg text-[11px] whitespace-nowrap"
                            >

                              {
                                openCat ===
                                  category.id
                                  ?
                                  "Kapat"
                                  :
                                  "Ürünler"
                              }

                            </button>

                          </div>


                          {openCat ===
                            category.id && (

                            <div
                              className="p-2 pt-0"
                            >

                              {category.items.map(
                                (
                                  item,
                                  itemIndex
                                ) => (

                                  <div
                                    key={
                                      item.id
                                    }

                                    className="bg-neutral-800 rounded-xl p-3 mb-2"
                                  >

                                    <div
                                      className="flex gap-2 mb-2"
                                    >

                                      <div
                                        onClick={() =>
                                          itemRefs.current[
                                            item.id
                                          ]?.click()
                                        }

                                        className="w-16 h-16 rounded-lg bg-neutral-700 flex-shrink-0 overflow-hidden flex items-center justify-center cursor-pointer"

                                        style={{

                                          backgroundImage:
                                            item.image
                                              ?
                                              `url(${item.image})`
                                              :
                                              undefined,

                                          backgroundSize:
                                            "cover",

                                          backgroundPosition:
                                            "center"

                                        }}
                                      >

                                        {!item.image && (

                                          <Icon
                                            type="image"
                                            size={18}
                                          />

                                        )}

                                      </div>


                                      <input
                                        type="file"

                                        accept="image/*"

                                        className="hidden"

                                        ref={
                                          (element) => {

                                            itemRefs.current[
                                              item.id
                                            ] =
                                              element;

                                          }
                                        }

                                        onChange={
                                          (event) =>
                                            uploadItemImage(
                                              category.id,
                                              item.id,
                                              event
                                            )
                                        }
                                      />


                                      <div
                                        className="flex-1"
                                      >

                                        <input
                                          value={
                                            item.name[
                                              editLang
                                            ] ||
                                            ""
                                          }

                                          onChange={
                                            (event) =>
                                              updateItem(
                                                category.id,
                                                item.id,
                                                "name",
                                                event.target.value
                                              )
                                          }

                                          placeholder="Ürün adı"

                                          className="admin-input"

                                          style={{

                                            padding:
                                              "8px 9px",

                                            fontSize:
                                              "12px",

                                            marginBottom:
                                              "6px"

                                          }}
                                        />


                                        <input
                                          value={
                                            item.dims ||
                                            ""
                                          }

                                          onChange={
                                            (event) =>
                                              updateItem(
                                                category.id,
                                                item.id,
                                                "dims",
                                                event.target.value
                                              )
                                          }

                                          placeholder="Ölçüler: 200x90x75 cm"

                                          className="admin-input"

                                          style={{

                                            padding:
                                              "8px 9px",

                                            fontSize:
                                              "12px"

                                          }}
                                        />

                                      </div>

                                    </div>


                                    <input
                                      value={
                                        item.desc[
                                          editLang
                                        ] ||
                                        ""
                                      }

                                      onChange={
                                        (event) =>
                                          updateItem(
                                            category.id,
                                            item.id,
                                            "desc",
                                            event.target.value
                                          )
                                      }

                                      placeholder="Ürün özellikleri"

                                      className="admin-input"

                                      style={{

                                        padding:
                                          "8px 9px",

                                        fontSize:
                                          "12px",

                                        marginBottom:
                                          "8px"

                                      }}
                                    />


                                    <div
                                      className="flex gap-2 items-center mb-2"
                                    >

                                      <input
                                        type="number"

                                        disabled={
                                          !!item.price.contactOnly
                                        }

                                        value={
                                          item.price.amount ??
                                          ""
                                        }

                                        onChange={
                                          (event) =>
                                            updatePrice(
                                              category.id,
                                              item.id,
                                              {
                                                amount:
                                                  event.target.value ===
                                                    ""
                                                    ?
                                                    null
                                                    :
                                                    Number(
                                                      event.target.value
                                                    )
                                              }
                                            )
                                        }

                                        placeholder="Fiyat TL"

                                        className="admin-input"

                                        style={{

                                          padding:
                                            "8px 9px",

                                          fontSize:
                                            "12px",

                                          opacity:
                                            item.price.contactOnly
                                              ?
                                              .4
                                              :
                                              1

                                        }}
                                      />


                                      <label
                                        className="flex items-center gap-1.5 text-[10px] text-neutral-400 whitespace-nowrap"
                                      >

                                        <input
                                          type="checkbox"

                                          checked={
                                            !!item.price.contactOnly
                                          }

                                          onChange={
                                            (event) =>
                                              updatePrice(
                                                category.id,
                                                item.id,
                                                {
                                                  contactOnly:
                                                    event.target.checked
                                                }
                                              )
                                          }
                                        />

                                        İletişime geçin

                                      </label>

                                    </div>


                                    <div
                                      className="flex justify-end gap-1"
                                    >

                                      {item.image && (

                                        <button
                                          onClick={() =>
                                            updateItem(
                                              category.id,
                                              item.id,
                                              "image",
                                              null
                                            )
                                          }

                                          className="px-2 py-1 bg-neutral-700 rounded text-[10px]"
                                        >
                                          Görseli Sil
                                        </button>

                                      )}


                                      <button
                                        onClick={() =>
                                          moveItem(
                                            category.id,
                                            item.id,
                                            -1
                                          )
                                        }

                                        disabled={
                                          itemIndex ===
                                          0
                                        }

                                        className="p-1.5 bg-neutral-700 rounded disabled:opacity-20"
                                      >

                                        <Icon
                                          type="up"
                                          size={12}
                                        />

                                      </button>


                                      <button
                                        onClick={() =>
                                          moveItem(
                                            category.id,
                                            item.id,
                                            1
                                          )
                                        }

                                        disabled={
                                          itemIndex ===
                                          category.items.length -
                                            1
                                        }

                                        className="p-1.5 bg-neutral-700 rounded disabled:opacity-20"
                                      >

                                        <Icon
                                          type="down"
                                          size={12}
                                        />

                                      </button>


                                      <button
                                        onClick={() =>
                                          deleteItem(
                                            category.id,
                                            item.id
                                          )
                                        }

                                        className="p-1.5 bg-red-950 text-red-400 rounded"
                                      >

                                        <Icon
                                          type="trash"
                                          size={12}
                                        />

                                      </button>

                                    </div>

                                  </div>

                                )
                              )}


                              <button
                                onClick={() =>
                                  addItem(
                                    category.id
                                  )
                                }

                                className="w-full py-2.5 bg-neutral-700 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5"
                              >

                                <Icon
                                  type="plus"
                                  size={14}
                                />

                                Ürün Ekle

                              </button>

                            </div>

                          )}

                        </div>

                      )
                    )}

                  </div>

                )}

              </div>


              {/* =================================================
                  KAYDET
              ================================================= */}

              <div
                className="sticky bottom-0 bg-neutral-950 border-t border-neutral-800 p-4"
              >

                <button
                  onClick={
                    save
                  }

                  disabled={
                    saving ||
                    busy ||
                    migration.active
                  }

                  className="w-full py-3.5 rounded-xl text-sm font-bold text-white flex items-center justify-center gap-2 disabled:opacity-50"

                  style={{

                    backgroundColor:
                      saved
                        ?
                        "#12B76A"
                        :
                        data.theme.accent,

                    animation:
                      saved
                        ?
                        "popSave .5s ease"
                        :
                        saving
                          ?
                          "none"
                          :
                          "pulseGlow 2.2s infinite"

                  }}
                >

                  {saved ? (

                    <Icon
                      type="check"
                      size={17}
                    />

                  ) : (

                    <Icon
                      type="save"
                      size={17}
                    />

                  )}


                  {saved
                    ?
                    "Kaydedildi!"
                    :
                    migration.active
                      ?
                      "Fotoğraflar hazırlanıyor..."
                      :
                      saving
                        ?
                        "Kaydediliyor..."
                        :
                        "Kaydet ve Kapat"
                  }

                </button>

              </div>

            </aside>

          </div>

        )}

    </div>

  );

}


/* =========================================================
   ADMİN LABEL
   ========================================================= */

function AdminLabel({
  children
}) {

  return (

    <div
      style={{

        color:
          "#737373",

        fontSize:
          "10px",

        fontWeight:
          700,

        letterSpacing:
          ".08em",

        textTransform:
          "uppercase",

        marginBottom:
          "6px"

      }}
    >
      {
        children
      }
    </div>

  );

}


/* =========================================================
   RENK INPUT
   ========================================================= */

function ColorInput({
  label,
  value,
  onChange
}) {

  return (

    <label
      className="flex items-center justify-between mb-3"
    >

      <span
        className="text-xs text-neutral-400"
      >
        {
          label
        }
      </span>


      <input
        type="color"

        value={
          value ||
          "#000000"
        }

        onChange={
          (event) =>
            onChange(
              event.target.value
            )
        }

        className="w-9 h-9 rounded-lg border border-neutral-700 bg-transparent cursor-pointer"
      />

    </label>

  );

}


/* =========================================================
   BAŞLAT
   ========================================================= */

ReactDOM
  .createRoot(
    document.getElementById(
      "root"
    )
  )
  .render(
    <App />
  );

</script>

</body>
</html>
