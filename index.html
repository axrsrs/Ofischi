function normalizePrice(price){

if(!price){
return{
contactOnly:true,
amount:null,
parts:[]
};
}

let parts=[];

if(Array.isArray(price.parts)){
parts=price.parts.map(p=>({
id:p.id||uid(),
name:typeof p.name==="string"?p.name:"Ürün",
amount:
p.amount===null||
p.amount===undefined||
p.amount===""
?null
:Number(p.amount),
contactOnly:!!p.contactOnly
}));
}

if(
parts.length===0&&
price.amount!==null&&
price.amount!==undefined&&
price.amount!==""
){
parts.push({
id:uid(),
name:"Ürün",
amount:Number(price.amount),
contactOnly:!!price.contactOnly
});
}

return{
contactOnly:
!!price.contactOnly&&
parts.length===0,

amount:
price.amount??null,

parts
};
}

function dataUrlToBlob(dataUrl){

const parts=dataUrl.split(",");
const meta=parts[0]||"";
const data=parts[1]||"";

const mimeMatch=meta.match(/data:([^;]+)/);

const mime=mimeMatch
?mimeMatch[1]
:"image/jpeg";

const binary=atob(data);

const bytes=new Uint8Array(binary.length);

for(let i=0;i<binary.length;i++){
bytes[i]=binary.charCodeAt(i);
}

return new Blob(
[bytes],
{type:mime}
);
}

function resizeImg(
file,
maxWidth=1000,
quality=.78
){

return new Promise(
(resolve,reject)=>{

const reader=new FileReader();

reader.onload=event=>{

const img=new Image();

img.onload=()=>{

let width=img.width;
let height=img.height;

if(width>maxWidth){

height=Math.round(
height*(maxWidth/width)
);

width=maxWidth;
}

const canvas=
document.createElement("canvas");

canvas.width=width;
canvas.height=height;

const ctx=canvas.getContext("2d");

ctx.drawImage(
img,
0,
0,
width,
height
);

resolve(
canvas.toDataURL(
"image/jpeg",
quality
)
);

};

img.onerror=reject;

img.src=event.target.result;

};

reader.onerror=reject;

reader.readAsDataURL(file);

}
);
}

function cycleCurrency(){

const current=
data?.currency?.selected||
"TRY";

const index=
CURRENCIES.findIndex(
item=>item.id===current
);

const next=
CURRENCIES[
(index+1)%CURRENCIES.length
];

setPath(
["currency","selected"],
next.id
);

}

function getCurrency(){

return(
CURRENCIES.find(
item=>
item.id===
(
data?.currency?.selected||
"TRY"
)
)||
CURRENCIES[0]
);

}

function convertPrice(amount){

if(
amount===null||
amount===undefined||
amount===""
){
return null;
}

const currency=
data?.currency?.selected||
"TRY";

const numeric=Number(amount);

if(!Number.isFinite(numeric)){
return null;
}

if(currency==="USD"){

const rate=
Number(
data?.currency?.usdRate
);

if(!rate||rate<=0){
return null;
}

return numeric/rate;

}

if(currency==="EUR"){

const rate=
Number(
data?.currency?.eurRate
);

if(!rate||rate<=0){
return null;
}

return numeric/rate;

}

return numeric;

}

function formatAmount(amount){

const converted=
convertPrice(amount);

if(converted===null){
return null;
}

const currency=
getCurrency();

const decimals=
currency.id==="TRY"
?0
:2;

const formatted=
converted.toLocaleString(
"tr-TR",
{
minimumFractionDigits:decimals,
maximumFractionDigits:decimals
}
);

if(currency.id==="USD"){
return "$"+formatted;
}

if(currency.id==="EUR"){
return "€"+formatted;
}

return formatted+" ₺";

}

async function uploadItemImage(
categoryId,
itemId,
event
){

const file=
event.target.files?.[0];

if(!file){
return;
}

setBusy(true);

try{

const compressed=
await resizeImg(
file,
1000,
.76
);

const blob=
dataUrlToBlob(
compressed
);

const path=
storagePath(
"products",
itemId
);

const url=
await uploadBlobToStorage(
blob,
path
);

updateItem(
categoryId,
itemId,
"image",
url
);

showToast(
"Görsel yüklendi. Kaydet'e basın."
);

}
catch(error){

console.error(error);

showToast(
"Görsel yüklenemedi."
);

}
finally{

setBusy(false);

if(event.target){
event.target.value="";
}

}

}
