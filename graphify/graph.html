  p.vx-=p.x*.004;p.vy-=p.y*.004}
 edges.forEach(e=>{if(hidden.has(e.s.type)||hidden.has(e.t.type))return;let dx=e.t.x-e.s.x,dy=e.t.y-e.s.y;const d=Math.sqrt(dx*dx+dy*dy)||1;const f=(d-70)*.02;dx/=d;dy/=d;e.s.vx+=dx*f;e.s.vy+=dy*f;e.t.vx-=dx*f;e.t.vy-=dy*f});
 vis.forEach(n=>{if(n.fixed)return;n.vx*=.8;n.vy*=.8;n.x+=n.vx*alpha;n.y+=n.vy*alpha});
 alpha=Math.max(.05,alpha*.995);
}
function match(n){return !query||(n.label+' '+(n.desc||'')+' '+(n.file||'')).toLowerCase().includes(query)}
function nb(n){const s=new Set([n.id]);edges.forEach(e=>{if(e.s===n)s.add(e.t.id);if(e.t===n)s.add(e.s.id)});return s}
function draw(){
 cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);
 cx.translate(W/2+cam.x,H/2+cam.y);cx.scale(cam.k,cam.k);
 const focus=sel?nb(sel):null;
 edges.forEach(e=>{if(hidden.has(e.s.type)||hidden.has(e.t.type))return;
  const on=!focus||(focus.has(e.s.id)&&focus.has(e.t.id)&&(e.s===sel||e.t===sel));
  cx.strokeStyle=on?(sel?'rgba(212,175,55,.8)':'rgba(255,255,255,.16)'):'rgba(255,255,255,.04)';cx.lineWidth=on&&sel?1.5/cam.k:1/cam.k;
  cx.beginPath();cx.moveTo(e.s.x,e.s.y);cx.lineTo(e.t.x,e.t.y);cx.stroke()});
 nodes.forEach(n=>{if(hidden.has(n.type))return;
  const dim=(focus&&!focus.has(n.id))||!match(n);
  cx.globalAlpha=dim?.15:1;cx.fillStyle=tcol[n.type];
  cx.beginPath();cx.arc(n.x,n.y,r(n),0,7);cx.fill();
  if(n===sel){cx.strokeStyle='#fff';cx.lineWidth=2/cam.k;cx.stroke()}
  if(!dim&&(n.kind==='hub'||cam.k>1.3||n===sel||(query&&match(n))||(focus&&focus.has(n.id)))){
   cx.fillStyle='#f3efe6';cx.font=(n.kind==='hub'?'600 12px':'11px')+' system-ui';cx.textAlign='center';cx.fillText(n.label,n.x,n.y+r(n)+12)}
 });cx.globalAlpha=1;
}
function loop(){tick();draw();requestAnimationFrame(loop)}
function toWorld(px,py){return{x:(px-W/2-cam.x)/cam.k,y:(py-H/2-cam.y)/cam.k}}
function pick(px,py){const w=toWorld(px,py);let best=null,bd=1e9;nodes.forEach(n=>{if(hidden.has(n.type))return;const d=Math.hypot(n.x-w.x,n.y-w.y);if(d<Math.max(r(n),12/cam.k)&&d<bd){bd=d;best=n}});return best}
let drag=null,pan=null,moved=false,pts=new Map(),pinch=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.offsetX,e.offsetY]);moved=false;
 if(pts.size===2){const [a,b]=[...pts.values()];pinch=Math.hypot(a[0]-b[0],a[1]-b[1]);drag=null;pan=null;return}
 const n=pick(e.offsetX,e.offsetY);if(n){drag=n;n.fixed=true}else pan={x:e.offsetX-cam.x,y:e.offsetY-cam.y}});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.offsetX,e.offsetY]);moved=true;
 if(pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch){cam.k=Math.min(4,Math.max(.2,cam.k*d/pinch))}pinch=d;return}
 if(drag){const w=toWorld(e.offsetX,e.offsetY);drag.x=w.x;drag.y=w.y;alpha=.5}else if(pan){cam.x=e.offsetX-pan.x;cam.y=e.offsetY-pan.y}});
cv.addEventListener('pointerup',e=>{pts.delete(e.pointerId);pinch=0;
 if(!moved){const n=pick(e.offsetX,e.offsetY);select(n)}
 if(drag){drag.fixed=false;drag=null}pan=null});
cv.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.12:.89;cam.k=Math.min(4,Math.max(.2,cam.k*f))},{passive:false});
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function select(n){sel=n;const el=document.getElementById('info');if(!n){el.classList.remove('on');return}
 const out=edges.filter(e=>e.s===n).map(e=>[e.t,e.rel,'→']),inn=edges.filter(e=>e.t===n).map(e=>[e.s,e.rel,'←']);
 const tn=TYPES.find(t=>t.id===n.type).name;
 let h='<h2>'+esc(n.label)+'</h2><div class="t">'+esc(tn)+(n.file?' · '+esc(n.file)+(n.line?':'+n.line:''):'')+'</div>';
 if(n.desc)h+='<p>'+esc(n.desc)+'</p>';
 const list=(a,t)=>a.length?'<b>'+t+' ('+a.length+')</b><ul>'+a.map(([m,rel,ar],i)=>'<li data-id="'+esc(m.id)+'">'+ar+' '+esc(m.label)+' <small>'+esc(rel||'')+'</small></li>').join('')+'</ul>':'';
 h+=list(out,'Kullandıkları')+list(inn,'Kullananlar');
 document.getElementById('ib').innerHTML=h;el.classList.add('on');
 el.querySelectorAll('li').forEach(li=>li.onclick=()=>{const m=byId[li.dataset.id];if(m){cam.x=-m.x*cam.k;cam.y=-m.y*cam.k;select(m)}})}
document.getElementById('close').onclick=()=>select(null);
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase()});
const chips=document.getElementById('chips');
TYPES.forEach(t=>{const c=document.createElement('button');c.className='chip';c.innerHTML='<i style="background:'+t.color+'"></i>'+esc(t.name)+' <span style="color:var(--mut)">'+nodes.filter(n=>n.type===t.id).length+'</span>';
 c.onclick=()=>{hidden.has(t.id)?hidden.delete(t.id):hidden.add(t.id);c.classList.toggle('off');alpha=.6};chips.appendChild(c)});
document.getElementById('sub').textContent=nodes.length+' düğüm · '+edges.length+' bağlantı';
document.getElementById('stat').textContent='Sürükle: taşı · Tekerlek/çimdik: yakınlaştır · Dokun: ayrıntı';
loop();
</script></body></html>
